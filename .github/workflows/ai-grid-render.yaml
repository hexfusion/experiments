# Everything under llm-d/ai-grid/argo-acm but grid.yaml, chart/, setup/'s seed, and the
# Makefile is rendered, never hand-edited. On main, an input change renders and commits it.
# On a pull request, generated output that differs from the render fails.
name: ai-grid-render

on:
  push:
    branches: [main]
    # Only inputs: the bot commit touches generated files alone, so it never retriggers this.
    paths:
      - llm-d/ai-grid/argo-acm/grid.yaml
      - llm-d/ai-grid/argo-acm/chart/**
      - llm-d/ai-grid/argo-acm/Makefile
      - .github/workflows/ai-grid-render.yaml
  pull_request:
    paths:
      - llm-d/ai-grid/argo-acm/**
      - .github/workflows/ai-grid-render.yaml

permissions:
  contents: read

concurrency:
  group: ai-grid-render-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_VERSION: v3.17.3
  DIR: llm-d/ai-grid/argo-acm

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Manifests match the render
        run: make -C "$DIR" check

  render:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Render
        run: make -C "$DIR" render
      - name: Commit the rendered output
        run: |
          git add -A "$DIR/apps" "$DIR/values" "$DIR/sites" "$DIR/hub" "$DIR/setup/root-app.yaml"
          if git diff --cached --quiet; then
            echo "manifests unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ai-grid: render manifests [skip ci]"
          git push
