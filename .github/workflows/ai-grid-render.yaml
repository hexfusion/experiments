# The AI Grid manifests under llm-d/ai-grid/argo-acm are rendered, never hand-edited.
# On main, a values change renders and commits them. On a pull request, a manifest that
# differs from the render fails.
name: ai-grid-render

on:
  push:
    branches: [main]
    # Only inputs: the bot commit touches manifests/ alone, so it never retriggers this.
    paths:
      - llm-d/ai-grid/argo-acm/chart.env
      - llm-d/ai-grid/argo-acm/Makefile
      - llm-d/ai-grid/argo-acm/values/**
      - llm-d/ai-grid/argo-acm/sites/*/values.yaml
      - llm-d/ai-grid/argo-acm/sites/*/site.yaml
      - llm-d/ai-grid/argo-acm/hub/*/values.yaml
      - llm-d/ai-grid/argo-acm/hub/*/target.yaml
      - .github/workflows/ai-grid-render.yaml
  pull_request:
    paths:
      - llm-d/ai-grid/argo-acm/**
      - .github/workflows/ai-grid-render.yaml

permissions:
  contents: read

concurrency:
  group: ai-grid-render-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_VERSION: v3.17.3
  DIR: llm-d/ai-grid/argo-acm

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Manifests match the render
        run: make -C "$DIR" check

  render:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Render
        run: make -C "$DIR" render
      - name: Commit the rendered manifests
        run: |
          git add -A "$DIR/sites" "$DIR/hub"
          if git diff --cached --quiet; then
            echo "manifests unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ai-grid: render manifests [skip ci]"
          git push
