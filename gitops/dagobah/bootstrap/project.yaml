apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dagobah-root
  namespace: openshift-gitops
spec:
  description: Root Application management for the Dagobah lab
  sourceRepos:
    - https://github.com/hexfusion/experiments.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openshift-gitops
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
