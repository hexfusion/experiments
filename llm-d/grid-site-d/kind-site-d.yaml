# site-d: a peer inference site on the LAN, reachable from other clusters.
#
# extraPortMappings bind host ports on every interface, so the services
# below are reachable at the laptop's LAN address rather than only from
# inside the podman network.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: site-d
nodes:
  - role: control-plane
    extraPortMappings:
      # OpenAI-compatible model endpoint
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "0.0.0.0"
        protocol: TCP
      # provider gateway, mTLS
      - containerPort: 30443
        hostPort: 30443
        listenAddress: "0.0.0.0"
        protocol: TCP
      # signals endpoint scraped by a peer's grid operator
      - containerPort: 30091
        hostPort: 30091
        listenAddress: "0.0.0.0"
        protocol: TCP
