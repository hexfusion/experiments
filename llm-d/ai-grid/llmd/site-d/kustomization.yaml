# site-d model server: the upstream llm-d optimized-baseline recipe (v0.10.0) on 2x T4.
# Router: helm install optimized-baseline oci://ghcr.io/llm-d/charts/llm-d-router-standalone
#   --version v0.11.0 -n llm-d -f <llm-d>/guides/recipes/router/base.values.yaml
#   -f <llm-d>/guides/optimized-baseline/router/optimized-baseline.values.yaml -f router.values.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-d
resources:
  - https://github.com/llm-d/llm-d//guides/optimized-baseline/modelserver/gpu/vllm/base?ref=v0.10.0
images:
  # The image proven on these T4s; upstream pins vllm-openai v0.30.0.
  - name: docker.io/vllm/vllm-openai
    newName: docker.io/vllm/vllm-openai
    digest: sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
labels:
  - pairs:
      llm-d.ai/model: Qwen3-Coder-30B-A3B
    includeSelectors: false
    includeTemplates: true
patches:
  - path: patch-site-d.yaml
