# helm get values optimized-baseline -n llm-d on site-d, 2026-10-04: the full user-supplied values
# (llm-d guide base and optimized-baseline files plus router.values.yaml), so the release can be
# reinstalled or moved between chart versions without the llm-d checkout.
router:
  epp:
    flags:
      v: 2
    pluginsConfigFile: optimized-baseline-plugins.yaml
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        # Plugins run with their built-in defaults: the prefix-cache-affinity-filter's
        # peakPrefillThroughput default (15928) is calibrated for this guide's reference
        # setup (Qwen3-32B on H100 80 GB, TP=2). For other hardware/models, measure your
        # own value with guides/recipes/router/calibration and set it on the filter.
        plugins:
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
    replicas: 1
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 2Gi
  extraServicePorts:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8081
  inferencePool:
    failureMode: FailOpen
  modelServers:
    matchLabels:
      llm-d.ai/guide: optimized-baseline
    protocol: http
  monitoring:
    prometheus:
      auth:
        enabled: false
  proxy:
    args:
    - --service-node
    - envoy-sidecar
    - --log-level
    - warn
    - --concurrency
    - "8"
    - --drain-strategy
    - immediate
    - --drain-time-s
    - "60"
    - -c
    - /etc/envoy/envoy.yaml
    proxyType: envoy
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 1Gi
  tracing:
    otelExporterEndpoint: http://localhost:4317
    sampling:
      sampler: parentbased_traceidratio
      samplerArg: "0.1"
