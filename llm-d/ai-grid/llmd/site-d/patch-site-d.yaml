apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimized-baseline-nvidia-gpu-vllm-decode
spec:
  replicas: 1
  # TP=2 holds both T4s, so a surge pod could never schedule.
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      runtimeClassName: nvidia
      containers:
        - name: modelserver
          args:
            - "cpatonn/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"
            - "--served-model-name"
            - "Qwen3-Coder-30B-A3B"
            - "qwen/qwen3-coder-30b-a3b-instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=2"
            - "--dtype=half"
            - "--gpu-memory-utilization=0.92"
            - "--max-model-len=32768"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=qwen3_coder"
            # Explicit cap so the grid's maxRunning matches the engine; KV holds about 59k tokens.
            - "--max-num-seqs=64"
          env:
            # The model is public and cached on the node, so no token is required.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
                  optional: true
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: HF_HOME
              value: /hf-cache
          resources:
            limits:
              cpu: "8"
              memory: 40Gi
              nvidia.com/gpu: 2
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - mountPath: /hf-cache
              name: hf-cache
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: hf-cache
          hostPath:
            path: /opt/hf-cache
            type: DirectoryOrCreate
