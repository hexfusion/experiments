apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, labels: { app: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      enableServiceLinks: false
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.31-latest
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts: [{ mountPath: /etc/envoy, name: config }]
      volumes: [{ name: config, configMap: { name: envoy-config, defaultMode: 420 } }]
