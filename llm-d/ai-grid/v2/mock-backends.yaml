apiVersion: apps/v1
kind: Deployment
metadata: { name: mock-us, labels: { app: mock-us, region: us-east-1 } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mock-us } }
  template:
    metadata: { labels: { app: mock-us, region: us-east-1 } }
    spec:
      containers:
        - name: mock
          image: ghcr.io/praxis-proxy/grid-mock-providers:v0.1.1
          args: ["--provider", "openai", "--port", "8080"]
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 2, periodSeconds: 10 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata: { name: mock-us }
spec: { selector: { app: mock-us }, ports: [{ name: http, port: 8080, targetPort: 8080 }] }
---
