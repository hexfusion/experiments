admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
static_resources:
  listeners:
    - name: ingress
      address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
      per_connection_buffer_limit_bytes: 33554432
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: v2
                route_config:
                  name: local
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: /, headers: [{ name: x-gateway-destination-endpoint, string_match: { exact: site-us-a } }] }
                          route: { cluster: site-us-a, timeout: 300s }
                        - match: { prefix: /, headers: [{ name: x-gateway-destination-endpoint, string_match: { exact: site-us-b } }] }
                          route: { cluster: site-us-b, timeout: 300s }
                        - match: { prefix: /, headers: [{ name: x-gateway-destination-endpoint, string_match: { exact: site-eu } }] }
                          route: { cluster: site-eu, timeout: 300s }
                        - match: { prefix: /, headers: [{ name: x-gateway-destination-endpoint, string_match: { exact: site-uk } }] }
                          route: { cluster: site-uk, timeout: 300s }
                        - match: { prefix: / }
                          direct_response: { status: 403, body: { inline_string: '{"error":"no in-region site"}' } }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      failure_mode_allow: false
                      allow_mode_override: false
                      mutation_rules: { allow_all_routing: true }
                      disable_clear_route_cache: false
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: BUFFERED
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                      grpc_service: { envoy_grpc: { cluster_name: ext_proc_cluster }, timeout: 300s }
                      message_timeout: 300s
                      metadata_options: { receiving_namespaces: { untyped: [envoy.lb] } }
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        response_mutations:
                          - append:
                              header: { key: x-grid-site, value: "%DYNAMIC_METADATA(envoy.lb:x-gateway-destination-endpoint)%" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: ext_proc_cluster
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            alpn_protocols: [h2]
            validation_context: { trust_chain_verification: ACCEPT_UNTRUSTED }
      load_assignment:
        cluster_name: ext_proc_cluster
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: praxis-extproc.ai-grid-v2.svc.cluster.local, port_value: 9004 } } } }] }]
    - name: site-us-a
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment: { cluster_name: site-us-a, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: mock-us.ai-grid-v2.svc.cluster.local, port_value: 8080 } } } }] }] }
    - name: site-us-b
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment: { cluster_name: site-us-b, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: mock-us.ai-grid-v2.svc.cluster.local, port_value: 8080 } } } }] }] }
    - name: site-eu
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment: { cluster_name: site-eu, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: mock-eu.ai-grid-v2.svc.cluster.local, port_value: 8080 } } } }] }] }
    - name: site-uk
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment: { cluster_name: site-uk, endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: mock-uk.ai-grid-v2.svc.cluster.local, port_value: 8080 } } } }] }] }
