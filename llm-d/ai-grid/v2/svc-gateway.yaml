apiVersion: v1
kind: Service
metadata: { name: praxis-extproc }
spec: { selector: { app: praxis-extproc }, ports: [{ name: grpc, port: 9004, targetPort: 9004 }] }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec: { selector: { app: gateway }, ports: [{ name: http, port: 8080, targetPort: 8080 }] }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: gateway }
spec:
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
  to: { kind: Service, name: gateway, weight: 100 }
  wildcardPolicy: None
