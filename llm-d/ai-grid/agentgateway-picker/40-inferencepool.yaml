# The CORRECT picker primitive for agentgateway: an InferencePool whose
# endpointPickerRef is the praxis picker. agentgateway then runs its
# InferencePoolRouter (a specialized ext_proc) that reads the picker's
# x-gateway-destination-endpoint and makes it the upstream -- unlike a generic
# extProc + dynamicForwardProxy, which ignores the picker entirely.
#
# selector + targetPorts are required (they describe the pool's own member pods).
# In destinationMode: passthrough the picker's returned address is dialed directly
# (FQDN DNS-resolved), so these are placeholders here (point at the picker pod).
# NOTE: destinationMode: passthrough is the load-bearing bit for the FQDN case and
# is NOT a field on any installed CRD in agentgateway v1.1.0 -- how to set it in k8s
# mode (annotation? version? standalone-only?) is the open item being researched.
# Default is Validated, which rejects an off-pool endpoint (our FQDN), so with this
# manifest alone expect the router to CONSUME the picker's endpoint (progress vs DFP)
# but likely reject the off-pool FQDN until passthrough is enabled.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: picker-pool
  namespace: aigw-demo
spec:
  selector:
    matchLabels:
      app: praxis-picker        # placeholder pool member; passthrough dials the picker's endpoint directly
  targetPorts:
    - number: 8080
  endpointPickerRef:
    group: ""
    kind: Service
    name: praxis-picker
    port:
      number: 9004
    failureMode: FailClose
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: picker-pool-route
  namespace: aigw-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aigw-demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: picker-pool
