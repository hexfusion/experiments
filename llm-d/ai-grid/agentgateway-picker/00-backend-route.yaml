# Agentgateway FQDN forwarding: the dynamic-forward-proxy backend + the route.
#
# dynamicForwardProxy makes agentgateway resolve and forward to the destination
# named by the request Host header / TLS SNI -- i.e. the gateway "keeps up with"
# FQDN, praxis only picks. PROVEN standalone: a request to the gateway with
# Host: echo-a.praxis-istio-demo.svc.cluster.local:8080 returns 200 in ~0.1s.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: dfp
  namespace: aigw-demo
spec:
  dynamicForwardProxy: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dfp-fqdn
  namespace: aigw-demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aigw-demo-gw
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: dfp
