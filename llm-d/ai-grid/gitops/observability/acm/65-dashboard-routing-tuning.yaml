                "lineWidth": 1,
                "fillOpacity": 25,
                "spanNulls": false,
                "stacking": {
                  "mode": "normal"
                }
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (reason) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\"}[$__rate_interval]))",
              "legendFormat": "{{reason}}",
              "refId": "A",
              "range": true,
              "instant": false
