# Generated by ../dashboards/routing_tuning.py; edit the script, not this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-grid-routing-tuning
  namespace: open-cluster-management-observability
  labels:
    grafana-custom-dashboard: "true"
  annotations:
    observability.open-cluster-management.io/dashboard-folder: AI Grid
    argocd.argoproj.io/sync-wave: "5"
data:
  ai-grid-routing-tuning.json: |
    {
      "title": "AI Grid routing tuning",
      "uid": "ai-grid-routing-tuning",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": [
        "ai-grid",
        "routing"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "description": "Where requests went, what the decider read, whether to trust it, and what it cost. Hub samples arrive every 60 s; point the datasource at a cluster's own querier for the fine view.",
      "annotations": {
        "list": [
          {
            "name": "Serving config reload",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "iconColor": "blue",
            "expr": "sum by (cluster, result) (increase(grid_serving_config_reload_total{cluster=~\"$cluster\"}[2m])) > 0",
            "titleFormat": "serving config reload",
            "textFormat": "{{cluster}} {{result}}",
            "step": "60s"
          },
          {
            "name": "Gateway pod started",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "iconColor": "orange",
            "expr": "count by (cluster, pod) (up{job=\"grid-gateway-metrics\",cluster=~\"$cluster\"}) unless count by (cluster, pod) (up{job=\"grid-gateway-metrics\",cluster=~\"$cluster\"} offset 2m)",
            "titleFormat": "gateway pod started",
            "textFormat": "{{cluster}} {{pod}}",
            "step": "60s"
          },
          {
            "name": "EPP pod started",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "iconColor": "purple",
            "expr": "count by (cluster, pod) (llm_d_epp_info{cluster=~\"$cluster\"}) unless count by (cluster, pod) (llm_d_epp_info{cluster=~\"$cluster\"} offset 2m)",
            "titleFormat": "EPP pod started",
            "textFormat": "{{cluster}} {{pod}}",
            "step": "60s"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "current": {},
            "hide": 0
          },
          {
            "name": "cluster",
            "type": "query",
            "label": "Cluster",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(up, cluster)",
              "refId": "cluster"
            },
            "definition": "label_values(up, cluster)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "site",
            "type": "query",
            "label": "Grid site",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(grid_route_site_weight, site)",
              "refId": "site"
            },
            "definition": "label_values(grid_route_site_weight, site)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "pool",
            "type": "query",
            "label": "Pool",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(vllm:num_requests_running, namespace)",
              "refId": "pool"
            },
            "definition": "label_values(vllm:num_requests_running, namespace)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Verdict",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Decided per second",
          "description": "Requests the grid gateways decided, every reason.",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\"}[$__rate_interval])))",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Refused",
          "description": "Share of decisions that refused the request: not ready, no route, bad request or shed.",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\",reason=~\"not_ready|no_route|bad_request|shed\"}[$__rate_interval]))) / sum(sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\"}[$__rate_interval])))",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Fallback",
          "description": "Share of decisions sent to a candidate only because no healthy one was left.",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\",reason=\"fallback\"}[$__rate_interval]))) / sum(sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\"}[$__rate_interval])))",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Oldest reading",
          "description": "The oldest sample any candidate's decision read. A rising value is a frozen input. Empty (NaN) until the gateway learns this candidate's capacity, which it does only when the operator relays grid_provider_config_generation with provider_uid, publisher_epoch, batch_sequence and batch_samples: an operator built from grid #386 or later.",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 17
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(grid_route_site_reading_age_seconds{cluster=~\"$cluster\",site=~\"$site\"})",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Candidates full",
          "description": "Candidates with a backlog at their ceiling long enough to shed. Empty (NaN) until the gateway learns this candidate's capacity, which it does only when the operator relays grid_provider_config_generation with provider_uid, publisher_epoch, batch_sequence and batch_samples: an operator built from grid #386 or later.",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(grid_route_site_full{cluster=~\"$cluster\",site=~\"$site\"} == 1) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Models shedding",
          "description": "Models the gateway sheds right now. The series appears with the first shed.",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(grid_route_shedding{cluster=~\"$cluster\"} == 1) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Candidates failing",
          "description": "How many candidates returned at least one error and not one 2xx in the last 10 minutes. A count over a rolling window, not a latch: it drops when the candidate succeeds again or its errors age out. Slow candidates do not count; requests still in flight are neither.",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count((((sum by (cluster, backend) (increase(praxis_http_requests_total{job=\"grid-gateway-metrics\",cluster=~\"$cluster\",status_class=~\"4xx|5xx\"}[10m]))) and on (cluster, backend) group by (cluster, backend) (grid_route_decisions_total{cluster=~\"$cluster\"})) > 0) unless on (cluster, backend) (sum by (cluster, backend) (increase(praxis_http_requests_total{job=\"grid-gateway-metrics\",cluster=~\"$cluster\",status_class=\"2xx\"}[10m])) > 0)) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Worst TTFT p95",
          "description": "The slowest pool's p95 time to first token.",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "noValue": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(histogram_quantile(0.95, sum by (le, cluster, namespace) (rate(vllm:time_to_first_token_seconds_bucket{cluster=~\"$cluster\",namespace=~\"$pool\"}[$__rate_interval]))))",
              "legendFormat": "",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "row",
          "title": "Where requests went",
          "id": 10,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Routed per candidate",
          "description": "Requests each gateway sent to each candidate, routed and fallback.",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 25,
                "spanNulls": false,
                "stacking": {
                  "mode": "normal"
                }
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "label_replace(label_replace(sum by (cluster, site, backend) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\",reason=~\"routed|fallback\"}[$__rate_interval])), \"candidate\", \"$1\", \"backend\", \"(.*)\"), \"candidate\", \"$1\", \"backend\", \"grid-(.+)-[^-]+-[^-]+-[0-9a-f]{16,}\")",
              "legendFormat": "{{site}} / {{candidate}}",
              "refId": "A",
              "range": true,
              "instant": false
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Achieved share against target",
          "description": "Solid: the share each candidate got. Dashed: its capacity share, the by_capacity target. Dotted: capacity over 1 + rho, the between_two target (clamped to 0.1 to 0.9). With three or more candidates (two_choices) the achieved share should sit between the two, nearer the dotted line as the spread in rho grows.",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "interval": "2m",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0,
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "mappings": [],
              "min": 0,
              "max": 1
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        6
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "C"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        2,
                        4
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "label_replace(label_replace(sum by (cluster, site, backend) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\",reason=~\"routed|fallback\"}[$__rate_interval])) / on (cluster) group_left sum by (cluster) (sum by (cluster, site, backend) (rate(grid_route_decisions_total{cluster=~\"$cluster\",site=~\"$site\",reason=~\"routed|fallback\"}[$__rate_interval]))), \"candidate\", \"$1\", \"backend\", \"(.*)\"), \"candidate\", \"$1\", \"backend\", \"grid-(.+)-[^-]+-[^-]+-[0-9a-f]{16,}\")",
              "legendFormat": "{{candidate}} achieved",
              "refId": "A",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
