{{- if .Values.localServing.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grid-model-credential-reader
  namespace: {{ .Values.localServing.identity.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.localServing.identity.tokenSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grid-model-credential-reader
  namespace: {{ .Values.localServing.identity.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grid-model-credential-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.localServing.gridOperator.serviceAccount }}
    namespace: {{ .Values.localServing.gridOperator.namespace }}
{{- end }}
