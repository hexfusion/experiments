blockers:
- Qualify the installed KServe controllers with a real LLMInferenceService, InferencePool/EPP, protected
  serving gateway and pinned ODH model runtime.
- Package the validated AI Gateway controller GOMEMLIMIT=192MiB setting through its manifest owner; current
  lab override survives reconciliation but is manual.
- Validate PR 966 provider publication and protected serving-gateway inference using the installed controller
  and matching KServe-owned RBAC.
- Publish MaaS model registrations with ExternalProvider/grid as their only provider; keep individual
  serving candidates inside Grid.
- Decide whether Grid 386 is required for this rollout and whether custom builds need 384.
- Consume the SiteInvite ODH sync with matching chart and platform-owned CRD packaging.
- Implement invite delivery/pruning and validate the MaaS-to-Grid trusted proxy contract.
- Resolve or constrain provider endpoint base paths (Grid issue 248).
- Select and verify matching ODH or custom artifacts for the selected sources.
- Render the new MaaS setup and validate database/schema compatibility.
- Extend the verified hub Grid operator installation to spokes after payload qualification.
