# Site configuration comes from ../../sites/<site>/site.yaml.
source:
  repoURL: https://github.com/hexfusion/experiments.git
  revision: main
localServing:
  enabled: false
gridGateway:
  enabled: false
# Gateways on remote sites, one Application each. Values come from the site's gateway.yaml.
siteGateways: []
observability:
  logging:
    enabled: false
  acm:
    enabled: false
