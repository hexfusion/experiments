apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ required "cluster.name is required" .Values.cluster.name | quote }}
  namespace: {{ .Values.argocd.namespace | quote }}
spec:
  project: {{ printf "%s-root" .Values.cluster.name | quote }}
  source:
    repoURL: {{ .Values.source.repoURL | quote }}
    targetRevision: {{ .Values.source.revision | quote }}
    path: {{ .Values.source.path | quote }}
    helm:
      valueFiles:
        - {{ required "source.valuesFile is required" .Values.source.valuesFile | quote }}
  destination:
    server: {{ .Values.cluster.server | quote }}
    namespace: {{ .Values.argocd.namespace | quote }}
  # Manual sync during migration; no automated prune or cascade deletion.
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
