{{- if .Values.localServing.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-local-models" .Values.cluster.name }}
  namespace: {{ .Values.argocd.namespace }}
spec:
  project: default
  source:
    repoURL: {{ .Values.source.repoURL | quote }}
    targetRevision: {{ .Values.source.revision | quote }}
    path: llm-d/ai-grid/gitops/workloads/local-models
    helm:
      valueFiles:
        - {{ printf "../%s" .Values.source.valuesFile | quote }}
  destination:
    server: {{ .Values.cluster.server | quote }}
    namespace: {{ .Values.localServing.identity.namespace }}
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: {{ .Values.localServing.identity.tokenSecret }}
      namespace: {{ .Values.localServing.identity.namespace }}
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
{{- end }}
