    source: 'manifests-config.yaml at e1445db9'
    RELATED_IMAGE_ODH_PRAXIS_AI_GRID_OPERATOR_IMAGE: quay.io/opendatahub/odh-praxis-ai-grid-operator@sha256:b3d6341a03446675a728fe18aab439c51eb4089b738656303d283a76ff6bf79a
