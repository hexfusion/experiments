  checkedAt: '2026-10-19T12:40:00+00:00'
  scope: Replace every custom image with a published ODH image
  gridLayerFullyOdh: true
  gridLayer:
  - Platform operator, replacement published and contains #4186
  - Grid operator, replacement published and all carries upstream
  - Grid gateway, replacement published and routing code unchanged
  - Grid enrollment, replacement published, moves off the chart's GHCR default
  direction: 'Replace every custom image with the stock ODH build, including the MaaS layer, and test.
    A carry is justified by a measured failure on ODH images, not by its own history. Where ODH fails,
    file the bug against the component instead of re-applying the patch.'
  replaceAndTest:
  - id: praxis-effective-processing-modes
    stockImage: quay.io/opendatahub/odh-praxis-extproc@sha256:d8fb6f0459832937d4e4b4f286bffb8b3e6f179d95aa485ef4de5d70774e1866
    upstreamSearch: 'Not upstream at praxis-extproc 5705f097: src/config/ does not exist as a module and
      no server.processing_mode option is defined. PR #156 (json_body conditional) is model-to-header
      work and does not touch body-mode handling.'
    expectedResult: fail
    expectedError: 'received RequestBody message while its body mode is NONE'
    gate: 'tests/maas-extproc/reproduce.py --expect fixed'
    onFailure: file-bug-against-praxis-extproc
  - id: controller-effective-processing-modes
    upstreamSearch: 'No upstream PR. The stock controller emits no processing_mode block, so stock
      controller plus stock extproc reproduces the baseline failure.'
    expectedResult: fail
    onFailure: 'Depends on the extproc bug; the controller change only has a home once extproc accepts
      a configured mode.'
  - id: kserve-module-grid-rbac
    stockImage: quay.io/opendatahub/odh-kserve-module-operator@sha256:5d4b544740ab8af11a6d8b4308cf04223ec7b8d5bcb989fc6ea1b1c8f8ec6a84
    upstreamSearch: 'ODH odh-stable is unchanged at kserve db12bf00, the same build the 2026-10-16 pass
      found lacking the merged #966 Grid InferenceProvider RBAC.'
    expectedResult: fail
    expectedSymptom: 'Grid InferenceProvider publishing denied by RBAC'
    onFailure: 'Request a KServe module refresh that packages the merged #966 role; the OMC source change
      is already merged at 9b1822e4.'
  boundary: 'The three remaining carries sit in the MaaS ExternalModel front door, not in the Grid
    routing path. The Grid itself runs ODH-only.'
