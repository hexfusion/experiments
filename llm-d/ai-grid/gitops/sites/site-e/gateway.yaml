fullnameOverride: grid-gateway
image:
  repository: quay.io/opendatahub/odh-praxis-grid-gateway
  digest: sha256:1d73c49f606695eaabc15c2b1435fcbc5dfb1fc5d87dc422d46513fc056f3ddc
  tag: ''
  flavor: grid-gateway
imageUser:
  enabled: false
port:
  containerPort: 8443
service:
  type: LoadBalancer
  port: 443
gatewayConfig:
  render: true
  role: provider
  localSite: site-e
  peerTrust:
    mode: spiffe
    spiffeIds:
    - spiffe://grid.internal/site/dagobah
  backends:
  - cluster: local
    endpoints:
    - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-e.svc:8000
    transport:
      mode: tls
      sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-e.svc
      ca:
        configMap: openshift-service-ca.crt
        key: service-ca.crt
    trustPrivate: true
tls:
  enabled: true
  existingSecret: grid-site-identity
  caSecret: grid-ca
  mountPath: /etc/praxis/tls
metricsListener:
  enabled: true
  existingSecret: grid-gateway-metrics-tls
  fromNamespaces:
  - openshift-user-workload-monitoring
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: grid-gateway-metrics-tls
  serviceMonitor:
    enabled: true
    caConfigMap:
      name: openshift-service-ca.crt
      key: service-ca.crt
networkPolicy:
  enabled: true
  from:
  - ipBlock:
      cidr: 192.168.1.0/24
  - ipBlock:
      cidr: 10.128.0.0/14
