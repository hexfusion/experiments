fullnameOverride: grid-gateway
image:
  repository: quay.io/sbatsche/grid-gateway
  digest: sha256:fdb7f28915eecdfa04a816e34f22028e2b190b92dfb05baf56f1e63d13da474b
  tag: ''
  flavor: grid-gateway
imageUser:
  enabled: false
port:
  containerPort: 8443
service:
  type: LoadBalancer
  port: 443
  # The address dagobah dials for site-e; .216 is unreachable from dagobah.
  loadBalancerIP: 192.168.1.218
gatewayConfig:
  render: true
  role: provider
  localSite: site-e
  peerTrust:
    mode: spiffe
    spiffeIds:
    - spiffe://grid.internal/site/dagobah
  backends:
  - cluster: local
    endpoints:
    - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-e.svc:8000
    transport:
      mode: tls
      sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-e.svc
      ca:
        configMap: openshift-service-ca.crt
        key: service-ca.crt
    trustPrivate: true
tls:
  enabled: true
  existingSecret: grid-site-identity
  caSecret: grid-ca
  mountPath: /etc/praxis/tls
metricsListener:
  enabled: true
  existingSecret: grid-gateway-metrics-tls
  fromNamespaces:
  - openshift-user-workload-monitoring
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: grid-gateway-metrics-tls
  serviceMonitor:
    enabled: true
    caConfigMap:
      name: openshift-service-ca.crt
      key: service-ca.crt
networkPolicy:
  enabled: true
  from:
  # LoadBalancer traffic from dagobah arrives SNATed as host-network under OVN-Kubernetes.
  - namespaceSelector:
      matchLabels:
        policy-group.network.openshift.io/host-network: ""
  - ipBlock:
      cidr: 192.168.1.0/24
  - ipBlock:
      cidr: 10.128.0.0/14
