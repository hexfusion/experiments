management: manual-canary; not automatically applied by Argo
maas:
  tenantNamespace: models-as-a-service
  tenantConfigName: default-tenant
  payloadProcessingType: praxis
  chartValues:
    operator:
      enabled: false
    skipCrdCheck: true
    components:
      aigateway:
        dsc:
          managementState: Managed
          modelsAsAService:
            managementState: Managed
          aiGrid:
            managementState: Managed
        modelsAsAService:
          gateway:
            openshiftRoute:
              enabled: true
              host: maas.apps.dagobah.hexfusion.local
            spec:
              listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Selector
                    selector:
                      matchLabels:
                        maas-gateway-access: 'true'
  registration:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: grid-integration-probe
      namespace: models-as-a-service
    automountServiceAccountToken: false
  - apiVersion: inference.opendatahub.io/v1alpha1
    kind: ExternalProvider
    metadata:
      name: grid
      namespace: models-as-a-service
    spec:
      provider: openai
      endpoint: grid-gateway.grid.svc
      auth:
        type: apikey
        secretRef:
          name: grid-provider-key
      config:
        tls.caCertificates: /etc/istio/grid-ca/service-ca.crt
  - apiVersion: inference.opendatahub.io/v1alpha1
    kind: ExternalModel
    metadata:
      name: qwen3-coder-30b-a3b
      namespace: models-as-a-service
    spec:
      modelName: qwen3-coder-30b-a3b
      externalProviderRefs:
      - ref:
          name: grid
        targetModel: qwen3-coder-30b-a3b
        apiFormat: openai-chat
        path: /v1/chat/completions
  - apiVersion: maas.opendatahub.io/v1alpha1
    kind: MaaSModelRef
    metadata:
      name: qwen3-coder-30b-a3b
      namespace: models-as-a-service
    spec:
      modelRef:
        kind: ExternalModel
        name: qwen3-coder-30b-a3b
  - apiVersion: maas.opendatahub.io/v1alpha1
    kind: MaaSAuthPolicy
    metadata:
      name: grid-canary-access
      namespace: models-as-a-service
    spec:
      modelRefs:
      - name: qwen3-coder-30b-a3b
        namespace: models-as-a-service
      subjects:
        users:
        - system:serviceaccount:models-as-a-service:grid-integration-probe
  - apiVersion: maas.opendatahub.io/v1alpha1
    kind: MaaSSubscription
    metadata:
      name: grid-canary
      namespace: models-as-a-service
    spec:
      owner:
        users:
        - system:serviceaccount:models-as-a-service:grid-integration-probe
      modelRefs:
      - name: qwen3-coder-30b-a3b
        namespace: models-as-a-service
        tokenRateLimits:
        - limit: 10000
          window: 1m
      priority: 10
  gatewayCAPatch:
    spec:
      template:
        spec:
          volumes:
          - name: grid-upstream-ca
            configMap:
              name: grid-upstream-ca
          containers:
          - name: istio-proxy
            volumeMounts:
            - name: grid-upstream-ca
              mountPath: /etc/istio/grid-ca
              readOnly: true
  rhclSubscription:
    namespace: kuadrant-system
    name: rhcl-operator
    config:
      env:
      - name: AUTH_SERVICE_TIMEOUT
        value: 2s
      resources:
        requests:
          memory: 512Mi
          cpu: 200m
        limits:
          memory: 1Gi
          cpu: 200m
