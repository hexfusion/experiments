cluster:
  name: dagobah
  server: https://kubernetes.default.svc
argocd:
  namespace: openshift-gitops
source:
  repoURL: https://github.com/hexfusion/experiments.git
  revision: main
  path: llm-d/ai-grid/gitops/charts/applications
  valuesFiles:
  - ../../sites/dagobah/site.yaml
  - ../../sites/dagobah/gateway.yaml
localServing:
  enabled: true
  applicationName: dagobah-local-models
  gridOperator:
    namespace: odh-ai-grid
    serviceAccount: grid-operator
  # The grid operator creates GridNetwork grid when the site identity appears.
  networkName: grid
  network:
    create: false
  siteName: dagobah
  identity:
    namespace: odh-ai-grid
    createNamespace: false
    serviceAccount: grid-model-client
    tokenSecret: grid-model-client-token
  gateway:
    name: qwen-serving
    namespace: openshift-ingress
    className: data-science-gateway-class
  runtimeEnv:
    LD_LIBRARY_PATH: /usr/lib64:/usr/local/cuda/lib64
    NUMBA_CUDA_DRIVER: /usr/lib64/libcuda.so.1
  instances:
  - namespace: qwen-local-a
    node: endor.dagobah.hexfusion.local
  - namespace: qwen-local-b
    node: worker2.dagobah.hexfusion.local
  valuesFiles:
  - ../../models/qwen3-coder-30b-a3b/dagobah.yaml
  - ../../sites/dagobah/site.yaml
gridEnrollment:
  enabled: true
  namespace: odh-ai-grid-enrollment
  releaseName: grid-enrollment
  chart:
    repoURL: https://github.com/opendatahub-io/praxis-ai-grid-operator.git
    revision: dbd7f199dedb3f931b8ce5750022f6ff577c094c
    path: charts/grid-enrollment
  values:
    host: enroll.apps.dagobah.hexfusion.local
    image:
      repository: quay.io/opendatahub/odh-praxis-grid-enrollment
      digest: sha256:61a5f98d857fad2fc9bb011cfa20de799314f001ad69d337eb412b55268ea4a3
    route:
      enabled: true
      host: enroll.apps.dagobah.hexfusion.local
    hubSite:
      name: dagobah
      namespace: odh-ai-grid
    enrollment:
      # A grid-admin ServiceAccount to mint tokens from; approval stays a person.
      gridAdmins:
        serviceAccount:
          create: true
          name: grid-admin
    # Each invite mints a one-time token into Secret grid-invite-<siteName> here.
    invites:
    - siteName: site-e
      gridNetworkRef: grid
siteGateways:
- name: site-e
  server: https://api.site-e.hexfusion.local:6443
  namespace: odh-ai-grid
  releaseName: grid-gateway
  chart:
    repoURL: https://github.com/opendatahub-io/praxis-ai-grid-operator.git
    revision: dbd7f199dedb3f931b8ce5750022f6ff577c094c
    path: charts/praxis-gateway
  valuesFile: llm-d/ai-grid/gitops/sites/site-e/gateway.yaml
observability:
  logging:
    enabled: true
  acm:
    enabled: true
