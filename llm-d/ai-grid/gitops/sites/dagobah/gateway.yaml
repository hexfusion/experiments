# The dagobah grid gateway. Mirrors the live Application dagobah-grid-gateway as of 2026-10-18,
# which had drifted from this file by hand patches (the qwen-local-c backend and metricsListener).
gridGateway:
  enabled: true
  namespace: grid
  releaseName: grid-gateway
  chart:
    repoURL: https://github.com/opendatahub-io/praxis-ai-grid-operator.git
    revision: 45c8cc538a0463ce74c603ca59c1ca2097ba9dba
    path: charts/praxis-gateway
  values:
    fullnameOverride: grid-gateway
    gatewayConfig:
      auth:
        mode: none
      backends:
      - cluster: grid-qwen-local-a-qwen3-coder-32043b452d216289e8a78eecad00e5485
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-a.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-a.svc
        trustPrivate: true
      - cluster: grid-qwen-local-b-qwen3-coder-3b38c30722f75942dc2e2fa5dc63129ab
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-b.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-b.svc
        trustPrivate: true
      - cluster: grid-qwen-local-c-qwen3-coder-3185ad9137d5271b6011cb1063b0bac97
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-c.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-c.svc
        trustPrivate: true
      - cluster: grid-qwen-local-s1-qwen3-coder-5df6933ce4f1c87b0cebe688d03813b6
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s1.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s1.svc
        trustPrivate: true
      - cluster: grid-qwen-local-s2-qwen3-coder-f24fb98c90c01253ace0f9e42bde973f
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s2.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s2.svc
        trustPrivate: true
      - cluster: grid-qwen-local-s3-qwen3-coder-f4af23d85b6066afcbc8a600c19fe3f8
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s3.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s3.svc
        trustPrivate: true
      - cluster: grid-qwen-local-s4-qwen3-coder-dc9dfb11627501e7ecbb80b443b00d36
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s4.svc:8000
        site: dagobah
        transport:
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-s4.svc
        trustPrivate: true
      - cluster: grid-qwen-local-e-qwen3-coder-34b11154e22b6614851fa8910457f6831
        endpoints:
        - 192.168.1.218:443
        site: site-e
        transport:
          mode: mutual_tls
          sni: site-e.grid.internal
      listenerTls:
        enabled: true
        existingSecret: grid-gateway-tls
        mountPath: /etc/praxis/listener-tls
      localSite: dagobah
    gridServing:
      enabled: true
      gatewayRef: grid-gateway
      network: dagobah-local
    image:
      digest: sha256:1d73c49f606695eaabc15c2b1435fcbc5dfb1fc5d87dc422d46513fc056f3ddc
      flavor: grid-gateway
      repository: quay.io/opendatahub/odh-praxis-grid-gateway
      tag: ''
    imageUser:
      enabled: false
    metricsListener:
      enabled: true
      existingSecret: grid-gateway-metrics-tls
      fromNamespaces:
      - openshift-user-workload-monitoring
      service:
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: grid-gateway-metrics-tls
      serviceMonitor:
        caConfigMap:
          key: service-ca.crt
          name: openshift-service-ca.crt
        enabled: true
    networkPolicy:
      enabled: true
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-ingress
        podSelector:
          matchLabels:
            gateway.networking.k8s.io/gateway-name: maas-default-gateway
      - podSelector:
          matchLabels:
            app: grid-integration-probe
    port:
      containerPort: 8443
    service:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: grid-gateway-tls
      port: 443
      type: ClusterIP
    tls:
      caSecret: grid-ca
      enabled: true
      existingSecret: grid-site-identity
      mountPath: /etc/praxis/tls
