# The dagobah grid gateway on the odh-ai-grid layout. Backends a and b are the providers the
# model controller generated after the 2026-10-19 reinstall; site-e keeps its pre-reinstall backend until it rejoins.
gridGateway:
  enabled: true
  namespace: odh-ai-grid
  releaseName: grid-gateway
  chart:
    repoURL: https://github.com/hexfusion/grid.git
    revision: 47dae289726d26326a9fed0916556b731294ff8e
    path: charts/praxis-gateway
  values:
    fullnameOverride: grid-gateway
    gatewayConfig:
      auth:
        mode: none
      backends:
      - cluster: grid-qwen-local-a-qwen3-coder-39dcfdae82609f938bbe2ba11ee736a3c
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-a.svc:8000
        site: dagobah
        trustPrivate: true
        transport:
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-a.svc
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
      - cluster: grid-qwen-local-b-qwen3-coder-37c4fb4dc62743fa1324015e0e8af6d2d
        endpoints:
        - qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-b.svc:8000
        site: dagobah
        trustPrivate: true
        transport:
          mode: tls
          sni: qwen3-coder-30b-a3b-kserve-workload-svc.qwen-local-b.svc
          ca:
            configMap: openshift-service-ca.crt
            key: service-ca.crt
      - cluster: grid-qwen-local-e-qwen3-coder-34b11154e22b6614851fa8910457f6831
        # A cut-off site drops the SYN; without this a picked request hangs for the kernel SYN timeout (~130 s).
        connectTimeoutMs: 2000
        # Bounds TCP plus the mTLS handshake; connectTimeoutMs covers TCP only.
        totalConnectTimeoutMs: 4000
        endpoints:
        - 192.168.1.218:443
        site: site-e
        transport:
          mode: mutual_tls
          sni: site-e.grid.internal
      listenerTls:
        enabled: true
        existingSecret: grid-gateway-tls
        mountPath: /etc/praxis/listener-tls
      localSite: dagobah
    gridServing:
      enabled: true
      gatewayRef: grid-gateway
      network: grid
    image:
      digest: sha256:103b5f7bdf3480519e5a35e1b6d590c25c6fd1e9c8a0f59c17839a05660b7b5a
      flavor: grid-gateway
      repository: quay.io/sbatsche/grid-gateway
      tag: ''
    imageUser:
      enabled: false
    metricsListener:
      enabled: true
      existingSecret: grid-gateway-metrics-tls
      fromNamespaces:
      - openshift-user-workload-monitoring
      service:
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: grid-gateway-metrics-tls
      serviceMonitor:
        caConfigMap:
          key: service-ca.crt
          name: openshift-service-ca.crt
        enabled: true
    networkPolicy:
      enabled: true
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: openshift-ingress
        podSelector:
          matchLabels:
            gateway.networking.k8s.io/gateway-name: maas-default-gateway
      - podSelector:
          matchLabels:
            app: grid-integration-probe
    port:
      containerPort: 8443
    service:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: grid-gateway-tls
      port: 443
      type: ClusterIP
    tls:
      caSecret: grid-ca
      enabled: true
      existingSecret: grid-site-identity
      mountPath: /etc/praxis/tls
