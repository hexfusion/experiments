apiVersion: v1
kind: Service
metadata:
  labels:
    app: tempo
  name: tempo
  namespace: grid-system
spec:
  ports:
  - name: http
    port: 3200
    protocol: TCP
    targetPort: 3200
  - name: otlp-grpc
    port: 4317
    protocol: TCP
    targetPort: 4317
  - name: otlp-http
    port: 4318
    protocol: TCP
    targetPort: 4318
  selector:
    app: tempo
  type: ClusterIP

