plugin_settings:
  routing_enabled: true
plugins:
  - name: user-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    on_error: fail
    config:
      header: Authorization
      role: user
      trusted_issuers:
        - issuer: "https://grid.internal/idp"
          audiences: ["ai-grid"]
          algorithms: ["HS256"]
          decoding_key:
            kind: secret
            secret: "ai-grid-demo-secret-change-me"
      claim_mapper: standard
  - name: token-quota
    kind: quota
    hooks: [cmf.llm_input, cmf.llm_output]
    capabilities: [read_subject, read_claims]
    on_error: deny
    config:
      endpoint: "http://limitador-quota.ai-grid-v3.svc.cluster.local:8080"
      namespace: grid-tokens
      identity_claim: sub
      usage_json_path: usage.total_tokens

global:
  authentication: [user-jwt]
  authorization:
    pre_invocation: ["require(authenticated)"]
  response:
    status: 401
    body: "{\"error\":\"authentication required\"}"
