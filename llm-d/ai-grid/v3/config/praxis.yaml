admin:
  address: "0.0.0.0:9901"

listeners:
  - name: gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: policy
        config_path: /etc/praxis/policy.yaml
        require_protocol_metadata: false
      - filter: model_to_header
        header: X-Gateway-Model-Name
      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-gateway-model-name: "Qwen3-Coder-30B-A3B"
            cluster: sites
          - path_prefix: "/"
            cluster: sites
      - filter: token_rate_limit
        key: authenticated_subject
        rules:
          - name: default
            algorithm: sliding_window
            window: 1h
            capacity: 100
            reserved_tokens: 20
      - filter: token_count
        provider: openai
      - filter: load_balancer
        clusters:
          - name: sites
            endpoints:
              - "mock-us.ai-grid-v3.svc.cluster.local:8080"
              - "mock-eu.ai-grid-v3.svc.cluster.local:8080"
              - "mock-uk.ai-grid-v3.svc.cluster.local:8080"

insecure_options:
  allow_private_endpoints: true
  allow_unbounded_body: true
  allow_public_admin: true
  allow_private_upstreams: true
