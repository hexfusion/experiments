apiVersion: v1
kind: Service
metadata:
  name: praxis-gateway-v3
  namespace: ai-grid-v3
spec:
  selector:
    app: praxis-gateway-v3
  ports:
    - { name: http, port: 8080, targetPort: 8080, protocol: TCP }
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: praxis-gateway-v3
  namespace: ai-grid-v3
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: praxis-gateway-v3
    weight: 100
  wildcardPolicy: None
