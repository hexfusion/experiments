apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grid-gateway
  namespace: grid-system
spec:
  # host omitted on purpose: OpenShift generates <route>-<ns>.<cluster apps domain>,
  # so the package carries no cluster-specific hostname.
  port:
    targetPort: https
  tls:
    # re-encrypt, not edge: the frontdoor Envoy serves its own TLS (8443).
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: grid-gateway
    weight: 100
  wildcardPolicy: None
