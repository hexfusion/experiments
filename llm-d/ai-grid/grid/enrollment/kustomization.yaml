apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The enrollment service (mints the grid's trust material) + its postgres.
# The enrollment pod mounts the `enrollment-ca` secret at /ca (ca-cert.pem,
# ca-key.pem, operators.txt) -- that secret is generated by the bootstrap and
# is deliberately NOT committed here (see SECRETS.md).
resources:
  - imagestream.yaml
  - deployment-db.yaml
  - service-db.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
