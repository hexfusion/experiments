apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-operator
  namespace: grid-system
  labels:
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/managed-by: grid-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-operator
    spec:
      serviceAccountName: grid-operator
      # Kubernetes injects legacy docker-link env vars (e.g. GRID_GATEWAY_PORT
      # from the grid-gateway Service) that collide with this operator's own
      # GRID_* config namespace. Disable them so only explicit env is seen.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Project-owned image pinned to an immutable digest.
          # For Kind validation, xtask loads grid-operator:latest locally
          image: grid-operator
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GRID_SWIM_BIND_ADDR
              value: "0.0.0.0:7946"
            - name: GRID_SWIM_ADVERTISE_ADDR
              value: "$(POD_IP):7946"
            - name: GRID_SWIM_SITE_NAME
              value: "hub"
            - name: GRID_SWIM_SEEDS
              value: ""
            - name: GRID_GATEWAY_ADDRESS
              value: ""
            - name: GRID_METRICS_ADDR
              value: "0.0.0.0:9090"
            - name: RUST_LOG
              value: "info"
          ports:
            - name: swim-udp
              containerPort: 7946
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
