apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The grid-operator as one self-contained unit: identity, RBAC, workload, and
# its two services. NOT gridnetwork.yaml -- that CR needs the enrollment trust
# secrets (hub-ca/hub-identity/hub-swim-key) and is applied in step 01.
resources:
  - service-account.yaml
  - cluster-role-crd.yaml
  - cluster-role-resources.yaml
  - cluster-role-binding-crd.yaml
  - role-binding-default.yaml
  - role-binding-grid-system.yaml
  - deployment.yaml
  - svc-grid-operator.yaml
  - svc-grid-operator-swim.yaml
