apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grid-gateway-extproc
  name: grid-gateway-extproc
  namespace: grid-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grid-gateway-extproc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grid-gateway-extproc
    spec:
      enableServiceLinks: false
      containers:
        - name: praxis-extproc
          image: praxis-extproc
          imagePullPolicy: Always
          args: ["-c", "/etc/praxis/extproc.yaml"]
          ports:
            - { containerPort: 9004, name: grpc, protocol: TCP }
            - { containerPort: 50052, name: health, protocol: TCP }
            - { containerPort: 9090, name: metrics, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { mountPath: /etc/praxis, name: config }
            # grid identity for intelligent_route's signals_tls (calls the operator :9091)
            - { mountPath: /etc/praxis/grid, name: grid-identity, readOnly: true }
      volumes:
        - name: config
          configMap: { name: grid-gateway-extproc-config, defaultMode: 420 }
        - name: grid-identity
          projected:
            defaultMode: 420
            sources:
              - secret:
                  name: hub-identity
                  items:
                    - { key: tls.crt, path: tls.crt }
                    - { key: tls.key, path: tls.key }
              - secret:
                  name: hub-ca
                  items:
                    - { key: ca.crt, path: ca.crt }
