# Model server for a kserve site (site-a / site-b share this template; per-site
# values differ). LLMInferenceService = model + fused EPP; the scheduler is the
# flow-control EndpointPickerConfig (mirrors router/<site>/scheduler.yaml).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  finalizers:
  - serving.kserve.io/llmisvc-finalizer
  name: qwen3
  namespace: "{ns}"
spec:
  model:
    name: "{served_model}"
    uri: "{model}"
  replicas: 1
  router:
    gateway:
      refs:
      - name: "maas-{site}-gateway"
        namespace: openshift-ingress
    route: {}
    scheduler:
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          # flowControl admission disabled deliberately -- it sheds heavily on this
          # hardware (measured site-b 86% vs site-a 18% 500-rate at 16 streams;
          # ~4% residual with it off). See feedback_grid_signals_never_federate.
          # This 5-plugin block is the LIVE applied config on BOTH sites (verified
          # via kubectl.kubernetes.io/last-applied-configuration). The older
          # 9-plugin flowControl config, metrics-data-source:https, and the EPP-mTLS
          # scheduler.template override were never what actually ran -- dropped.
          featureGates: []
          plugins:
            - type: single-profile-handler
            - type: queue-scorer
            - type: prefix-cache-scorer
            - type: active-request-scorer
              parameters:
                idleThreshold: 0
                maxBusyScore: 0
                requestTimeout: "2m"
            - type: max-score-picker
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: active-request-scorer
                  weight: 3
                - pluginRef: max-score-picker
  template:
    containers:
    - env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            key: HF_TOKEN
            name: hf-token
      - name: HF_HOME
        value: /cache/hf
      - name: HF_HUB_CACHE
        value: /cache/hf/hub
      - name: XDG_CACHE_HOME
        value: /cache
      - name: VLLM_CACHE_ROOT
        value: /cache/vllm
      - name: TRITON_CACHE_DIR
        value: /cache/triton
      - name: VLLM_ADDITIONAL_ARGS
        value: "--max-model-len {max_model_len} --gpu-memory-utilization {gpu_mem_util} --tensor-parallel-size {tp} --dtype {dtype} --enable-auto-tool-choice --tool-call-parser qwen3_coder"
      name: main
      # Explicit HTTP liveness probe (DEMO-SHORTCUT, pairs with plaintext vLLM :8000
      # from the enableLLMInferenceServiceTLS=false toggle -- see REPRODUCE.md).
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTP
        failureThreshold: 10
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1
      resources:
        limits:
          cpu: "{cpu}"
          memory: "{mem}"
          nvidia.com/gpu: "{gpus}"
        requests:
          cpu: '2'
          memory: 8Gi
          nvidia.com/gpu: "{gpus}"
      volumeMounts:
      - mountPath: /cache
        name: cache
      - mountPath: /dev/shm
        name: shm
    nodeSelector:
      kubernetes.io/hostname: "{node}.{domain}"
      nvidia.com/gpu.product: "{gpu_product}"
    volumes:
    - emptyDir:
        sizeLimit: 30Gi
      name: cache
    - emptyDir:
        medium: Memory
        sizeLimit: 8Gi
      name: shm
