apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    opendatahub.io/managed: 'false'
  labels:
    istio.io/rev: openshift-gateway
  name: maas-site-b-gateway
  namespace: openshift-ingress
spec:
  gatewayClassName: data-science-gateway-class
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    hostname: "site-b.apps.{domain}"
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ''
        kind: Secret
        name: maas-site-b-gateway-tls
      mode: Terminate

