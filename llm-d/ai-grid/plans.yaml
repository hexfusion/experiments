# Grid service plans -- the single source of truth, owned by the hub.
#
# A plan carries two dimensions:
#   entitlement (rate limit) -> the token's grid_rate/grid_burst, metered at the frontdoor
#   service class (flow control) -> the priority band + SLO, enforced at the site EPP
#
# Define a plan once here. Everything else is generated from it:
#   plan -> a minted token (sub, tier, grid_rate, grid_burst)   the consumer credential
#        -> InferenceObjective (per pool)                        the named band on a site
#        -> flowControl priorityBand (in the EPP)                the enforcement
# The `describe` line is what the console and the demo put on screen.

plans:

  gold:
    rate: 50                # grid_rate (req/s) -- premium, effectively unmetered here
    burst: 100000
    priority: 100           # flow-control band; higher is served first
    slo:
      ttft_p95_ms: 400
      shed: never
    describe: "Guaranteed. First token under 400ms, never dropped. Interactive and production."

  silver:
    rate: 10                # standard throughput
    burst: 100
    priority: 0
    slo:
      ttft_p95_ms: 1000
      shed: after-copper
    describe: "Standard. About a second to first token, may wait under load. Everyday production."

  copper:
    rate: 1                 # cheapest -- throttles quickly under load
    burst: 4
    priority: -100          # negative priority is sheddable
    slo:
      shed: first
    describe: "Spot. No latency promise, throttled and preempted under load. Batch and background."
