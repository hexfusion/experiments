{{- /* ACM: the hub's service CA as a Secret in the hub gateway namespace, for
GridNetwork consumerConfig.deriveTopology.transport.caSecretRef, which takes a
Secret where the Helm backends take the injected ConfigMap. */ -}}
{{- $v := .Values }}
{{- range $site, $s := $v.sites }}
{{- if and (eq $s.cluster "local-cluster") (dig "operator" "gateway" "consumerConfig" "deriveTopology" "transport" "caSecretRef" "name" "" $s) }}
{{- $secret := dig "operator" "gateway" "consumerConfig" "deriveTopology" "transport" "caSecretRef" "name" "" $s }}
---
# file: apps/05-service-ca-secret.yaml
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-service-ca-{{ $site }}
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: [{{ $s.cluster }}]}
---
# file: apps/05-service-ca-secret.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-service-ca-{{ $site }}
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-service-ca-{{ $site }}
      spec:
        remediationAction: enforce
        severity: low
        pruneObjectBehavior: DeleteIfCreated
        object-templates:
        - complianceType: mustonlyhave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: {{ $secret }}
              namespace: grid
            data:
              ca.crt: '{{ `{{hub fromConfigMap "grid" "openshift-service-ca.crt" "service-ca.crt" | base64enc hub}}` }}'
---
# file: apps/05-service-ca-secret.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-service-ca-{{ $site }}
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-service-ca-{{ $site }}
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: grid-service-ca-{{ $site }}
{{- end }}
{{- end }}
