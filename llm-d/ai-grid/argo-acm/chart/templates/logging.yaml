# file: logging/60-sites.yaml
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: logging-sites-openshift
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: {{ toJson $remoteOpenShift }}}
        - {key: local-cluster, operator: DoesNotExist}
---
# file: logging/60-sites.yaml
# OpenShift admits the site collector only under an SCC. This one is OpenShift Logging's
# logging-scc plus DAC_READ_SEARCH, granted to the vector ServiceAccount alone: read-only
# hostPath pod logs as root under spc_t, no privileged container, no host network or PID.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-logging-site-scc
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-logging-site-scc
      spec:
        remediationAction: enforce
        severity: medium
        pruneObjectBehavior: DeleteIfCreated
        object-templates:
        - complianceType: mustonlyhave
          objectDefinition:
            apiVersion: security.openshift.io/v1
            kind: SecurityContextConstraints
            metadata:
              name: grid-logging-vector
            allowHostDirVolumePlugin: true
            allowHostIPC: false
            allowHostNetwork: false
            allowHostPID: false
            allowHostPorts: false
            allowPrivilegeEscalation: false
            allowPrivilegedContainer: false
            allowedCapabilities: [DAC_READ_SEARCH]
            defaultAddCapabilities: null
            requiredDropCapabilities: [CHOWN, DAC_OVERRIDE, FSETID, FOWNER, SETGID, SETUID, SETPCAP, NET_BIND_SERVICE, KILL]
            readOnlyRootFilesystem: true
            runAsUser: {type: RunAsAny}
            seLinuxContext: {type: RunAsAny}
            fsGroup: {type: RunAsAny}
            supplementalGroups: {type: RunAsAny}
            seccompProfiles: [runtime/default]
            forbiddenSysctls: ["*"]
            priority: null
            users: []
            groups: []
            volumes: [configMap, emptyDir, hostPath, projected, secret]
        - complianceType: musthave
          objectDefinition:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: grid-logging-vector-scc
            rules:
            - {apiGroups: [security.openshift.io], resources: [securitycontextconstraints], resourceNames: [grid-logging-vector], verbs: [use]}
        - complianceType: musthave
          objectDefinition:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: grid-logging-vector-scc
              namespace: grid-logging
            roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: grid-logging-vector-scc}
            subjects:
            - {kind: ServiceAccount, name: vector, namespace: grid-logging}
---
# file: logging/60-sites.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-logging-site-scc
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
placementRef: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: logging-sites-openshift}
subjects:
- {apiGroup: policy.open-cluster-management.io, kind: Policy, name: grid-logging-site-scc}
{{- end }}
{{- end }}
