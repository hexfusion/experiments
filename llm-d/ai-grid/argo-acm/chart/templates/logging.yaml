# file: logging/60-sites.yaml
# Copies the ingress CA beside the token, where the site Policy's hub template can read it.
# Base64 in a Secret keeps the PEM on one line through both template passes.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-logging-ingress-ca
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-logging-ingress-ca
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-logging-ingress-ca
              namespace: {{ $ns }}
            data:
              {{- if ($v.ingressCert).enabled }}
              # The router serves the lab CA's certificate; its Secret carries that CA.
              ca.crt: '{{`{{ fromSecret "openshift-ingress" "`}}{{ $v.ingressCert.secretName }}{{`" "ca.crt" }}`}}'
              {{- else }}
              ca.crt: '{{`{{ fromConfigMap "openshift-config-managed" "default-ingress-cert" "ca-bundle.crt" | base64enc }}`}}'
              {{- end }}
---
# file: logging/60-sites.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-logging-ingress-ca
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
placementRef: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: logging-hub}
subjects:
- {apiGroup: policy.open-cluster-management.io, kind: Policy, name: grid-logging-ingress-ca}
---
# file: logging/60-sites.yaml
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: logging-sites
  namespace: {{ $ns }}
