# file: logging/40-forwarder.yaml
# Application logs from the grid namespaces only; infrastructure and audit stay off.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: grid
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  managementState: Managed
  serviceAccount:
    name: logcollector
  collector:
    resources:
      {{- toYaml $l.collector.resources | nindent 6 }}
  inputs:
  - name: grid
    type: application
    application:
      includes:
      {{- range $l.namespaces }}
      - namespace: {{ . | quote }}
      {{- end }}
  filters:
  - name: cluster
    type: openshiftLabels
    openshiftLabels:
      cluster: {{ $v.hub.site }}
  - name: parse
    type: parse
  outputs:
  - name: lokistack
    type: lokiStack
    lokiStack:
      target:
        name: {{ $stack }}
        namespace: {{ $ns }}
      authentication:
        token:
          from: serviceAccount
      labelKeys:
        global:
        {{- range $l.labelKeys }}
        - {{ . }}
        {{- end }}
    tls:
      ca:
        key: service-ca.crt
        configMapName: openshift-service-ca.crt
  pipelines:
  - name: grid
    inputRefs: [grid]
    filterRefs: [cluster, parse]
    outputRefs: [lokistack]
---
