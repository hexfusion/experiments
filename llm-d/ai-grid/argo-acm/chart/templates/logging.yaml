{{- /* Optional central logs on the hub: a LokiStack on the observability MinIO, OpenShift
Logging collecting the grid's application namespaces, the console logs plugin, and a Vector
DaemonSet on every remote site that ships to the LokiStack gateway. No credential is
in Git: Jobs create the MinIO user and the S3 secret, and Policies deliver the site token. */ -}}
{{- $v := .Values }}
{{- $l := $v.logging | default dict }}
{{- if $l.enabled }}
{{- $o := $v.observability | default dict }}
{{- if not $o.enabled }}
{{- fail "logging stores its logs in the observability MinIO: set observability.enabled" }}
{{- end }}
{{- $m := $o.minio }}
{{- $ns := "openshift-logging" }}
{{- $stack := "logging-loki" }}
{{- $endpoint := printf "http://minio.%s.svc:9000" $m.namespace }}
{{- $remote := list }}
{{- $remoteOpenShift := list }}
{{- /* A hub template naming each remote cluster's grid site, so logs carry site names. */ -}}
{{- $siteOf := "" }}
{{- range $name, $site := $v.sites }}
{{- if ne $name $v.hub.site }}
{{- $remote = append $remote $site.cluster }}
{{- if has "security.openshift.io/v1" ($site.apiVersions | default list) }}
{{- $remoteOpenShift = append $remoteOpenShift $site.cluster }}
{{- end }}
{{- $siteOf = printf "%s{{hub if eq .ManagedClusterName %q hub}}%s{{hub end hub}}" $siteOf $site.cluster $name }}
{{- end }}
{{- end }}
# file: apps/06-logging.yaml
# After observability (wave 4), whose MinIO holds the logs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-logging
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/logging
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # LokiStack, ClusterLogForwarder, and UIPlugin CRDs arrive with their operators.
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
---
