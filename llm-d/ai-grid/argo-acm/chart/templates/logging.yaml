apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-bootstrap
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: loki-bootstrap}
subjects:
- {kind: ServiceAccount, name: loki-bootstrap, namespace: {{ $m.namespace }}}
---
# file: logging/20-storage.yaml
# Loki gets its own MinIO user, limited to its bucket. The Job creates the user's secret once,
# then writes the LokiStack S3 secret from it on every sync. Nothing is printed.
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-credentials
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: loki-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: credentials
        image: {{ $o.cliImage }}
        command: [/bin/bash, -ec]
        args:
        - |
          ns={{ $m.namespace }}
          if ! oc -n "$ns" get secret minio-loki >/dev/null 2>&1; then
            pass=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
            oc -n "$ns" create secret generic minio-loki \
              --from-literal=user=loki --from-literal="password=$pass" >/dev/null \
              || oc -n "$ns" get secret minio-loki >/dev/null
            echo "created minio-loki"
          fi
          user=$(oc -n "$ns" get secret minio-loki -o jsonpath='{.data.user}' | base64 -d)
          pass=$(oc -n "$ns" get secret minio-loki -o jsonpath='{.data.password}' | base64 -d)
          oc -n {{ $ns }} create secret generic {{ $stack }}-s3 \
            --from-literal=bucketnames={{ $l.bucket }} --from-literal=endpoint={{ $endpoint }} \
            --from-literal=region=us-east-1 --from-literal=forcepathstyle=true \
            --from-literal="access_key_id=$user" --from-literal="access_key_secret=$pass" \
            --dry-run=client -o yaml | oc apply -f - >/dev/null
          echo "wrote {{ $ns }}/{{ $stack }}-s3"
        env:
        - {name: HOME, value: /tmp}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
# file: logging/20-storage.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-bucket-policy
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  policy.json: |
    {"Version": "2012-10-17", "Statement": [
      {"Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket"], "Resource": ["arn:aws:s3:::{{ $l.bucket }}"]},
      {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"], "Resource": ["arn:aws:s3:::{{ $l.bucket }}/*"]}]}
---
# file: logging/20-storage.yaml
# The bucket, its hard quota, and the Loki user bound to a bucket-only policy. The quota is
# the backstop: a log storm fills the bucket and Loki drops writes, not the host.
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-bucket
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: bucket
        image: {{ $l.clientShellImage }}
        command: [/bin/sh, -ec]
        args:
        - |
          mc mb --ignore-existing local/{{ $l.bucket }}
          mc quota set local/{{ $l.bucket }} --size {{ $l.bucketQuota }}
          mc admin user add local "$LOKI_USER" "$LOKI_PASS"
          mc admin policy create local loki-rw /policy/policy.json
          mc admin policy attach local loki-rw --user "$LOKI_USER" 2>/dev/null \
            || mc admin user info local "$LOKI_USER" | grep -q loki-rw
          echo "bucket {{ $l.bucket }} ready"
        env:
        - name: MINIO_USER
          valueFrom: {secretKeyRef: {name: minio-root, key: user}}
        - name: MINIO_PASS
          valueFrom: {secretKeyRef: {name: minio-root, key: password}}
        - name: LOKI_USER
          valueFrom: {secretKeyRef: {name: minio-loki, key: user}}
        - name: LOKI_PASS
          valueFrom: {secretKeyRef: {name: minio-loki, key: password}}
        - {name: MC_HOST_local, value: "http://$(MINIO_USER):$(MINIO_PASS)@minio.{{ $m.namespace }}.svc:9000"}
        - {name: MC_CONFIG_DIR, value: /tmp/.mc}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: policy, mountPath: /policy}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: policy
        configMap: {name: loki-bucket-policy}
---
# file: logging/30-lokistack.yaml
# 1x.demo has no resource requests; the node selector keeps it off the GPU nodes.
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: {{ $stack }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  size: {{ $l.size }}
  storageClassName: {{ $o.storageClass }}
  storage:
    schemas:
    - {version: v13, effectiveDate: "2026-10-01"}
    secret:
      name: {{ $stack }}-s3
      type: s3
  tenants:
    mode: openshift-logging
  limits:
    global:
      retention:
        days: {{ $l.retentionDays }}
      ingestion:
        ingestionRate: {{ $l.ingestion.rateMB }}
        ingestionBurstSize: {{ $l.ingestion.burstMB }}
        perStreamRateLimit: {{ $l.ingestion.perStreamMB }}
        perStreamRateLimitBurst: {{ $l.ingestion.perStreamBurstMB }}
  {{- with $l.nodeSelector }}
  template:
    {{- range $c := list "compactor" "distributor" "gateway" "indexGateway" "ingester" "querier" "queryFrontend" "ruler" }}
    {{ $c }}:
      nodeSelector: {{ toJson $.Values.logging.nodeSelector }}
    {{- end }}
  {{- end }}
---
