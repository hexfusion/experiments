kind: PlacementBinding
metadata:
  name: grid-logging-site-collector
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
placementRef: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: logging-sites}
subjects:
- {apiGroup: policy.open-cluster-management.io, kind: Policy, name: grid-logging-site-collector}
