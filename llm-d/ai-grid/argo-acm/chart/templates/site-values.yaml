{{- /* Product-chart values: the shared layer, one layer per site, and the hub's enrollment. */ -}}
{{- $v := .Values }}
{{- $images := $v.artifact.images }}
{{- $zone := required "dns.zone is required: every grid endpoint is named in it" (dig "zone" "" ($v.dns | default dict)) }}
{{- $lbs := dig "loadBalancers" dict ($v.dns | default dict) }}
{{- $enrollHost := printf "enroll.%s" $zone }}
{{- /* swim.<hub>.<zone> is the one gossip seed every site dials, so its address is pinned. */ -}}
{{- $_ := required (printf "dns.loadBalancers.%s.swim is required: the hub SWIM Service every site seeds from" $v.hub.site) (dig $v.hub.site "swim" "" $lbs) }}
{{- $frontDoor := dig "mode" "grid" ($v.frontDoor | default dict) }}
{{- if not (has $frontDoor (list "grid" "maas")) }}{{ fail (printf "frontDoor.mode is grid or maas, not %q" $frontDoor) }}{{ end }}
{{- $seeds := list (printf "swim.%s.%s:%v" $v.hub.site $zone ($v.grid.swim.service.port | default 7946)) }}
# file: values/common.yaml
{{- $common := dict
  "operator" (dict "enabled" false)
  "grid-operator" (dict
    "enabled" true
    "image" $images.operator
    "grid" (merge (dict "id" $v.grid.id "peerTrust" $v.grid.peerTrust "signals" $v.grid.signals "seeds" $seeds) (pick $v.grid "scoring"))
    "enrollment" (dict "url" (printf "https://%s" $enrollHost))
    "swim" $v.grid.swim)
  "praxis-gateway" (dict
    "enabled" true
    "image" (merge (dict "flavor" "grid-gateway") $images.gateway)
    "tls" (dict "enabled" true "existingSecret" "grid-site-identity" "caSecret" "grid-ca")
    "gatewayConfig" (dict "render" true "model" $v.grid.model)) }}
{{ toYaml $common }}
{{- range $name, $site := $v.sites }}
{{- $hub := eq $name $v.hub.site }}
{{- $op := deepCopy ($site.operator | default dict) }}
{{- $_ := set $op "site" (dict "name" $name "region" $site.region "zone" $site.zone) }}
{{- $_ := set $op "enrollment" (dict "enabled" (not $hub)) }}
{{- with dig $name "swim" "" $lbs }}
{{- $_ := set $op "swim" (merge (dict "service" (dict "loadBalancerIP" .)) ($op.swim | default dict)) }}
{{- end }}
{{- /* The signals Service is its own LoadBalancer; a pool that does not auto-assign needs the address pinned. */ -}}
{{- with dig $name "signals" "" $lbs }}
{{- $_ := set $op "signals" (merge (dict "service" (dict "loadBalancerIP" .)) ($op.signals | default dict)) }}
{{- end }}
{{- if $hub }}
{{- $_ := set $op "rbac" (dict "enrollmentNamespace" "grid-enrollment") }}
{{- /* The hub is the seed; announcing to its own address loops back to itself. */ -}}
{{- $_ := set $op "grid" (dict "seeds" (list)) }}
{{- end }}
{{- if $site.providers }}
{{- /* internalPath is this chart's, rendered by epp-paths.yaml; the operator does not take it. */ -}}
{{- $providers := dict }}
{{- range $pn, $p := $site.providers }}
{{- $_ := set $providers $pn (omit $p "internalPath") }}
{{- end }}
{{- $_ := set $op "grid" (merge (dict "providers" $providers) ($op.grid | default dict)) }}
{{- end }}
{{- /* The demo Grafana needs hq's gateway and operator scraped faster than the default. */ -}}
{{- $demo := $v.demoGrafana | default dict }}
{{- if and $hub $demo.enabled }}
{{- $_ := set $op "serviceMonitor" (merge (dict "interval" $demo.scrapeInterval "scrapeTimeout" $demo.scrapeInterval) ($op.serviceMonitor | default dict)) }}
{{- end }}
{{- $gw := deepCopy ($site.gateway | default dict) }}
{{- /* The gateway's metricsListener.serviceMonitor takes no scrapeTimeout, so its interval
     cannot go below Prometheus's global scrape timeout; grid.yaml sets it. */ -}}
{{- $_ := set $gw "gatewayConfig" (merge (dict "localSite" $name) ($gw.gatewayConfig | default dict)) }}
{{- with dig $name "gateway" "" $lbs }}
{{- $_ := set $gw "service" (merge (dict "loadBalancerIP" .) ($gw.service | default dict)) }}
{{- end }}
{{- /* The front door is grid.<zone>, on the hub. */ -}}
{{- if and $hub ($gw.route).enabled }}
{{- $_ := set $gw.route "host" (printf "grid.%s" $zone) }}
{{- end }}
{{- /* The hub reaches each remote provider's gateway over grid mTLS, one load_balancer cluster per routingClusterRef; gw.<site> resolves to a private address. */ -}}
{{- if $hub }}
{{- $peers := list }}
{{- range $peer, $ps := $v.sites }}
{{- if ne $peer $name }}
{{- range $_, $p := $ps.providers | default dict }}
{{- $peers = append $peers (dict "cluster" $p.routingClusterRef "endpoints" (list (printf "gw.%s.%s:%v" $peer $zone (($ps.gateway).service.port | default 8080))) "transport" (dict "mode" "mutual_tls" "sni" (printf "%s.grid.internal" $peer)) "trustPrivate" true) }}
{{- end }}
{{- end }}
{{- end }}
{{- $_ := set $gw.gatewayConfig "backends" (concat ($gw.gatewayConfig.backends | default list) $peers) }}
{{- end }}
{{- /* Behind MaaS the hub gateway only routes: no key check, no Route, reachable from the MaaS gateway only. */ -}}
{{- if and $hub (eq $frontDoor "maas") }}
{{- $m := $v.frontDoor.maas }}
{{- $_ := set $gw "route" (dict "enabled" false) }}
{{- $_ := set $gw "service" (merge (dict "port" $m.gridGatewayPort) ($gw.service | default dict)) }}
{{- $_ := set $gw.gatewayConfig "auth" (dict "mode" "none" "stripAuthorization" true) }}
{{- $maasGw := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $m.gateway.namespace)) "podSelector" (dict "matchLabels" (dict "gateway.networking.k8s.io/gateway-name" $m.gateway.name)) }}
{{- $_ := set $gw "networkPolicy" (dict "enabled" true "from" (list (dict "podSelector" dict) $maasGw)) }}
{{- end }}
{{- /* A provider trusts the hub's identity unless it names another. */ -}}
{{- $trust := ($gw.gatewayConfig.peerTrust | default dict) }}
{{- if and (eq ($trust.mode | default "") "spiffe") (not $trust.spiffeId) }}
{{- $_ := set $trust "spiffeId" (printf "spiffe://grid.internal/site/%s" $v.hub.site) }}
{{- $_ := set $gw.gatewayConfig "peerTrust" $trust }}
{{- end }}
---
# file: sites/{{ $name }}/values.yaml
{{ toYaml (dict "grid-operator" $op "praxis-gateway" $gw) }}
---
# file: sites/{{ $name }}/site.yaml
{{ toYaml (dict "site" $name "cluster" $site.cluster "apiVersions" ($site.apiVersions | default list)) }}
{{- end }}
---
# file: hub/enrollment/values.yaml
{{- $invites := dict }}
{{- range $name, $site := $v.sites }}
{{- if ne $name $v.hub.site }}
{{- $_ := set $invites $name (dict "network" $v.grid.network) }}
{{- end }}
{{- end }}
{{- $enrollment := dict
    "enabled" true
    "host" $enrollHost
    "route" (dict "enabled" true)
    "image" $images.enrollment
    "hubSite" (dict "name" $v.hub.site)
    "invites" $invites }}
{{- with $v.hub.certLifetimeSecs }}
{{- $_ := set $enrollment "enrollment" (dict "certLifetimeSecs" (toString .)) }}
{{- end }}
{{- if (($v.hub.enrollmentDb).chartAnnotations) }}
{{- $_ := set $enrollment "db" (dict "builtin" (dict "pvcAnnotations" (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false"))) }}
{{- end }}
{{ toYaml (dict "operator" (dict "enabled" false) "grid-enrollment" $enrollment) }}
---
# file: hub/enrollment/target.yaml
{{ toYaml (dict "apiVersions" ((get $v.sites $v.hub.site).apiVersions | default list)) }}
