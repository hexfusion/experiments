{{- /* Product-chart values: the shared layer, one layer per site, and the hub's enrollment. */ -}}
{{- $v := .Values }}
{{- $images := $v.artifact.images }}
{{- /* The hub's pinned SWIM address is the one gossip seed every site dials. */ -}}
{{- $swimIP := required "hub.swim.loadBalancerIP is required: the hub SWIM Service address every site seeds from" (dig "swim" "loadBalancerIP" "" $v.hub) }}
{{- $seeds := list (printf "%s:%v" $swimIP ($v.grid.swim.service.port | default 7946)) }}
# file: values/common.yaml
{{- $common := dict
  "operator" (dict "enabled" false)
  "grid-operator" (dict
    "enabled" true
    "image" $images.operator
    "grid" (dict "id" $v.grid.id "peerTrust" $v.grid.peerTrust "signals" $v.grid.signals "scoring" ($v.grid.scoring | default "") "seeds" $seeds)
    "enrollment" (dict "url" (printf "https://%s" $v.hub.enrollmentHost))
    "swim" $v.grid.swim)
  "praxis-gateway" (dict
    "enabled" true
    "image" (merge (dict "flavor" "grid-gateway") $images.gateway)
    "tls" (dict "enabled" true "existingSecret" "grid-site-identity" "caSecret" "grid-ca")
    "gatewayConfig" (dict "render" true "model" $v.grid.model)) }}
{{ toYaml $common }}
{{- range $name, $site := $v.sites }}
{{- $hub := eq $name $v.hub.site }}
{{- $op := deepCopy ($site.operator | default dict) }}
{{- $_ := set $op "site" (dict "name" $name "region" $site.region "zone" $site.zone) }}
{{- $_ := set $op "enrollment" (dict "enabled" (not $hub)) }}
{{- if $hub }}
{{- $_ := set $op "rbac" (dict "enrollmentNamespace" "grid-enrollment") }}
{{- $_ := set $op "swim" (dict "service" (dict "loadBalancerIP" $swimIP)) }}
{{- /* The hub is the seed; announcing to its own address loops back to itself. */ -}}
{{- $_ := set $op "grid" (dict "seeds" (list)) }}
{{- end }}
{{- if $site.providers }}
{{- $_ := set $op "grid" (merge (dict "providers" $site.providers) ($op.grid | default dict)) }}
{{- end }}
{{- $gw := deepCopy ($site.gateway | default dict) }}
{{- $_ := set $gw "gatewayConfig" (merge (dict "localSite" $name) ($gw.gatewayConfig | default dict)) }}
---
# file: sites/{{ $name }}/values.yaml
{{ toYaml (dict "grid-operator" $op "praxis-gateway" $gw) }}
---
# file: sites/{{ $name }}/site.yaml
{{ toYaml (dict "site" $name "cluster" $site.cluster "apiVersions" ($site.apiVersions | default list)) }}
{{- end }}
---
# file: hub/enrollment/values.yaml
{{- $invites := dict }}
{{- range $name, $site := $v.sites }}
{{- if ne $name $v.hub.site }}
{{- if ne $name $site.cluster }}
{{- fail (printf "site %s: the invite Policy fetches tokens by ManagedCluster name, so a site's key must equal its cluster (%s)" $name $site.cluster) }}
{{- end }}
{{- $_ := set $invites $site.cluster (dict "network" $v.grid.network) }}
{{- end }}
{{- end }}
{{- $enrollment := dict
    "enabled" true
    "host" $v.hub.enrollmentHost
    "route" (dict "enabled" true)
    "image" $images.enrollment
    "hubSite" (dict "name" $v.hub.site)
    "invites" $invites }}
{{- if (($v.hub.enrollmentDb).chartAnnotations) }}
{{- $_ := set $enrollment "db" (dict "builtin" (dict "pvcAnnotations" (dict "argocd.argoproj.io/sync-options" "Prune=false,Delete=false"))) }}
{{- end }}
{{ toYaml (dict "operator" (dict "enabled" false) "grid-enrollment" $enrollment) }}
---
# file: hub/enrollment/target.yaml
{{ toYaml (dict "apiVersions" ((get $v.sites $v.hub.site).apiVersions | default list)) }}
