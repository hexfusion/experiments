{{- /* The front door clients call. maas mode puts the grid behind the MaaS gateway: one
ExternalModel and MaaSModelRef per distinct model, pointing at hq's grid gateway, plus the
subscription and policy MaaS needs before a model is Ready. Nothing renders for grid mode
except the client file. */ -}}
{{- $v := .Values }}
{{- $mode := dig "mode" "grid" ($v.frontDoor | default dict) }}
{{- $zone := $v.dns.zone }}
{{- $models := list }}
{{- range $name, $site := $v.sites }}
{{- range $provider, $p := $site.providers | default dict }}
{{- $models = append $models $p.model }}
{{- end }}
{{- end }}
{{- $models = $models | uniq | sortAlpha }}
{{- $gwHost := "grid-gateway.grid.svc.cluster.local" }}
{{- $m := $v.frontDoor.maas }}
# file: client/front-door.yaml
# Where clients send requests in the current mode. In maas mode, GET /v1/models on the
# MaaS gateway with a key is the authority on each model's URL.
mode: {{ $mode }}
{{- if eq $mode "grid" }}
host: grid.{{ $zone }}
address: {{ $v.dns.ingressVIP }}
models:
{{- range $models }}
- {name: {{ . }}, url: https://grid.{{ $zone }}/v1/chat/completions}
{{- end }}
{{- else }}
host: maas.{{ $zone }}
address: {{ required "dns.maasGateway is required in frontDoor maas: the client host maas.<zone> resolves to it" $v.dns.maasGateway }}
models:
{{- range $models }}
- {name: {{ . }}, url: https://maas.{{ $zone }}/{{ $m.namespace }}/{{ include "frontdoor.slug" . }}/v1/chat/completions}
{{- end }}
{{- end }}
{{- if eq $mode "maas" }}
---
# file: apps/05-front-door.yaml
# After the sites (wave 3), so hq's grid gateway Service exists. The finalizer removes the
# MaaS objects when the app is deleted, as on a switch back to grid mode.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-front-door
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/front-door
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $m.namespace }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# file: apps/05-front-door.yaml
# The MaaS gateway verifies hq's grid gateway against the service CA. Istio reads a CA only
# from a Secret in the gateway's namespace, and the service CA ships as a ConfigMap, so this
# Policy keeps a Secret copy of it.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-front-door-ca
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: [{{ (get $v.sites $v.hub.site).cluster }}]}
---
# file: apps/05-front-door.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-front-door-ca
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-front-door-ca
      spec:
        remediationAction: enforce
        severity: medium
        pruneObjectBehavior: DeleteIfCreated
        object-templates:
        - complianceType: mustonlyhave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-gateway-ca
              namespace: {{ $m.gateway.namespace }}
            data:
              ca.crt: '{{`{{ fromConfigMap "`}}{{ $m.gateway.namespace }}{{`" "openshift-service-ca.crt" "service-ca.crt" | base64enc }}`}}'
---
# file: apps/05-front-door.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-front-door-ca
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-front-door-ca
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: grid-front-door-ca
---
# file: front-door/05-trust.yaml
# The MaaS gateway verifies hq's grid gateway against the service CA. Istio prefers a
# DestinationRule in the calling proxy's namespace, so this one wins over the CA-less rule
# the IPP controller writes beside each ExternalModel.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: grid-gateway
  namespace: {{ $m.gateway.namespace }}
spec:
  host: {{ $gwHost }}
  trafficPolicy:
    tls:
      mode: SIMPLE
      credentialName: grid-gateway-ca
      sni: {{ $gwHost }}
---
# file: apps/05-front-door.yaml
# The MaaS gateway's listener serves the lab certificate and admits routes from the front-door
# namespace. An earlier Helm install owns the Gateway and maas-controller owns the namespace,
# so these set only those fields, and deleting the Policy leaves them in place.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-front-door-gateway
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-front-door-gateway
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: {{ $m.namespace }}
              labels:
                maas.opendatahub.io/gateway-access: "true"
        # mustonlyhave replaces the listener list whole, so it holds every listener field.
        - complianceType: mustonlyhave
          objectDefinition:
            apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: {{ $m.gateway.name }}
              namespace: {{ $m.gateway.namespace }}
            spec:
              gatewayClassName: {{ $m.gateway.className }}
              listeners:
              - name: https
                port: 443
                protocol: HTTPS
                allowedRoutes:
                  namespaces:
                    from: Selector
                    selector:
                      matchLabels: {maas.opendatahub.io/gateway-access: "true"}
                tls:
                  mode: Terminate
                  certificateRefs:
                  - {group: "", kind: Secret, name: {{ $v.ingressCert.secretName }}}
---
# file: apps/05-front-door.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-front-door-gateway
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-front-door-ca
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: grid-front-door-gateway
---
# file: front-door/00-credential.yaml
# ExternalModel requires a credential Secret, and the MaaS gateway sends its api-key as a
# bearer. The grid gateway cannot verify one yet and strips it, so this holds a placeholder,
# not a credential; the grid gateway's NetworkPolicy is what admits only the MaaS gateway.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: grid-front-door
  namespace: {{ $m.namespace }}
  labels:
    inference.llm-d.ai/ipp-managed: "true"
stringData:
  api-key: placeholder-network-policy-guards-this-hop
{{- range $models }}
{{- $slug := include "frontdoor.slug" . }}
---
# file: front-door/10-models.yaml
# maas-controller derives an ExternalName Service, ServiceEntry, and HTTPRoute from this.
apiVersion: maas.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: {{ $slug }}
  namespace: {{ $m.namespace }}
  annotations:
    maas.opendatahub.io/port: {{ $m.gridGatewayPort | quote }}
    maas.opendatahub.io/tls: "true"
spec:
  provider: openai
  endpoint: {{ $gwHost }}
  targetModel: {{ . }}
  credentialRef: {name: grid-front-door}
---
# file: front-door/10-models.yaml
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: {{ $slug }}
  namespace: {{ $m.namespace }}
spec:
  modelRef: {kind: ExternalModel, name: {{ $slug }}}
  tenantRef: {{ $m.tenant }}
{{- end }}
---
# file: front-door/20-access.yaml
# Who may call the grid's models and their token budget; Limitador enforces it.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: grid-front-door
  namespace: {{ $m.namespace }}
spec:
  owner: {{ toJson $m.subjects }}
  modelRefs:
  {{- range $models }}
  - name: {{ include "frontdoor.slug" . }}
    namespace: {{ $m.namespace }}
    tokenRateLimits: {{ toJson $m.tokenRateLimits }}
  {{- end }}
---
# file: front-door/20-access.yaml
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: grid-front-door
  namespace: {{ $m.namespace }}
spec:
  subjects: {{ toJson $m.subjects }}
  modelRefs:
  {{- range $models }}
  - {name: {{ include "frontdoor.slug" . }}, namespace: {{ $m.namespace }}}
  {{- end }}
---
# file: front-door/30-metrics.yaml
# The MaaS gateway's request metrics, which the front-door panels read in this mode. RHOAI
# writes this only for a gateway serving an LLMInferenceService.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $m.gateway.name }}-metrics
  namespace: {{ $m.gateway.namespace }}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ $m.gateway.name }}
  podMetricsEndpoints:
  - port: metrics
    path: /stats/prometheus
    interval: {{ ($v.demoGrafana | default dict).scrapeInterval | default "30s" }}
    relabelings:
    - action: replace
      sourceLabels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
      targetLabel: gateway_name
    metricRelabelings:
    - action: keep
      sourceLabels: [__name__]
      regex: istio_requests_total|istio_request_duration_milliseconds_(bucket|sum|count)
{{- end }}
