{{- /* Optional ACM observability on the hub: in-cluster MinIO as the Thanos object store, the
pull secret ACM copies to spokes, the MultiClusterObservability CR, and the grid allowlist.
No credential is in Git: Jobs generate the MinIO root credential and derive the Thanos
secret from it, and a Policy copies the pull secret on the hub. */ -}}
{{- $v := .Values }}
{{- $o := $v.observability | default dict }}
{{- if $o.enabled }}
{{- $m := $o.minio }}
{{- $obsNs := "open-cluster-management-observability" }}
{{- $endpoint := printf "minio.%s.svc:9000" $m.namespace }}
# file: apps/05-observability.yaml
# After the sites (wave 3): observability watches the grid, it does not gate it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-observability
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/observability
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $obsNs }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# file: observability/00-namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The PVC holds the metrics history; deleting the app must not delete it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# file: observability/00-namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $obsNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# file: observability/10-minio.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: {{ $m.namespace }}
  annotations:
    {{- /* WaitForFirstConsumer: binds only with its pod, so share the Deployment's wave. */}}
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $o.storageClass }}
  resources:
    requests:
      storage: {{ $m.size }}
---
# file: observability/10-minio.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # One RWO volume: the old pod must release it before the new one mounts it.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: minio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: minio
        image: {{ $m.image }}
        args: [server, /data]
        env:
        - name: MINIO_ROOT_USER
          valueFrom: {secretKeyRef: {name: minio-root, key: user}}
        - name: MINIO_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: minio-root, key: password}}
        - {name: HOME, value: /tmp}
        ports:
        - {name: s3, containerPort: 9000}
        readinessProbe:
          httpGet: {path: /minio/health/ready, port: s3}
        livenessProbe:
          httpGet: {path: /minio/health/live, port: s3}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 1Gi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: minio-data}
      - name: tmp
        emptyDir: {}
---
# file: observability/10-minio.yaml
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector: {app.kubernetes.io/name: minio}
  ports:
  - {name: s3, port: 9000, targetPort: s3}
---
# file: observability/20-bootstrap.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-bootstrap
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# file: observability/20-bootstrap.yaml
# create cannot be name-scoped; get is limited to the root credential.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-bootstrap
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- {apiGroups: [""], resources: [secrets], verbs: [create]}
- {apiGroups: [""], resources: [secrets], resourceNames: [minio-root], verbs: [get]}
---
# file: observability/20-bootstrap.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-bootstrap
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: minio-bootstrap}
subjects:
- {kind: ServiceAccount, name: minio-bootstrap, namespace: {{ $m.namespace }}}
---
# file: observability/20-bootstrap.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-bootstrap
  namespace: {{ $obsNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- {apiGroups: [""], resources: [secrets], verbs: [create]}
- {apiGroups: [""], resources: [secrets], resourceNames: [thanos-object-storage], verbs: [get, patch]}
---
# file: observability/20-bootstrap.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-bootstrap
  namespace: {{ $obsNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: minio-bootstrap}
subjects:
- {kind: ServiceAccount, name: minio-bootstrap, namespace: {{ $m.namespace }}}
---
# file: observability/20-bootstrap.yaml
# Creates the MinIO root credential once, then writes the Thanos secret from it on every
# sync, so the two never drift. Nothing is printed: the script runs without xtrace.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-credentials
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: minio-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: credentials
        image: {{ $o.cliImage }}
        command: [/bin/bash, -ec]
        args:
        - |
          ns={{ $m.namespace }}
          if ! oc -n "$ns" get secret minio-root >/dev/null 2>&1; then
            pass=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
            oc -n "$ns" create secret generic minio-root \
              --from-literal=user=grid-observability --from-literal="password=$pass" >/dev/null \
              || oc -n "$ns" get secret minio-root >/dev/null
            echo "created minio-root"
          fi
          user=$(oc -n "$ns" get secret minio-root -o jsonpath='{.data.user}' | base64 -d)
          pass=$(oc -n "$ns" get secret minio-root -o jsonpath='{.data.password}' | base64 -d)
          cfg=$(printf 'type: s3\nconfig:\n  bucket: %s\n  endpoint: %s\n  insecure: true\n  access_key: %s\n  secret_key: %s\n' \
            {{ $m.bucket }} {{ $endpoint }} "$user" "$pass")
          oc -n {{ $obsNs }} create secret generic thanos-object-storage --from-literal="thanos.yaml=$cfg" \
            --dry-run=client -o yaml | oc apply -f - >/dev/null
          echo "wrote {{ $obsNs }}/thanos-object-storage"
        env:
        - {name: HOME, value: /tmp}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
# file: observability/20-bootstrap.yaml
# The bucket Thanos writes to, once MinIO is ready (wave 2). The image has no shell, so the
# alias comes from MC_HOST_<alias>.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket
  namespace: {{ $m.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: bucket
        image: {{ $m.clientImage }}
        args: [mb, --ignore-existing, local/{{ $m.bucket }}]
        env:
        - name: MINIO_USER
          valueFrom: {secretKeyRef: {name: minio-root, key: user}}
        - name: MINIO_PASS
          valueFrom: {secretKeyRef: {name: minio-root, key: password}}
        - {name: MC_HOST_local, value: "http://$(MINIO_USER):$(MINIO_PASS)@{{ $endpoint }}"}
        - {name: MC_CONFIG_DIR, value: /tmp/.mc}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
# file: observability/30-pull-secret.yaml
# ACM copies this pull secret to every spoke's add-on namespace; a k3s spoke has no other
# source for registry.redhat.io. A managed-cluster template reads it on the hub itself, so
# it never passes through Git.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-hub
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: [{{ $v.hub.cluster }}]}
---
# file: observability/30-pull-secret.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-observability-pull-secret
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-observability-pull-secret
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: kubernetes.io/dockerconfigjson
            metadata:
              name: multiclusterhub-operator-pull-secret
              namespace: {{ $obsNs }}
            data:
              .dockerconfigjson: '{{`{{ fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" }}`}}'
---
# file: observability/30-pull-secret.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-observability-pull-secret
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-hub
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: grid-observability-pull-secret
---
# file: observability/40-allowlist.yaml
# User-workload metrics the hub collects from every spoke. The hub merges this with ACM's
# default allowlist and ships it to each cluster's add-on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-metrics-custom-allowlist
  namespace: {{ $obsNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  {{- with $o.allowlist.platform }}
  metrics_list.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
  uwl_metrics_list.yaml: |
    {{- toYaml $o.allowlist.userWorkload | nindent 4 }}
---
# file: observability/50-mco.yaml
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  instanceSize: {{ $o.instanceSize }}
  enableDownsampling: false
  observabilityAddonSpec:
    enableMetrics: true
    interval: {{ $o.interval }}
  storageConfig:
    metricObjectStorage:
      name: thanos-object-storage
      key: thanos.yaml
    storageClass: {{ $o.storageClass }}
    alertmanagerStorageSize: {{ $o.storage.alertmanager }}
    compactStorageSize: {{ $o.storage.compact }}
    receiveStorageSize: {{ $o.storage.receive }}
    ruleStorageSize: {{ $o.storage.rule }}
    storeStorageSize: {{ $o.storage.store }}
  advanced:
    retentionConfig:
      retentionInLocal: {{ $o.retention.local }}
      retentionResolutionRaw: {{ $o.retention.raw }}
      retentionResolution5m: {{ $o.retention.raw }}
      retentionResolution1h: {{ $o.retention.raw }}
      deleteDelay: 1h
    {{- range $c := list "observatoriumAPI" "query" "queryFrontend" "queryFrontendMemcached" "grafana" "rbacQueryProxy" "rule" "receive" "store" "storeMemcached" "alertmanager" }}
    {{ $c }}: {replicas: 1}
    {{- end }}
{{- end }}
