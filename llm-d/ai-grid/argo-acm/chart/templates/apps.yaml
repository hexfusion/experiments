{{- /* Argo CD: the root app (applied once from setup/), the enrollment app, one app per site. */ -}}
{{- $v := .Values }}
# file: setup/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-grid
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
# file: apps/01-grid-namespace.yaml
# The hub's grid namespace exists before enrollment (wave 1) writes the hub identity into it.
apiVersion: v1
kind: Namespace
metadata:
  name: grid
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# file: apps/02-enrollment.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-enrollment
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/hub/enrollment/manifests
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: grid-enrollment
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
{{- range $name, $site := $v.sites }}
---
# file: apps/04-sites.yaml
# CRDs in their own app: Argo diffs a site app against the live CRDs, so a new CRD field in
# the same app fails the comparison and nothing syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-{{ $name }}-crds
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/sites/{{ $name }}/crds
    directory: {recurse: true}
  destination:
    name: {{ $site.cluster }}
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# file: apps/04-sites.yaml
# The finalizer cascades deletion to the site's resources, as the ApplicationSet it replaces did.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-{{ $name }}
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/sites/{{ $name }}/manifests
    directory: {recurse: true}
  destination:
    name: {{ $site.cluster }}
    namespace: grid
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Argo does not retry a failed automated sync of the same commit; a site that syncs before
    # its CRDs land would wait for the next commit.
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
{{- end }}
