{{- /* The demo Grafana on the hub: grafana-operator, read-only access to the hub's Thanos Querier
and LokiStack through one ServiceAccount token, recording rules that put site names on the
gateway's series, and the dashboards from files/demo. No credential is in Git: Kubernetes fills
the token Secret, and the operator generates Grafana's admin credentials. */ -}}
{{- $v := .Values }}
{{- $d := $v.demoGrafana | default dict }}
{{- if $d.enabled }}
{{- $ns := $d.namespace }}
{{- $zone := $v.dns.zone }}
{{- $w := $d.rateWindow }}
{{- $l := $v.logging | default dict }}
# file: apps/07-observe.yaml
# After logging (wave 5), whose LokiStack the annotations read.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-observe
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: {{ $v.repo.url }}
    targetRevision: {{ $v.repo.revision }}
    path: {{ $v.repo.path }}/observe
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $ns }}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # The Grafana CRDs arrive with the operator.
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
---
# file: observe/00-namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# file: observe/10-operator.yaml
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: grafana-operator
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetNamespaces: [{{ $ns }}]
---
# file: observe/10-operator.yaml
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: grafana-operator
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: {{ $d.channel }}
  name: grafana-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
# file: observe/20-access.yaml
# Reads metrics and application logs, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-reader
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# file: observe/20-access.yaml
# Kubernetes writes the token; Git holds only the request for one.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: grafana-reader-token
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kubernetes.io/service-account.name: grafana-reader
---
# file: observe/20-access.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grid-demo-grafana-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-monitoring-view}
subjects:
- {kind: ServiceAccount, name: grafana-reader, namespace: {{ $ns }}}
{{- if $l.enabled }}
---
# file: observe/20-access.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grid-demo-grafana-logs
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-logging-application-view}
subjects:
- {kind: ServiceAccount, name: grafana-reader, namespace: {{ $ns }}}
{{- end }}
---
# file: observe/30-grafana.yaml
# Anyone who reaches observe.<zone> views; editing needs the generated admin login.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grid-demo
  namespace: {{ $ns }}
  labels:
    dashboards: grid-demo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  config:
    log: {mode: console}
    auth.anonymous: {enabled: "true", org_role: Viewer}
  route:
    spec:
      host: observe.{{ $zone }}
      tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
---
# file: observe/40-datasources.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: hub-thanos
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  instanceSelector:
    matchLabels: {dashboards: grid-demo}
  valuesFrom:
  - targetPath: secureJsonData.httpHeaderValue1
    valueFrom: {secretKeyRef: {name: grafana-reader-token, key: token}}
  - targetPath: secureJsonData.tlsCACert
    valueFrom: {configMapKeyRef: {name: openshift-service-ca.crt, key: service-ca.crt}}
  datasource:
    name: Hub metrics
    uid: grid-thanos
    type: prometheus
    access: proxy
    isDefault: true
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    jsonData:
      httpHeaderName1: Authorization
      tlsAuthWithCACert: true
      timeInterval: {{ $d.scrapeInterval }}
    secureJsonData:
      httpHeaderValue1: "Bearer ${token}"
      tlsCACert: "${service-ca.crt}"
{{- if $l.enabled }}
---
# file: observe/40-datasources.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: hub-logs
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  instanceSelector:
    matchLabels: {dashboards: grid-demo}
  valuesFrom:
  - targetPath: secureJsonData.httpHeaderValue1
    valueFrom: {secretKeyRef: {name: grafana-reader-token, key: token}}
  - targetPath: secureJsonData.tlsCACert
    valueFrom: {configMapKeyRef: {name: openshift-service-ca.crt, key: service-ca.crt}}
  datasource:
    name: Hub logs
    uid: grid-loki
    type: loki
    access: proxy
    url: https://logging-loki-gateway-http.openshift-logging.svc.cluster.local:8080/api/logs/v1/application
    jsonData:
      httpHeaderName1: Authorization
      tlsAuthWithCACert: true
    secureJsonData:
      httpHeaderValue1: "Bearer ${token}"
      tlsCACert: "${service-ca.crt}"
{{- end }}
---
# file: observe/50-rules.yaml
# Site names on the gateway's series. User workload monitoring confines these rules to the
# grid namespace, where the gateway and operator metrics live.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grid-demo
  namespace: grid
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  groups:
  - name: grid-demo
    interval: {{ $d.scrapeInterval }}
    rules:
    # The one name mapping, from grid.yaml: each ACM cluster to its site, each backend to its
    # site, and each tenant namespace (as tenant_namespace) to its backend and site.
    {{- range $name, $site := $v.sites }}
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", {{ $site.cluster | quote }}, "", ""), "site", {{ $name | quote }}, "", "")
    {{- range $provider, $p := $site.providers | default dict }}
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", {{ $p.routingClusterRef | quote }}, "", ""), "site", {{ $name | quote }}, "", "")
    {{- $tenant := regexFind `\.[a-z0-9-]+\.svc` $p.endpoint | trimPrefix "." | trimSuffix ".svc" }}
    {{- if $tenant }}
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", {{ $tenant | quote }}, "", ""), "backend", {{ $p.routingClusterRef | quote }}, "", ""), "site", {{ $name | quote }}, "", "")
    {{- end }}
    {{- end }}
    {{- end }}
    # Site state from hq's operator, which polls each site's signals under a peer label that
    # is the site name.
    - record: grid:site_reachable
      expr: label_replace(max by (peer) (grid_collection_up), "site", "$1", "peer", "(.+)")
    # hq does not poll itself; its tile shows its own operator is up.
    - record: grid:site_reachable
      expr: label_replace(max(up{job="grid-operator-metrics"}), "site", {{ $v.hub.site | quote }}, "", "")
    - record: grid:site_last_poll_age:seconds
      expr: label_replace(time() - max by (peer) (grid_peer_last_success_timestamp_seconds), "site", "$1", "peer", "(.+)")
    - record: grid:site_phase
      expr: max by (site, phase) (grid_site_phase == 1)
    # The hub's own site identity; other sites' identities are not collected here.
    - record: grid:identity_valid:seconds
      expr: label_replace(min(grid_site_identity_expiry_timestamp_seconds) - time(), "site", {{ $v.hub.site | quote }}, "", "")
    # Per-site saturation from the operator's signals, limited to ready providers.
    - record: grid:site_saturation:ratio
      expr: max by (grid_site) (grid_provider_saturation_ratio and on (grid_site, grid_provider) grid_provider_ready == 1)
  # Routing debuggability: a provider with no usable signals must raise an alert from status,
  # not stay silent while the gateway pins traffic to one site.
  - name: grid-demo-alerts
    interval: {{ $d.scrapeInterval }}
    rules:
    # A provider the operator knows about but cannot scrape reports ready 0.
    - alert: ProviderNoSignals
      expr: grid_provider_ready == 0
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: "Provider {{`{{ $labels.grid_provider }}`}} at {{`{{ $labels.grid_site }}`}} is not ready"
        description: "grid_provider_ready is 0 for 2m. The gateway will not route to this provider."
    # Ready, but the load signal is missing: the row exists with no in-flight series.
    - alert: ProviderSignalsIncomplete
      expr: grid_provider_ready == 1 unless on (grid_site, grid_provider) grid_provider_in_flight_requests
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: "Provider {{`{{ $labels.grid_provider }}`}} at {{`{{ $labels.grid_site }}`}} has no load signal"
        description: "The provider is ready but publishes no grid_provider_in_flight_requests for 2m."
    # The whole provider signal set is gone from the hub operator.
    - alert: ProviderSignalsAbsent
      expr: absent(grid_provider_ready)
      for: 2m
      labels: {severity: critical}
      annotations:
        summary: "No provider signals on the hub operator"
        description: "grid_provider_ready has no series for 2m. The operator publishes no provider signals for any site."
    # The hub's last good poll of a peer is stale.
    - alert: PeerPollStale
      expr: grid:site_last_poll_age:seconds > 120
      for: 1m
      labels: {severity: warning}
      annotations:
        summary: "Signals from {{`{{ $labels.site }}`}} are stale"
        description: "The hub's last good poll of this site is older than 2m."
    # One site is saturated while another ready site sits idle: routing may be pinned.
    - alert: SiteMonopoly
      expr: (max(grid:site_saturation:ratio) >= 0.8) and (min(grid:site_saturation:ratio) < 0.2)
      for: 5m
      labels: {severity: warning}
      annotations:
        summary: "One site is saturated while another admitted site is idle"
        description: "A ready site sits under 0.2 saturation while another is at or above 0.8 for 5m."
    # The MaaS auth callout times out and fails requests closed with a 500.
    # Needs the gateway Envoy auth-callout series in UWM; see the note sent with this change.
    - alert: MaaSAuthCalloutTimeouts
      expr: sum(rate(envoy_cluster_upstream_rq_timeout{cluster_name=~".*auth.*"}[{{ $w }}])) > 0
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: "MaaS auth callout is timing out"
        description: "The Kuadrant auth callout returns upstream timeouts, which fail requests closed with a 500."
{{- $fd := $v.frontDoor | default dict }}
{{- $maas := eq ($fd.mode | default "grid") "maas" }}
{{- $label := ternary (printf "MaaS, maas.%s" $zone) (printf "grid, grid.%s" $zone) $maas }}
{{- $glob := ternary "files/{demo,demo-maas}/*.json" "files/demo/*.json" $maas }}
{{- range $path, $_ := $.Files.Glob $glob }}
{{- $name := base $path | trimSuffix ".json" }}
---
# file: observe/60-dashboards.yaml
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  instanceSelector:
    matchLabels: {dashboards: grid-demo}
  json: |
{{ $.Files.Get $path | replace "__FRONT_DOOR_LABEL__" $label | replace "__MAAS_GW__" (($fd.maas).gateway).name | replace "__WINDOW__" $w | indent 4 }}
{{- end }}
{{- end }}
