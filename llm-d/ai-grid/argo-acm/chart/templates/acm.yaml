{{- /* ACM: the grid's clusters registered with Argo CD, and the Policy delivering each site's invite and the SWIM key. */ -}}
{{- /* Clusters are picked by name from ACM's global set, so no cluster needs a grid label or set. */ -}}
{{- $v := .Values }}
{{- $all := list }}
{{- $remote := list }}
{{- range $name, $site := $v.sites }}
{{- $all = append $all $site.cluster }}
{{- if ne $name $v.hub.site }}
{{- $remote = append $remote $site.cluster }}
{{- end }}
{{- end }}
# file: apps/01-acm.yaml
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterSet: global
---
# file: apps/01-acm.yaml
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-sites
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: {{ toJson $all }}}
  tolerations:
    - {key: cluster.open-cluster-management.io/unreachable, operator: Exists}
    - {key: cluster.open-cluster-management.io/unavailable, operator: Exists}
---
# file: apps/01-acm.yaml
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: grid
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  argoServer:
    cluster: {{ $v.hub.cluster }}
    argoNamespace: openshift-gitops
  placementRef:
    kind: Placement
    apiVersion: cluster.open-cluster-management.io/v1beta1
    name: grid-sites
---
{{- if $remote }}
# file: apps/03-invite-policy.yaml
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSet: global
---
{{- /* One Placement and Policy per remote site, selecting its one cluster by name, so each token
     reaches only the cluster that runs that site and no label can redirect it. */ -}}
{{- range $name, $site := $v.sites }}
{{- if ne $name $v.hub.site }}
---
# file: apps/03-invite-policy.yaml
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-site-{{ $name }}
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: [{{ $site.cluster }}]}
        - {key: local-cluster, operator: DoesNotExist}
---
# file: apps/03-invite-policy.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-invite-{{ $name }}
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-invite-{{ $name }}
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: grid
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-invite-{{ $name }}
              namespace: grid
              labels:
                grid.praxis.fast/site: {{ $name }}
            data:
              # Hub fromSecret output is already encrypted; adding protect encrypts it twice.
              token: '{{`{{hub fromSecret "grid-enrollment" "`}}grid-invite-{{ $name }}{{`" "token" hub}}`}}'
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-ca-bundle
              namespace: grid
            data:
              ca.crt: '{{`{{hub fromSecret "grid-enrollment" "grid-ca-bundle" "ca.crt" hub}}`}}'
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-swim-key
              namespace: grid
            data:
              key: '{{`{{hub fromSecret "grid-enrollment" "grid-swim-key" "key" hub}}`}}'
---
# file: apps/03-invite-policy.yaml
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-invite-{{ $name }}
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-site-{{ $name }}
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: grid-invite-{{ $name }}
{{- end }}
{{- end }}
{{- end }}
