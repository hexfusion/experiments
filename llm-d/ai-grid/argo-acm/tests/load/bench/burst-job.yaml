# Burst arm: burst.py through the front door, timing the first token of each streamed reply.
# Settings are burst.py's environment; scenarios/burst.sh creates the grid-bench ConfigMap.
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-burst
  namespace: grid-load
  labels: {app: grid-load, run: grid-burst}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: {app: grid-load, run: grid-burst}
    spec:
      restartPolicy: Never
      containers:
      - name: burst
        image: ghcr.io/vllm-project/guidellm:v0.7.3@sha256:e3ad2371bfa8e42f2c3d1251b62d0d9c9706c27ae2143c8c048eb5fc6aebb558
        command: [sh, -c, "python /load/burst.py; sleep 600"]
        env:
        - {name: MAAS_KEY, valueFrom: {secretKeyRef: {name: grid-load-key, key: key}}}
        - {name: URL, value: "https://maas.acme.lab/v1/chat/completions"}
        - {name: MODEL, value: qwen3-coder-30b-a3b}
        - {name: RATE, value: "5"}
        - {name: BURST_RATE, value: "10"}
        - {name: BURST_SECS, value: "3"}
        - {name: PERIOD, value: "30"}
        - {name: DURATION, value: "300"}
        - {name: HOME, value: /tmp}
        resources:
          requests: {cpu: "1", memory: 512Mi}
          limits: {memory: 2Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
        volumeMounts:
        - {name: load, mountPath: /load}
      volumes:
      - name: load
        configMap: {name: grid-bench}
