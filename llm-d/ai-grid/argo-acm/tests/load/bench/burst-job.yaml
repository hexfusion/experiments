# Burst arm: steady RATE req/s with a BURST_RATE req/s spike for BURST_SECS every PERIOD seconds,
# through the front door, at scenario 1's long shape (about 512 prompt and 256 output tokens).
# One CSV line per request: start, status, TTFT (streamed), total.
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-burst
  namespace: grid-load
  labels: {app: grid-load, run: grid-burst}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: {app: grid-load, run: grid-burst}
    spec:
      restartPolicy: Never
      containers:
      - name: burst
        image: registry.access.redhat.com/ubi9/ubi:latest
        env:
        - {name: MAAS_KEY, valueFrom: {secretKeyRef: {name: grid-load-key, key: key}}}
        - {name: URL, value: "https://maas.acme.lab/v1/chat/completions"}
        - {name: MODEL, value: qwen3-coder-30b-a3b}
        - {name: RATE, value: "5"}
        - {name: BURST_RATE, value: "10"}
        - {name: BURST_SECS, value: "3"}
        - {name: PERIOD, value: "30"}
        - {name: DURATION, value: "300"}
        command: [bash, -c]
        args:
        - |
          W="river stone lantern harbor engine signal garden copper meadow winter orbit canvas ledger quarry violet thunder anchor bramble cinder falcon glacier hollow island jasper kernel lumber marble nectar oyster pepper quill ribbon saddle timber umber velvet willow yonder zephyr basalt cobalt delta ember fjord granite heron indigo juniper"
          BODY=$(for _ in 1 2 3 4 5 6 7 8; do printf '%s ' $W; done)
          one() {
            s=$(date +%s.%N)
            r=$(curl -sk -m 120 -o /dev/null -w '%{http_code},%{time_starttransfer},%{time_total}' \
              -H "Authorization: Bearer $MAAS_KEY" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$MODEL\",\"stream\":true,\"max_tokens\":256,\"ignore_eos\":true,\"messages\":[{\"role\":\"user\",\"content\":\"Request $1 at $s. Summarize the following notes in detail: $BODY\"}]}" "$URL")
            echo "$s,$1,$r"
          }
          echo "start,id,code,ttft_s,total_s"
          t0=$(date +%s); i=0
          while [ $(( $(date +%s) - t0 )) -lt "$DURATION" ]; do
            el=$(( $(date +%s) - t0 ))
            if [ $(( el % PERIOD )) -lt "$BURST_SECS" ]; then rate=$BURST_RATE; else rate=$RATE; fi
            for _ in $(seq 1 "$rate"); do i=$((i+1)); one "$i" & sleep $(awk -v r=$rate 'BEGIN{printf "%.3f", 1/r}'); done
          done
          wait; echo "BURST DONE"; sleep 600
