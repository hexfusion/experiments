# Generated by make render from grid.yaml. Do not edit.
# The MaaS gateway's request metrics, which the front-door panels read in this mode. RHOAI
# writes this only for a gateway serving an LLMInferenceService.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: maas-default-gateway-metrics
  namespace: openshift-ingress
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  podMetricsEndpoints:
  - port: metrics
    path: /stats/prometheus
    interval: 5s
    relabelings:
    - action: replace
      sourceLabels: [__meta_kubernetes_pod_label_gateway_networking_k8s_io_gateway_name]
      targetLabel: gateway_name
    metricRelabelings:
    # The istio request metrics the front-door panels read, plus the auth-callout upstream
    # counters for MaaSAuthCalloutTimeouts, scoped to the auth cluster to keep cardinality small.
    - action: keep
      sourceLabels: [__name__, cluster_name]
      separator: ';'
      regex: '(istio_requests_total|istio_request_duration_milliseconds_(bucket|sum|count));.*|envoy_cluster_upstream_rq_(timeout|total);.*auth.*'
