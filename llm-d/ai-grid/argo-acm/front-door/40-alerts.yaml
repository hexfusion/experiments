# Generated by make render from grid.yaml. Do not edit.
# The gateway runs in a cluster-monitoring namespace, so platform Prometheus scrapes it and
# evaluates this rule. The UWM grid rules cannot see these series, so this one lives here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: maas-default-gateway-alerts
  namespace: openshift-ingress
spec:
  groups:
  - name: maas-front-door
    interval: 5s
    rules:
    # The MaaS auth callout times out and fails requests closed with a 500.
    - alert: MaaSAuthCalloutTimeouts
      expr: sum(rate(envoy_cluster_upstream_rq_timeout{cluster_name=~".*auth.*"}[30s])) > 0
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: "MaaS auth callout is timing out"
        description: "The Kuadrant auth callout returns upstream timeouts, which fail requests closed with a 500."
