apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-grid-routing
  namespace: open-cluster-management-observability
  labels:
    grafana-custom-dashboard: "true"
  annotations:
    observability.open-cluster-management.io/dashboard-folder: AI Grid
    argocd.argoproj.io/sync-wave: "5"
data:
  ai-grid-routing.json: |
    {
      "schemaVersion": 39,
      "editable": true,
      "tags": [
        "ai-grid"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "current": {},
            "hide": 0
          },
          {
            "name": "cluster",
            "type": "query",
            "label": "Cluster",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(up, cluster)",
              "refId": "cluster"
            },
            "definition": "label_values(up, cluster)",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "refresh": 2,
            "sort": 1,
            "current": {}
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "title": "AI Grid \u2013 Routing",
      "uid": "ai-grid-routing",
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Routing",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "Routing: requests/s by backend (watch it shift)",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster, backend) (rate(praxis_upstream_requests_total{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} to {{backend}}",
              "refId": "A",
              "range": true
            }
          ],
          "description": "Requests each gateway sent to each backend cluster, local site-a and site-b included."
        },
        {
          "type": "timeseries",
          "title": "Routing basis",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster, reason) (rate(grid_route_decisions_total{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{cluster}} {{reason}}",
              "refId": "A",
              "range": true
            }
          ],
          "description": "routed and fallback were sent to a site. not_ready and no_route answered 503, bad_request 400 or 404."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Decisions this window by reason",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (reason) (increase(grid_route_decisions_total{cluster=~\"$cluster\"}[$__range]))",
              "legendFormat": "{{reason}}",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "no data"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Requests routed per backend (this window)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (backend) (increase(praxis_upstream_requests_total{cluster=~\"$cluster\"}[$__range]))",
              "legendFormat": "{{backend}}",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "no data"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "description": "Where each request went, from the gateway that sent it."
        },
        {
          "type": "timeseries",
          "title": "Routed versus refused",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",reason=~\"routed|fallback\"}[5m]))",
              "legendFormat": "{{cluster}} routed",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster) (rate(grid_route_decisions_total{cluster=~\"$cluster\",reason=~\"not_ready|no_route|bad_request\"}[5m]))",
              "legendFormat": "{{cluster}} refused",
              "refId": "B",
              "range": true
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Load",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          }
        },
        {
          "type": "timeseries",
          "title": "[Load] Queue depth (num_requests_waiting)",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster, namespace) (vllm:num_requests_waiting{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} {{namespace}}",
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "[Load] Requests running",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (cluster, namespace) (vllm:num_requests_running{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} {{namespace}}",
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "[Load] KV-cache usage",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "avg by (cluster, namespace) (vllm:kv_cache_usage_perc{cluster=~\"$cluster\"})",
              "legendFormat": "{{cluster}} {{namespace}}",
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "id": 11,
          "type": "row",
          "title": "Latency",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 42
          }
        },
        {
          "type": "timeseries",
          "title": "[Latency] TTFT p95 (s), prefill plus queue",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 43
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, cluster, namespace) (rate(vllm:time_to_first_token_seconds_bucket{cluster=~\"$cluster\"}[5m])))",
              "legendFormat": "{{cluster}} {{namespace}}",
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "[Latency] Decode time p95 (s)",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 43
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "no data",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 0
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le, cluster, namespace) (rate(vllm:request_decode_time_seconds_bucket{cluster=~\"$cluster\"}[5m])))",
              "legendFormat": "{{cluster}} {{namespace}}",
              "refId": "A",
              "range": true
            }
          ],
          "description": "Replaces the TPOT panel: vLLM no longer exports time per output token, and inter-token latency is beside it."
        },
