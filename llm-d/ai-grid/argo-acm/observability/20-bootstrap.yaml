            thanos minio.grid-observability-minio.svc:9000 "$user" "$pass")
          oc -n open-cluster-management-observability create secret generic thanos-object-storage --from-literal="thanos.yaml=$cfg" \
            --dry-run=client -o yaml | oc apply -f - >/dev/null
          echo "wrote open-cluster-management-observability/thanos-object-storage"
        env:
        - {name: HOME, value: /tmp}
