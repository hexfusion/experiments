      "description": "Error and critical log lines, plus Rust and Go panics, vLLM tracebacks, and OOM, across every site and stack. Panics show even when the level parse missed them.",
      "tags": [
        "acme grid"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": false,
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Errors and panics per interval, by site and container",
          "datasource": {
            "type": "loki",
            "uid": "grid-loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "grid-loki"
              },
              "expr": "sum by (openshift_labels_cluster, kubernetes_container_name) (count_over_time({log_type=\"application\"} | regexp \"(?P<panic_hit>panicked at|panic:|goroutine |Traceback|CUDA out of memory|OutOfMemoryError|OOMKilled|out of memory)\" | panic_hit!=\"\" or level=~\"error|critical\" [$__auto]))",
              "legendFormat": "{{openshift_labels_cluster}} / {{kubernetes_container_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "drawStyle": "bars"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "description": "Count of matching lines per interval. A line matches when its parsed level is error or critical, or when it contains a Rust panic (panicked at), a Go panic (panic: or goroutine), a vLLM traceback (Traceback), or an out-of-memory marker. Grouped by site (openshift_labels_cluster) and container, both bounded labels."
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Matching log lines",
          "datasource": {
            "type": "loki",
            "uid": "grid-loki"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "grid-loki"
              },
              "expr": "{log_type=\"application\"} | regexp \"(?P<panic_hit>panicked at|panic:|goroutine |Traceback|CUDA out of memory|OutOfMemoryError|OOMKilled|out of memory)\" | panic_hit!=\"\" or level=~\"error|critical\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "description": "The matching lines themselves, newest first. Expand a line to see its site, namespace, pod, and container labels."
        }
      ],
      "templating": {
        "list": []
      }
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grid-lose-a-site
  namespace: grid-demo-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  instanceSelector:
    matchLabels: {dashboards: grid-demo}
  json: |
    {
      "uid": "grid-lose-a-site",
      "title": "Losing a site",
      "description": "A site drops out of rotation, its traffic moves, and requests keep succeeding.",
      "tags": [
        "acme grid"
      ],
      "timezone": "browser",
      "refresh": "5s",
      "time": {
        "from": "now-10m",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": false,
      "annotations": {
        "list": [
          {
            "name": "Certificate rotated",
            "datasource": {
              "type": "loki",
              "uid": "grid-loki"
            },
            "enable": true,
            "iconColor": "blue",
            "expr": "{kubernetes_namespace_name=\"grid\", kubernetes_container_name=\"operator\"} |= \"site identity rotated\""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "hq",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_reachable{site=\"hq\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "Reachable",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "Unreachable",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "description": "hq: its operator is up and polling. hq does not poll itself."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "factory",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_reachable{site=\"factory\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "Reachable",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "Unreachable",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "description": "Reachable: hq's operator's last signals poll of this site succeeded. Unreachable: it failed. hq polls each site every few seconds."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "retail",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_reachable{site=\"retail\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "Reachable",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "Unreachable",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "description": "Reachable: hq's operator's last signals poll of this site succeeded. Unreachable: it failed. hq polls each site every few seconds."
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Seconds since the last good poll",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_last_poll_age:seconds",
              "legendFormat": "{{site}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 5
          },
          "description": "How stale hq's view of each site is. It climbs steadily once a site stops answering."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Site phase",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_phase",
              "legendFormat": "{{site}}: {{phase}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "no data",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "name",
            "justifyMode": "center"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 5
          },
          "description": "Each site's GridSite phase as hq's operator holds it: Active, Connecting, Unreachable, and so on."
        }
      ],
      "templating": {
        "list": []
      }
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: grid-signals-per-site
  namespace: grid-demo-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  instanceSelector:
    matchLabels: {dashboards: grid-demo}
  json: |
    {
      "uid": "grid-signals-per-site",
      "title": "Signals per site",
      "description": "Every provider's load, capacity, saturation and latency as the hub operator sees it, with how fresh each site's signals are.",
      "tags": ["acme grid"],
      "timezone": "",
      "refresh": "5s",
      "time": {"from": "now-15m", "to": "now"},
      "schemaVersion": 39,
      "editable": false,
      "annotations": {"list": []},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {"h": 2, "w": 24, "x": 0, "y": 0},
          "options": {"mode": "markdown", "content": "### Signals per site: what the hub operator sees for every provider, local and peer"}
        },
        {
          "id": 2,
          "type": "table",
          "title": "Provider signals",
          "description": "One row per provider. Ready 0 or a missing row means the gateway will not route to it.",
          "datasource": {"type": "prometheus", "uid": "grid-thanos"},
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 2},
          "targets": [
            {"refId": "Ready", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_ready", "format": "table", "instant": true},
            {"refId": "InFlight", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_in_flight_requests", "format": "table", "instant": true},
            {"refId": "Capacity", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_capacity_requests", "format": "table", "instant": true},
            {"refId": "Saturation", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_saturation_ratio", "format": "table", "instant": true},
            {"refId": "TTFTp50", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_ttft_p50_seconds", "format": "table", "instant": true},
            {"refId": "Errors", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_error_ratio", "format": "table", "instant": true},
            {"refId": "Age", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "time() - grid_provider_last_scrape_success_timestamp_seconds", "format": "table", "instant": true}
          ],
          "transformations": [
            {"id": "merge", "options": {}},
            {"id": "organize", "options": {
              "excludeByName": {"Time": true, "__name__": true, "job": true, "instance": true, "container": true, "endpoint": true, "namespace": true, "pod": true, "service": true, "prometheus": true, "receive": true, "tenant_id": true},
              "renameByName": {
                "grid_site": "Site", "grid_provider": "Provider",
                "Value #Ready": "Ready", "Value #InFlight": "In flight", "Value #Capacity": "Capacity",
                "Value #Saturation": "Saturation", "Value #TTFTp50": "TTFT p50 (s)", "Value #Errors": "Error ratio",
                "Value #Age": "Age (s)"
              }
            }}
          ],
          "fieldConfig": {
            "defaults": {"custom": {"align": "auto", "filterable": true}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "Ready"}, "properties": [
                {"id": "custom.cellOptions", "value": {"type": "color-background"}},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}
              ]},
              {"matcher": {"id": "byName", "options": "Saturation"}, "properties": [
                {"id": "unit", "value": "percentunit"},
                {"id": "custom.cellOptions", "value": {"type": "color-background"}},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.8}, {"color": "red", "value": 1}]}}
              ]},
              {"matcher": {"id": "byName", "options": "Error ratio"}, "properties": [
                {"id": "unit", "value": "percentunit"}
              ]},
              {"matcher": {"id": "byName", "options": "TTFT p50 (s)"}, "properties": [
                {"id": "unit", "value": "s"}
              ]},
              {"matcher": {"id": "byName", "options": "Age (s)"}, "properties": [
                {"id": "unit", "value": "s"},
                {"id": "custom.cellOptions", "value": {"type": "color-background"}},
                {"id": "thresholds", "value": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 120}]}}
              ]}
            ]
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Saturation by provider",
          "datasource": {"type": "prometheus", "uid": "grid-thanos"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 11},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_saturation_ratio", "legendFormat": "{{grid_site}} / {{grid_provider}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "custom": {"fillOpacity": 10}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.8}]}}, "overrides": []}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Signal age by provider",
          "description": "Seconds since the operator's last successful scrape of each provider, local and peer.",
          "datasource": {"type": "prometheus", "uid": "grid-thanos"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 11},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "time() - grid_provider_last_scrape_success_timestamp_seconds", "legendFormat": "{{grid_provider}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"fillOpacity": 10}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 120}]}}, "overrides": []}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "In flight against capacity",
          "datasource": {"type": "prometheus", "uid": "grid-thanos"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 19},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_in_flight_requests", "legendFormat": "in flight {{grid_site}} / {{grid_provider}}"},
            {"refId": "B", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_capacity_requests", "legendFormat": "capacity {{grid_site}} / {{grid_provider}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"fillOpacity": 0}}, "overrides": []}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "TTFT p50 by provider",
          "datasource": {"type": "prometheus", "uid": "grid-thanos"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 19},
          "targets": [
            {"refId": "A", "datasource": {"type": "prometheus", "uid": "grid-thanos"}, "expr": "grid_provider_ttft_p50_seconds", "legendFormat": "{{grid_site}} / {{grid_provider}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"fillOpacity": 10}}, "overrides": []}
        }
      ]
    }
