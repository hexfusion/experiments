       "description": "Arrow width is each backend's share of routed requests over the last minute; arrow and box color is its saturation (rho, in-flight over the learned ceiling): green has room, amber is near the ceiling, red is at it. Gray means unmeasured. All inputs are relayed from each site's EPP by its operator; the gateway counts nothing of its own."
      },
      {
