              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_share:ratio",
              "legendFormat": "{{site}}",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "noValue": "no traffic"
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "description": "Each site's share of the last half minute's requests."
        },
        {
          "id": 2,
