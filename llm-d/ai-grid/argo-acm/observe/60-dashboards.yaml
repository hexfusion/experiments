          "title": "Average request time by site",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "grid-thanos"
              },
              "expr": "grid:site_latency_mean:seconds",
              "legendFormat": "{{site}}",
              "refId": "A",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              },
              "noValue": "no traffic",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "description": "Mean request time hq's grid gateway measures to each site, from praxis's request-duration summary. A gateway measurement for the audience, not a routing signal: the grid routes on the signals each site's EPP publishes."
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requests per second by site",
          "datasource": {
            "type": "prometheus",
            "uid": "grid-thanos"
          },
          "targets": [
            {
