# Generated by make render from grid.yaml. Do not edit.
# Site names on the gateway's series. User workload monitoring confines these rules to the
# grid namespace, where the gateway and operator metrics live.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grid-demo
  namespace: grid
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  groups:
  - name: grid-demo
    interval: 5s
    rules:
    # The one name mapping, from grid.yaml: each ACM cluster to its site, each backend to its
    # site, and each tenant namespace (as tenant_namespace) to its backend and site.
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", "site-d", "", ""), "site", "factory", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "factory", "", ""), "site", "factory", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "llm-d", "", ""), "backend", "factory", "", ""), "site", "factory", "", "")
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", "local-cluster", "", ""), "site", "hq", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "hq-east", "", ""), "site", "hq", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "ai-tenant-site-a", "", ""), "backend", "hq-east", "", ""), "site", "hq", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "hq-west", "", ""), "site", "hq", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "ai-tenant-site-b", "", ""), "backend", "hq-west", "", ""), "site", "hq", "", "")
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", "site-e", "", ""), "site", "retail", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "retail", "", ""), "site", "retail", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "ai-tenant-retail", "", ""), "backend", "retail", "", ""), "site", "retail", "", "")
    - record: grid:requests_by_backend:rate
      expr: sum by (backend) (rate(praxis_upstream_requests_total[30s]))
    - record: grid:requests_by_site:rate
      expr: sum by (site) (grid:requests_by_backend:rate * on (backend) group_left (site) grid:backend_site:info)
    - record: grid:site_share:ratio
      expr: grid:requests_by_site:rate / ignoring (site) group_left sum(grid:requests_by_site:rate)
    - record: grid:front_door_allowed:rate
      expr: sum(rate(praxis_http_requests_total{status_class="2xx"}[30s])) or vector(0)
    - record: grid:front_door_limited:rate
      expr: sum(rate(praxis_rate_limit_limited_total{shadow="false"}[30s])) or vector(0)
    - record: grid:front_door_rejected:rate
      expr: clamp_min((sum(rate(praxis_http_requests_total{status_class="4xx"}[30s])) or vector(0)) - grid:front_door_limited:rate, 0)
    - record: grid:front_door_failed:rate
      expr: sum(rate(praxis_http_requests_total{status_class="5xx"}[30s])) or vector(0)
    - record: grid:success:ratio
      expr: grid:front_door_allowed:rate / (grid:front_door_allowed:rate + grid:front_door_rejected:rate + grid:front_door_limited:rate + grid:front_door_failed:rate)
    # A site serves while any of its candidates holds a score; an excluded or demoted one is NaN.
    - record: grid:site_serving
      expr: (count by (site) (grid_route_site_score == grid_route_site_score) > bool 0) or on (site) (count by (site) (grid_route_site_score) * 0)
    # The queue depth the hub last polled from each site, lowest of its candidates.
    - record: grid:site_queue
      expr: min by (site) (grid_route_site_score < +Inf)
    # Praxis exports request duration as a summary, whose quantiles do not aggregate, so the
    # per-site figure is the mean from its _sum and _count.
    - record: grid:site_latency_mean:seconds
      expr: sum by (site) (rate(praxis_http_request_duration_seconds_sum[30s]) * on (backend) group_left (site) grid:backend_site:info) / sum by (site) (rate(praxis_http_request_duration_seconds_count[30s]) * on (backend) group_left (site) grid:backend_site:info)
    - record: grid:decisions_by_outcome:rate
      expr: sum by (reason) (rate(grid_route_decisions_total[30s]))
    # The hub's own site identity; other sites' identities are not collected here.
    - record: grid:identity_valid:seconds
      expr: label_replace(min(grid_site_identity_expiry_timestamp_seconds) - time(), "site", "hq", "", "")
