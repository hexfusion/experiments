# Generated by make render from grid.yaml. Do not edit.
# Site names on the gateway's series. User workload monitoring confines these rules to the
# grid namespace, where the gateway and operator metrics live.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grid-demo
  namespace: grid
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  groups:
  - name: grid-demo
    interval: 5s
    rules:
    # The one name mapping, from grid.yaml: each ACM cluster to its site, each backend to its
    # site, and each tenant namespace (as tenant_namespace) to its backend and site.
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", "site-d", "", ""), "site", "factory", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "factory", "", ""), "site", "factory", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "llm-d", "", ""), "backend", "factory", "", ""), "site", "factory", "", "")
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", "local-cluster", "", ""), "site", "hq", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "hq-east", "", ""), "site", "hq", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "ai-tenant-site-a", "", ""), "backend", "hq-east", "", ""), "site", "hq", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "hq-west", "", ""), "site", "hq", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "ai-tenant-site-b", "", ""), "backend", "hq-west", "", ""), "site", "hq", "", "")
    - record: grid:cluster_site:info
      expr: label_replace(label_replace(vector(1), "acm_cluster", "site-e", "", ""), "site", "retail", "", "")
    - record: grid:backend_site:info
      expr: label_replace(label_replace(vector(1), "backend", "retail", "", ""), "site", "retail", "", "")
    - record: grid:tenant_backend:info
      expr: label_replace(label_replace(label_replace(vector(1), "tenant_namespace", "ai-tenant-retail", "", ""), "backend", "retail", "", ""), "site", "retail", "", "")
    # Site state from hq's operator, which polls each site's signals under a peer label that
    # is the site name.
    - record: grid:site_reachable
      expr: label_replace(max by (peer) (grid_collection_up), "site", "$1", "peer", "(.+)")
    # hq does not poll itself; its tile shows its own operator is up.
    - record: grid:site_reachable
      expr: label_replace(max(up{job="grid-operator-metrics"}), "site", "hq", "", "")
    - record: grid:site_last_poll_age:seconds
      expr: label_replace(time() - max by (peer) (grid_peer_last_success_timestamp_seconds), "site", "$1", "peer", "(.+)")
    - record: grid:site_phase
      expr: max by (site, phase) (grid_site_phase == 1)
    # The hub's own site identity; other sites' identities are not collected here.
    - record: grid:identity_valid:seconds
      expr: label_replace(min(grid_site_identity_expiry_timestamp_seconds) - time(), "site", "hq", "", "")
    # Per-site saturation from the operator's signals, limited to ready providers.
    - record: grid:site_saturation:ratio
      expr: max by (grid_site) (grid_provider_saturation_ratio and on (grid_site, grid_provider) grid_provider_ready == 1)
  # Routing debuggability: a provider with no usable signals must raise an alert from status,
  # not stay silent while the gateway pins traffic to one site.
  - name: grid-demo-alerts
    interval: 5s
    rules:
    # A provider the operator knows about but cannot scrape reports ready 0.
    - alert: ProviderNoSignals
      expr: grid_provider_ready == 0
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: "Provider {{ $labels.grid_provider }} at {{ $labels.grid_site }} is not ready"
        description: "grid_provider_ready is 0 for 2m. The gateway will not route to this provider."
    # Ready, but the load signal is missing: the row exists with no in-flight series.
    - alert: ProviderSignalsIncomplete
      expr: grid_provider_ready == 1 unless on (grid_site, grid_provider) grid_provider_in_flight_requests
      for: 2m
      labels: {severity: warning}
      annotations:
        summary: "Provider {{ $labels.grid_provider }} at {{ $labels.grid_site }} has no load signal"
        description: "The provider is ready but publishes no grid_provider_in_flight_requests for 2m."
    # The whole provider signal set is gone from the hub operator.
    - alert: ProviderSignalsAbsent
      expr: absent(grid_provider_ready)
      for: 2m
      labels: {severity: critical}
      annotations:
        summary: "No provider signals on the hub operator"
        description: "grid_provider_ready has no series for 2m. The operator publishes no provider signals for any site."
    # Scrapes are failing, by result class. Catches a provider that has never succeeded,
    # which publishes no signal series at all, so it does not depend on a ready 0 row.
    - alert: ProviderScrapeFailing
      expr: sum by (grid_provider, result) (increase(grid_provider_scrape_total{result!="success"}[2m])) > 0
      labels: {severity: warning}
      annotations:
        summary: "Scrape of {{ $labels.grid_provider }} is failing ({{ $labels.result }})"
        description: "grid_provider_scrape_total for a non-success result increased over the last 2m."
    # Signals are present but stale: the last good scrape is too old.
    - alert: ProviderSignalsStale
      expr: time() - grid_provider_last_scrape_success_timestamp_seconds > 120
      for: 1m
      labels: {severity: warning}
      annotations:
        summary: "Signals for {{ $labels.grid_provider }} are stale"
        description: "The last successful scrape of this provider is older than 2m."
    # The hub's last good poll of a peer is stale.
    - alert: PeerPollStale
      expr: grid:site_last_poll_age:seconds > 120
      for: 1m
      labels: {severity: warning}
      annotations:
        summary: "Signals from {{ $labels.site }} are stale"
        description: "The hub's last good poll of this site is older than 2m."
    # One site is saturated while another ready site sits idle: routing may be pinned.
    - alert: SiteMonopoly
      expr: (max(grid:site_saturation:ratio) >= 0.8) and (min(grid:site_saturation:ratio) < 0.2)
      for: 5m
      labels: {severity: warning}
      annotations:
        summary: "One site is saturated while another admitted site is idle"
        description: "A ready site sits under 0.2 saturation while another is at or above 0.8 for 5m."
