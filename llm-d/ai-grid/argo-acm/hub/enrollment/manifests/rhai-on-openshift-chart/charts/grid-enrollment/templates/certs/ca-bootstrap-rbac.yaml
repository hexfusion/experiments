apiVersion: v1
kind: ServiceAccount
metadata:
  name: grid-enrollment-ca-bootstrap
  namespace: grid-enrollment
  labels:
    helm.sh/chart: grid-enrollment-0.1.0
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: grid-enrollment
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
---
# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/certs/ca-bootstrap-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grid-enrollment-ca-bootstrap
  namespace: grid-enrollment
  labels:
    helm.sh/chart: grid-enrollment-0.1.0
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: grid-enrollment
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
rules:
  # create cannot be resourceName-scoped (the object does not exist yet).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/update restricted to exactly the Secrets the bootstrap manages,
  # so this SA cannot read any other Secret in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "grid-ca-key"
      - "grid-ca-bundle"
      - "enrollment-serving-tls"
      - "grid-db-serving-tls"
      - "grid-enrollment-db"
    verbs: ["get", "update"]
  # The SWIM key is created once and only read back, never replaced.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "grid-swim-key"
    verbs: ["get"]
  # patch marks the generated credentials so Argo CD never prunes them.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "grid-enrollment-db"
    verbs: ["patch"]
  # Read and roll the builtin Postgres, and nothing else, so it serves the
  # certificate its Secret holds.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - "grid-enrollment-db"
    verbs: ["get", "patch"]
