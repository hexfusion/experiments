---
# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/enrollment/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-enrollment
  namespace: grid-enrollment
  labels:
    helm.sh/chart: grid-enrollment-0.1.0
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: grid-enrollment
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-enrollment
      app.kubernetes.io/instance: grid-enrollment
      app.kubernetes.io/component: enrollment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: grid-enrollment
        app.kubernetes.io/component: enrollment
    spec:
      enableServiceLinks: false
      serviceAccountName: grid-enrollment
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The service applies its schema on first connect, so it only needs the
        # DB reachable. External DBs are assumed already up.
        - name: wait-for-db
          image: "quay.io/sclorg/postgresql-16-c9s:20260923"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - "until pg_isready -h grid-enrollment-db -p 5432; do echo 'waiting for db'; sleep 2; done"
      containers:
        - name: enrollment
          image: "quay.io/sbatsche/grid-enrollment@sha256:777e60a8c139442fe5ac8141aed3ed26585ca7da63b2904d2eff8a18553df4fc"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: RUST_LOG
              value: "info"
            # CA signing material (file paths; read via std::fs). Key is mounted
            # ONLY into this pod, never the gateway.
            - name: ENROLLMENT_CA_CERT
              value: /etc/grid-ca/tls.crt
            - name: ENROLLMENT_CA_KEY
              value: /etc/grid-ca/tls.key
            - name: ENROLLMENT_CA_COMMON_NAME
              value: "grid-ca"
            # In-process TLS serving cert (file paths).
            - name: ENROLLMENT_TLS_CERT
              value: /etc/grid-tls/tls.crt
            - name: ENROLLMENT_TLS_KEY
              value: /etc/grid-tls/tls.key
            - name: ENROLLMENT_LISTEN_ADDR
              value: "0.0.0.0:8443"
            - name: ENROLLMENT_AUTHZ
              value: "kube"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENROLLMENT_TOKEN_AUDIENCE
              value: "grid-enrollment"
            - name: ENROLLMENT_RESERVED_SITES
              value: "dagobah"
            - name: ENROLLMENT_RESERVED_SEEDS_DIR
              value: /etc/grid-reserved-seeds
            - name: DB_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: grid-enrollment-db
                  key: DB_CONNECTION_URL
          volumeMounts:
            - name: grid-ca
              mountPath: /etc/grid-ca
              readOnly: true
            - name: grid-tls
              mountPath: /etc/grid-tls
              readOnly: true
            # sslrootcert for the builtin DB's verify-full connection.
            - name: grid-ca-bundle
              mountPath: /etc/grid-ca-bundle
              readOnly: true
            - name: grid-reserved-seeds
              mountPath: /etc/grid-reserved-seeds
              readOnly: true
      volumes:
        # Signing key + cert. This is the only pod that mounts grid-ca-key.
        - name: grid-ca
          secret:
            secretName: grid-ca-key
        - name: grid-tls
          secret:
            secretName: enrollment-serving-tls
        - name: grid-ca-bundle
          secret:
            secretName: grid-ca-bundle
        # Trusted only where the CA signed it.
        - name: grid-reserved-seeds
          secret:
            secretName: grid-reserved-seeds
            optional: true
