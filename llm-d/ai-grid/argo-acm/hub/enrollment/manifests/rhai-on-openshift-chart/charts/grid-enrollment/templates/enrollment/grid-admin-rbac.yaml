---
# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/enrollment/grid-admin-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grid-enrollment-grid-admin
  namespace: grid-enrollment
  labels:
    helm.sh/chart: grid-enrollment-0.2.0
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: grid-enrollment
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["grid.praxis.fast"]
    resources: ["enrollmenttokens"]
    verbs: ["create", "delete"]
  # Reading a site's enrollment diagnoses a refused rotation; it shows digests only.
  - apiGroups: ["grid.praxis.fast"]
    resources: ["enrollments"]
    verbs: ["get"]
