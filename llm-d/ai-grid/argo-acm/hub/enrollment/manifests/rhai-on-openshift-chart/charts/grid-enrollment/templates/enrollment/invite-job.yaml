# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/enrollment/invite-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-enrollment-invite
  namespace: grid-enrollment
  labels:
    helm.sh/chart: grid-enrollment-0.2.0
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: grid-enrollment
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: invite
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: grid-enrollment
        app.kubernetes.io/component: invite
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: grid-enrollment-invite
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: invite
          image: "quay.io/opendatahub/odh-praxis-grid-enrollment@sha256:0811a9078c4c5e267a5e26dce0614d4adf9c2b939eb04bdf29fd58d48c33d0f1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command: ["enrollment", "invite"]
          args:
            - "--namespace"
            - "grid-enrollment"
            - "--url"
            - "https://grid-enrollment.grid-enrollment.svc:8443"
            - "--ca-file"
            - "/etc/grid-ca/ca.crt"
            - "--admin-token-file"
            - "/var/run/secrets/grid-enrollment/token"
          env:
            - name: ENROLLMENT_INVITES
              value: "[{\"gridNetworkRef\":\"grid\",\"siteName\":\"factory\"},{\"gridNetworkRef\":\"grid\",\"siteName\":\"retail\"}]"
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: grid-ca
              mountPath: /etc/grid-ca
              readOnly: true
            - name: admin-token
              mountPath: /var/run/secrets/grid-enrollment
              readOnly: true
      volumes:
        - name: grid-ca
          secret:
            secretName: "grid-ca-bundle"
            items:
              - key: ca.crt
                path: ca.crt
        - name: admin-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "grid-enrollment"
                  expirationSeconds: 600
                  path: token
