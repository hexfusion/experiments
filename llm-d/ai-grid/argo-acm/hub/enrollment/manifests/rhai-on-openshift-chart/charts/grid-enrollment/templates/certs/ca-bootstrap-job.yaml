---
# Source: rhai-on-openshift-chart/charts/grid-enrollment/templates/certs/ca-bootstrap-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: grid-enrollment-ca-bootstrap
  namespace: grid-enrollment
  labels:
    helm.sh/chart: grid-enrollment-0.2.0
    app.kubernetes.io/name: grid-enrollment
    app.kubernetes.io/instance: grid-enrollment
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ca-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Kept for its logs until the next hook run or its TTL.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-enrollment
        app.kubernetes.io/instance: grid-enrollment
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: grid-enrollment-ca-bootstrap
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ca-bootstrap
          image: "quay.io/opendatahub/odh-praxis-grid-enrollment@sha256:0811a9078c4c5e267a5e26dce0614d4adf9c2b939eb04bdf29fd58d48c33d0f1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command: ["enrollment", "bootstrap"]
          env:
            - name: RUST_LOG
              value: "info"
            - name: ENROLLMENT_CERT_LIFETIME_SECS
              value: "14400"
          args:
            - "--namespace"
            - "grid-enrollment"
            - "--db-credentials-secret"
            - "grid-enrollment-db"
            - "--db-user"
            - "enrollment"
            - "--db-database"
            - "enrollment"
            - "--db-host"
            - "grid-enrollment-db"
            - "--common-name"
            - "grid-ca"
            - "--ca-key-secret"
            - "grid-ca-key"
            - "--ca-bundle-secret"
            - "grid-ca-bundle"
            - "--serving-secret"
            - "enrollment-serving-tls"
            - "--serving-dns"
            - "grid-enrollment.grid-enrollment.svc"
            - "--serving-dns"
            - "enroll.acme.lab"
            - "--serving-dns"
            - "enroll.acme.lab"
            - "--db-serving-secret"
            - "grid-db-serving-tls"
            - "--db-dns"
            - "grid-enrollment-db"
            - "--db-dns"
            - "grid-enrollment-db.grid-enrollment.svc"
            - "--db-deployment"
            - "grid-enrollment-db"
            - "--site-name"
            - "hq"
            - "--site-namespace"
            - "grid"
            - "--site-secret"
            - "grid-site-identity"
            - "--site-ca-secret"
            - "grid-ca"
            - "--reserved-seeds-secret"
            - "grid-reserved-seeds"
            - "--swim-key-secret"
            - "grid-swim-key"
