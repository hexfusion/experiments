---
# Source: rhai-on-openshift-chart/charts/grid-operator/templates/gridnetwork.yaml
apiVersion: grid.praxis.fast/v1alpha1
kind: GridNetwork
metadata:
  name: "grid"
  labels:
    helm.sh/chart: grid-operator-0.2.0
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-hq
    app.kubernetes.io/version: "v0.2.0"
    app.kubernetes.io/managed-by: Helm
    grid.praxis.fast/auto-discover-sites: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  gridId: "lab"
  signalTransport:
    mode: "poll"
  peerTrust:
    mode: "spiffe"
  gatewayRefs:
    - name: "grid-gateway"
      namespace: "grid"
      localSiteName: "hq"
      consumerConfig:
        configMapName: grid-consumer-config
        deriveTopology:
          fromProviders:
          - hq-east
          - hq-west
          - factory
          - retail
          transport:
            caSecretRef:
              name: grid-service-ca
            mode: tls
        enabled: true
  tls:
    siteSecretRef:
      name: "grid-site-identity"
      namespace: "grid"
    caSecretRef:
      name: "grid-ca"
      namespace: "grid"
    swimKeyRef:
      name: "grid-swim-key"
      namespace: "grid"
