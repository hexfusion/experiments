---
# Source: rhai-on-openshift-chart/charts/grid-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-operator
  labels:
    helm.sh/chart: grid-operator-0.1.4
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-hq
    app.kubernetes.io/version: "v0.1.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # One SWIM identity per site: a surge pod would gossip a second one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-operator
      app.kubernetes.io/instance: grid-hq
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/instance: grid-hq
        app.kubernetes.io/name: grid-operator
    spec:
      serviceAccountName: grid-operator
      # Service link env vars (a grid-gateway Service injects GRID_GATEWAY_PORT)
      # would collide with the operator's GRID_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: quay.io/sbatsche/grid-operator@sha256:77cb71c30225aabf3c4893ab513fc0b230c18d2d16b9e3dad26338e190d537c2
          imagePullPolicy: "IfNotPresent"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GRID_SWIM_BIND_ADDR
              value: "0.0.0.0:7946"
            - name: GRID_SWIM_ADVERTISE_ADDR
              value: "$(POD_IP):7946"
            - name: GRID_SWIM_ADVERTISE_FALLBACK
              value: "$(POD_IP):7946"
            - name: GRID_SWIM_SERVICE_NAME
              value: "grid-operator-swim"
            - name: GRID_SWIM_SITE_NAME
              value: "hq"
            - name: GRID_GATEWAY_SERVICE_NAME
              value: "grid-gateway"
            - name: GRID_GATEWAY_NAMESPACE
              value: "grid"
            - name: GRID_GATEWAY_PORT
              value: "8080"
            - name: GRID_SIGNAL_TRANSPORT
              value: "poll"
            - name: GRID_PEER_TRUST
              value: "spiffe"
            - name: GRID_METRICS_SCRAPER_SERVICE_ACCOUNT
              value: "grid-operator-metrics-scraper"
            - name: GRID_METRICS_SCRAPER_NAMESPACE
              value: "grid"
            # Binds each scrape token to this pod, so it stops working when the pod goes.
            - name: GRID_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GRID_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: GRID_SIGNALS_LOCAL_ADDR
              value: "grid-operator-swim.grid.svc:9091"
            - name: GRID_METRICS_ADDR
              value: "0.0.0.0:9090"
            - name: GRID_METRICS_TLS_CERT
              value: "/etc/grid/metrics-tls/tls.crt"
            - name: GRID_METRICS_TLS_KEY
              value: "/etc/grid/metrics-tls/tls.key"
            - name: RUST_LOG
              value: "info,operator=debug"
            - name: GRID_ROTATION_ENABLED
              value: "true"
            - name: GRID_ENROLL_URL
              value: "https://enroll.acme.lab"
            - name: GRID_ENROLL_IDENTITY_SECRET
              value: "grid-site-identity"
            - name: GRID_ENROLL_CA_SECRET
              value: "grid-ca"
          volumeMounts:
            - name: metrics-tls
              mountPath: "/etc/grid/metrics-tls"
              readOnly: true
          ports:
            - name: swim-udp
              containerPort: 7946
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: signals
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: metrics-tls
          secret:
            secretName: "grid-operator-metrics-tls"
            defaultMode: 0440
