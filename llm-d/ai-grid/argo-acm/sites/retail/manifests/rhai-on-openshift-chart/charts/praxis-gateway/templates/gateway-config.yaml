---
# Source: rhai-on-openshift-chart/charts/praxis-gateway/templates/gateway-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grid-gateway-config
  labels:
    helm.sh/chart: praxis-gateway-0.1.5
    app.kubernetes.io/name: praxis-gateway
    app.kubernetes.io/instance: grid-retail
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
data:
  praxis.yaml: |
    admin:
      address: "127.0.0.1:9901"
    listeners:
      - name: gateway
        address: "0.0.0.0:8080"
        tls:
          certificates:
            - cert_path: "/etc/praxis/tls/tls.crt"
              key_path: "/etc/praxis/tls/tls.key"
          client_ca:
            ca_path: "/etc/praxis/tls/ca.crt"
          client_cert_mode: require_named
        filter_chains: [main]
    filter_chains:
      - name: main
        filters:
          - filter: static_response
            status: 405
            conditions:
              - unless:
                  methods: [GET, POST]
          # Exact paths: a traversal or a longer path never matches, so it gets a 404.
          - filter: router
            routes:
              - path: "/v1/chat/completions"
                cluster: "local"
              - path: "/v1/completions"
                cluster: "local"
              - path: "/v1/models"
                cluster: "local"
              - path: "/v1/embeddings"
                cluster: "local"
          - filter: headers
            response_set:
              - name: X-Grid-Provider-Site
                value: "retail"
          - filter: load_balancer
            clusters:
              - name: "local"
                tls:
                  ca:
                    ca_path: "/etc/praxis/backend-ca/0/service-ca.crt"
                  sni: "grid-internal-openshift-ai-inference.ai-tenant-retail.svc.cluster.local"
                  verify: true
                endpoints:
                  - "grid-internal-openshift-ai-inference.ai-tenant-retail.svc.cluster.local.:443"
                trusted_private_endpoints:
                  - "grid-internal-openshift-ai-inference.ai-tenant-retail.svc.cluster.local"
                health_check:
                  type: "tcp"
                  interval_ms: 5000
                  timeout_ms: 2000
                  healthy_threshold: 1
                  unhealthy_threshold: 3
