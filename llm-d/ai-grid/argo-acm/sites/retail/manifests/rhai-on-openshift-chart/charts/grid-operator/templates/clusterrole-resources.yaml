---
# Source: rhai-on-openshift-chart/charts/grid-operator/templates/clusterrole-resources.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grid-operator-resources
  labels:
    helm.sh/chart: grid-operator-0.1.5
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-retail
    app.kubernetes.io/version: "v0.1.5"
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    # Both Services unconditionally: the operator reads whichever one carries its
    # signals address, and gating the grant on a value that can disagree with the
    # Deployment's env is how it goes missing.
    resourceNames:
      - "grid-gateway"
      - "grid-operator-swim"
      - "grid-operator-signals"
    verbs: ["get"]
  # A rotation rolls the gateway, which loads its upstream client certificate only at start.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["grid-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch", "update"]
