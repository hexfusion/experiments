# The hub: it hosts enrollment, so it does not enroll, and grid-enrollment's
# hubSite issues its identity. Its gateway is the grid front door.
grid-operator:
  metrics:
    tls:
      enabled: true
  site: {name: dagobah, region: lab, zone: dagobah}
  enrollment:
    enabled: false
  rbac:
    enrollmentNamespace: grid-enrollment
  grid:
    providers:
      qwen3-site-a:
        model: Qwen3-Coder-30B-A3B
        endpoint: http://qwen3-kserve-workload-svc.ai-tenant-site-a.svc.cluster.local:8000
        routingClusterRef: site-a
      qwen3-site-b:
        model: Qwen3-Coder-30B-A3B
        endpoint: http://qwen3-kserve-workload-svc.ai-tenant-site-b.svc.cluster.local:8000
        routingClusterRef: site-b
praxis-gateway:
  service:
    type: ClusterIP
    port: 8080
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
  route:
    enabled: true
    host: grid.apps.dagobah.hexfusion.local
    tls:
      termination: reencrypt
  networkPolicy:
    enabled: true
    from:
    - podSelector: {}
    # The default IngressController's routers, host network included.
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
  gatewayConfig:
    localSite: dagobah
    role: consumer
    listenerTls:
      enabled: true
      existingSecret: grid-gateway-listener-tls
    auth:
      mode: api-key
      validateUrl: https://maas-api-site-a.redhat-ai-gateway-infra.svc.cluster.local:8443/internal/v1/api-keys/validate
      allowPrivateEndpoint: true
      validateCA: {configMap: openshift-service-ca.crt, key: service-ca.crt}
    # Static routing for now: gridServing turns on with the next gateway image.
    backends:
    - cluster: site-a
      endpoints: [qwen3-kserve-workload-svc.ai-tenant-site-a.svc.cluster.local.:8000]
      transport:
        mode: tls
        ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
      trustPrivate: true
    - cluster: site-b
      endpoints: [qwen3-kserve-workload-svc.ai-tenant-site-b.svc.cluster.local.:8000]
      transport:
        mode: tls
        ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
      trustPrivate: true
    - cluster: site-d
      site: site-d
      endpoints: [192.168.1.150:8080]
      transport: {mode: mutual_tls, sni: site-d.grid.internal}
