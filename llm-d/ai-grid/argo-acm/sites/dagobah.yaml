# The hub: grid-role=hub on its ManagedCluster turns enrollment off, and
# grid-enrollment's hubSite issues its identity. Its gateway is the grid front door.
grid-operator:
  rbac:
    enrollmentNamespace: grid-enrollment
praxis-gateway:
  service:
    type: ClusterIP
    port: 8080
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
  route:
    enabled: true
    host: grid.apps.dagobah.hexfusion.local
    tls:
      termination: reencrypt
  networkPolicy:
    enabled: true
    from:
    - podSelector: {}
    # The default IngressController's routers, host network included.
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
  gridServing:
    enabled: true
    network: grid
  gatewayConfig:
    role: consumer
    listenerTls:
      enabled: true
      existingSecret: grid-gateway-listener-tls
    auth:
      mode: api-key
      validateUrl: https://maas-api-site-a.redhat-ai-gateway-infra.svc.cluster.local:8443/internal/v1/api-keys/validate
      allowPrivateEndpoint: true
      validateCA: {configMap: openshift-service-ca.crt, key: service-ca.crt}
    # One upstream per candidate cluster: the serving config names clusters, not endpoints.
    backends:
    - cluster: site-d
      endpoints: [192.168.1.150:8080]
      transport: {mode: mutual_tls, sni: site-d.grid.internal}
