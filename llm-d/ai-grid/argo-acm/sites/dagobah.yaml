grid-operator:
  swim:
    seeds: 192.168.1.150:7946
  rbac:
    enrollmentNamespace: grid-enrollment
praxis-gateway:
  service:
    type: ClusterIP
    port: 8080
  networkPolicy:
    enabled: true
    from:
    - podSelector: {}
  gatewayConfig:
    role: consumer
    auth:
      mode: api-key
      validateUrl: https://maas-api-site-a.redhat-ai-gateway-infra.svc.cluster.local:8443/internal/v1/api-keys/validate
      allowPrivateEndpoint: true
      validateCA: {configMap: openshift-service-ca.crt, key: service-ca.crt}
    backends:
    - cluster: site-a
      endpoints: [qwen3-kserve-workload-svc.ai-tenant-site-a.svc.cluster.local.:8000]
      transport:
        mode: tls
        ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
      trustPrivate: true
    - cluster: site-d
      site: site-d
      endpoints: [192.168.1.150:8080]
      transport: {mode: mutual_tls, sni: site-d.grid.internal}
