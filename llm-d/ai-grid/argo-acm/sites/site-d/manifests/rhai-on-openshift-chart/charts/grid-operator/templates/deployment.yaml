---
# Source: rhai-on-openshift-chart/charts/grid-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-operator
  labels:
    helm.sh/chart: grid-operator-0.1.4
    app.kubernetes.io/name: grid-operator
    app.kubernetes.io/instance: grid-site-d
    app.kubernetes.io/version: "v0.1.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # One SWIM identity per site: a surge pod would gossip a second one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-operator
      app.kubernetes.io/instance: grid-site-d
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/instance: grid-site-d
        app.kubernetes.io/name: grid-operator
    spec:
      serviceAccountName: grid-operator
      # Service link env vars (a grid-gateway Service injects GRID_GATEWAY_PORT)
      # would collide with the operator's GRID_* settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: quay.io/sbatsche/grid-operator@sha256:cbafcdcb3dcdd32c4b844eee967c240d245961911727de4cf5d9816dd810492c
          imagePullPolicy: "IfNotPresent"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GRID_SWIM_BIND_ADDR
              value: "0.0.0.0:7946"
            - name: GRID_SWIM_ADVERTISE_ADDR
              value: "$(POD_IP):7946"
            - name: GRID_SWIM_ADVERTISE_FALLBACK
              value: "$(POD_IP):7946"
            - name: GRID_SWIM_SERVICE_NAME
              value: "grid-operator-swim"
            - name: GRID_SWIM_SITE_NAME
              value: "site-d"
            - name: GRID_SWIM_SEEDS
              value: "192.168.1.204:7946"
            - name: GRID_GATEWAY_SERVICE_NAME
              value: "grid-gateway"
            - name: GRID_GATEWAY_NAMESPACE
              value: "grid"
            - name: GRID_GATEWAY_PORT
              value: "8080"
            - name: GRID_SIGNALS_LOCAL_ADDR
              value: "grid-operator-swim.grid.svc:9091"
            - name: GRID_METRICS_ADDR
              value: "0.0.0.0:9090"
            - name: GRID_METRICS_TLS_SITE_SECRET
              value: "grid-site-identity"
            - name: RUST_LOG
              value: "info"
            - name: GRID_ENROLL_ENABLED
              value: "true"
            - name: GRID_ENROLL_URL
              value: "https://enroll.apps.dagobah.hexfusion.local"
            - name: GRID_ENROLL_SITE_NAME
              value: "site-d"
            - name: GRID_ENROLL_CA_FILE
              value: /etc/grid-enroll/pin/ca.crt
            - name: GRID_ENROLL_TOKEN_SECRET
              value: "grid-invite-site-d"
            - name: GRID_ENROLL_TOKEN_SECRET_KEY
              value: "token"
            - name: GRID_ENROLL_IDENTITY_SECRET
              value: "grid-site-identity"
            - name: GRID_ENROLL_CA_SECRET
              value: "grid-ca"
          volumeMounts:
            - name: enroll-pin
              mountPath: /etc/grid-enroll/pin
              readOnly: true
          ports:
            - name: swim-udp
              containerPort: 7946
              protocol: UDP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: signals
              containerPort: 9091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 96
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: enroll-pin
          secret:
            secretName: "grid-ca-bundle"
            items:
              - key: "ca.crt"
                path: ca.crt
