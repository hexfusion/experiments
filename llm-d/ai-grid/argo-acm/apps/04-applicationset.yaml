apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grid-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: false
  generators:
  - clusters:
      selector:
        matchLabels:
          cluster.open-cluster-management.io/clusterset: grid
  template:
    metadata:
      name: 'grid-{{metadata.labels.site}}'
    spec:
      project: default
      sources:
      - repoURL: quay.io/sbatsche
        chart: rhai-on-openshift-chart
        targetRevision: 3.6.0-aigrid.dev-a7f8d2ca
        helm:
          valueFiles:
          - $values/llm-d/ai-grid/argo-acm/sites/{{metadata.labels.site}}.yaml
          valuesObject:
            operator:
              enabled: false
            grid-operator:
              enabled: true
              image:
                repository: quay.io/sbatsche/grid-operator
                digest: "sha256:cc658a2535dae8d1251a074681d6cb96375d34d5798a6ff3daa64bf4fb375bb9"
              swim:
                siteName: '{{metadata.labels.site}}'
                service: {enabled: true, type: LoadBalancer, externalTrafficPolicy: Local}
              signals: {enabled: true}
              enrollment:
                enabled: true
                url: https://enroll.apps.dagobah.hexfusion.local
      - repoURL: https://github.com/hexfusion/experiments.git
        targetRevision: ai-grid-argo-acm
        ref: values
      destination:
        name: '{{name}}'
        namespace: grid
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
