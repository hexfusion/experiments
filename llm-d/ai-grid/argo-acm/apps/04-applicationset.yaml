apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grid-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # One app per sites/<site>/site.yaml, which names the Argo CD cluster to deploy to.
  generators:
  - git:
      repoURL: https://github.com/hexfusion/experiments.git
      revision: main
      files:
      - path: llm-d/ai-grid/argo-acm/sites/*/site.yaml
  template:
    metadata:
      name: 'grid-{{ .site }}'
    spec:
      project: default
      # Rendered from values/common.yaml and sites/<site>/values.yaml by `make render`.
      source:
        repoURL: https://github.com/hexfusion/experiments.git
        targetRevision: main
        path: 'llm-d/ai-grid/argo-acm/sites/{{ .site }}/manifests'
        directory: {recurse: true}
      destination:
        name: '{{ .cluster }}'
        namespace: grid
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
