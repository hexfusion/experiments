apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grid-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: false
  generators:
  - clusters:
      selector:
        matchLabels:
          cluster.open-cluster-management.io/clusterset: grid
  template:
    metadata:
      name: 'grid-{{metadata.labels.site}}'
    spec:
      project: default
      sources:
      - repoURL: quay.io/sbatsche
        chart: rhai-on-openshift-chart
        targetRevision: 3.6.0-aigrid.dev-3ce1f498
        helm:
          valueFiles:
          - $values/llm-d/ai-grid/argo-acm/sites/{{metadata.labels.site}}.yaml
          valuesObject:
            operator:
              enabled: false
            grid-operator:
              enabled: true
              image:
                repository: quay.io/sbatsche/grid-operator
                digest: "sha256:5eb0e845d7ca1fbb876ff09082fc96fb5c8184c8d35e5d599eac18c1789da963"
              swim:
                siteName: '{{metadata.labels.site}}'
                service: {enabled: true, type: LoadBalancer, externalTrafficPolicy: Local}
              signals: {enabled: true}
              enrollment:
                enabled: true
            praxis-gateway:
              enabled: true
              image:
                repository: quay.io/sbatsche/grid-gateway
                digest: "sha256:e2c9948b90dab1f93d0ef2a6cc5fffaaa66eb6a1e88a262ff0ca99917d48c16e"
                flavor: grid-gateway
              tls:
                enabled: true
                existingSecret: grid-site-identity
                caSecret: grid-ca
              gatewayConfig:
                render: true
                localSite: '{{metadata.labels.site}}'
                model: Qwen3-Coder-30B-A3B
      - repoURL: https://github.com/hexfusion/experiments.git
        targetRevision: main
        ref: values
      destination:
        name: '{{name}}'
        namespace: grid
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
