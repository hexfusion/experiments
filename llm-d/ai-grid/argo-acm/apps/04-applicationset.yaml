apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grid-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  goTemplate: false
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: grid-sites
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'grid-{{name}}'
    spec:
      project: default
      source:
        repoURL: quay.io/sbatsche
        chart: rhai-on-openshift-chart
        targetRevision: 3.6.0-aigrid.dev-a7f8d2ca
        helm:
          valuesObject:
            operator:
              enabled: false
            grid-operator:
              enabled: true
              image:
                repository: quay.io/sbatsche/grid-operator
                digest: "sha256:cc658a2535dae8d1251a074681d6cb96375d34d5798a6ff3daa64bf4fb375bb9"
              swim:
                siteName: '{{name}}'
                seeds: 192.168.1.204:7946
                service: {enabled: true, type: LoadBalancer, externalTrafficPolicy: Local}
              signals: {enabled: true}
              enrollment:
                enabled: true
                url: https://enroll.apps.dagobah.hexfusion.local
      destination:
        name: '{{name}}'
        namespace: grid
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
