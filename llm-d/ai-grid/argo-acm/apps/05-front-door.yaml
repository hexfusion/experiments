# Generated by make render from grid.yaml. Do not edit.
# After the sites (wave 3), so hq's grid gateway Service exists. The finalizer removes the
# MaaS objects when the app is deleted, as on a switch back to grid mode.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-front-door
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/experiments.git
    targetRevision: main
    path: llm-d/ai-grid/argo-acm/front-door
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: models-as-a-service
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# The MaaS gateway verifies hq's grid gateway against the service CA. Istio reads a CA only
# from a Secret in the gateway's namespace, and the service CA ships as a ConfigMap, so this
# Policy keeps a Secret copy of it.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: grid-front-door-ca
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: [local-cluster]}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: grid-front-door-ca
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: grid-front-door-ca
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: grid-front-door-ca
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-front-door-ca
  namespace: grid-enrollment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-front-door-ca
      spec:
        remediationAction: enforce
        severity: medium
        pruneObjectBehavior: DeleteIfCreated
        object-templates:
        - complianceType: mustonlyhave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-gateway-ca
              namespace: openshift-ingress
            data:
              ca.crt: '{{ fromConfigMap "openshift-ingress" "openshift-service-ca.crt" "service-ca.crt" | base64enc }}'
