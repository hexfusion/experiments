# CRDs in their own app: Argo diffs a site app against the live CRDs, so a new CRD field in
# the same app fails the comparison and nothing syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-factory-crds
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/experiments.git
    targetRevision: main
    path: llm-d/ai-grid/argo-acm/sites/factory/crds
    directory: {recurse: true}
  destination:
    name: site-d
  syncPolicy:
    automated: {selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
# The finalizer cascades deletion to the site's resources, as the ApplicationSet it replaces did.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-factory
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hexfusion/experiments.git
    targetRevision: main
    path: llm-d/ai-grid/argo-acm/sites/factory/manifests
    directory: {recurse: true}
  destination:
    name: site-d
    namespace: grid
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Argo does not retry a failed automated sync of the same commit; a site that syncs before
    # its CRDs land would wait for the next commit.
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
