apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-enrollment
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: quay.io/sbatsche
    chart: rhai-on-openshift-chart
    targetRevision: 3.6.0-aigrid.dev-14fb3fea
    helm:
      valuesObject:
        operator:
          enabled: false
        grid-enrollment:
          enabled: true
          host: enroll.apps.dagobah.hexfusion.local
          image:
            repository: quay.io/sbatsche/grid-enrollment
            digest: "ENROLLMENT_DIGEST"   # sha256 of quay.io/sbatsche/grid-enrollment:aigrid-14fb3fea
          # The hub takes its identity from the CA; only sites are invited.
          hubSite:
            name: dagobah
          invites:
            site-d:
              network: grid
  destination:
    server: https://kubernetes.default.svc
    namespace: grid-enrollment
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
