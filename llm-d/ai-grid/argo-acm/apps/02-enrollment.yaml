apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grid-enrollment
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  # Rendered from hub/enrollment/values.yaml by `make render`; never edited by hand.
  source:
    repoURL: https://github.com/hexfusion/experiments.git
    targetRevision: main
    path: llm-d/ai-grid/argo-acm/hub/enrollment/manifests
    directory: {recurse: true}
  destination:
    server: https://kubernetes.default.svc
    namespace: grid-enrollment
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
