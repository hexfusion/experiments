  annotations:
    argocd.argoproj.io/sync-wave: "5"
placementRef: {apiGroup: cluster.open-cluster-management.io, kind: Placement, name: logging-sites}
subjects:
- {apiGroup: policy.open-cluster-management.io, kind: Policy, name: grid-logging-site-collector}
---
# Copies the ingress CA beside the token, where the site Policy's hub template can read it.
# Base64 in a Secret keeps the PEM on one line through both template passes.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-logging-ingress-ca
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-logging-ingress-ca
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: grid-logging-ingress-ca
              namespace: openshift-logging
            data:
              # The router serves the lab CA's certificate; its Secret carries that CA.
              ca.crt: '{{ fromSecret "openshift-ingress" "lab-ingress-cert" "ca.crt" }}'
---
# A Vector DaemonSet on each remote site, shipping the same namespaces with the same labels
# as the hub collector, so the console and LogQL treat every cluster alike. Vector's own
# {{ field }} syntax is written as quoted strings so ACM's managed-cluster pass leaves it.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: grid-logging-site-collector
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policy.open-cluster-management.io/standards: AI Grid
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: grid-logging-site-collector
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: grid-logging
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: vector
              namespace: grid-logging
        - complianceType: musthave
          objectDefinition:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: grid-logging-vector
            rules:
            - {apiGroups: [""], resources: [pods, namespaces, nodes], verbs: [get, list, watch]}
        - complianceType: musthave
          objectDefinition:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: grid-logging-vector
            roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: grid-logging-vector}
            subjects:
            - {kind: ServiceAccount, name: vector, namespace: grid-logging}
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: loki-writer
              namespace: grid-logging
            data:
              # Hub fromSecret output is already encrypted; adding protect encrypts it twice.
              token: '{{hub fromSecret "openshift-logging" "site-log-writer-token" "token" hub}}'
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Secret
            type: Opaque
            metadata:
              name: loki-ca
              namespace: grid-logging
            data:
              ca.crt: '{{hub fromSecret "openshift-logging" "grid-logging-ingress-ca" "ca.crt" hub}}'
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: vector
              namespace: grid-logging
            data:
              vector.yaml: |
                data_dir: /var/lib/vector
                sources:
                  pods:
                    type: kubernetes_logs
                transforms:
                  grid:
                    type: filter
                    inputs: [pods]
                    condition: |
                      ns = string!(.kubernetes.pod_namespace)
                      includes(["grid","grid-enrollment","redhat-ai-gateway-infra","llm-d"], ns) || starts_with(ns, "ai-tenant-")
                  shape:
                    type: remap
                    inputs: [grid]
                    source: |
                      .log_type = "application"
                      .openshift.labels.cluster = "{{hub if eq .ManagedClusterName "site-d" hub}}factory{{hub end hub}}{{hub if eq .ManagedClusterName "site-e" hub}}retail{{hub end hub}}"
                      parsed, err = parse_json(.message)
                      if err == null && is_object(parsed) {
                        .structured = parsed
                        if is_string(parsed.level) { .level = downcase(string!(parsed.level)) }
                      }
                      if !exists(.level) {
                        m, err = parse_regex(.message, r'\b(?P<l>ERROR|WARN|INFO|DEBUG|TRACE)\b')
                        .level = if err == null { downcase(string!(m.l)) } else { "unknown" }
                      }
                sinks:
                  loki:
                    type: loki
                    inputs: [shape]
                    endpoint: https://logging-loki-openshift-logging.apps.dagobah.hexfusion.local/api/logs/v1/application
                    auth:
                      strategy: bearer
                      token: "${LOKI_TOKEN}"
                    tls:
                      ca_file: /etc/loki-ca/ca.crt
                    encoding: {codec: json}
                    out_of_order_action: accept
                    labels:
                      log_type: application
                      kubernetes_namespace_name: "{{ "{{" }} kubernetes.pod_namespace {{ "}}" }}"
                      kubernetes_pod_name: "{{ "{{" }} kubernetes.pod_name {{ "}}" }}"
                      kubernetes_container_name: "{{ "{{" }} kubernetes.container_name {{ "}}" }}"
                      openshift_labels_cluster: "{{hub if eq .ManagedClusterName "site-d" hub}}factory{{hub end hub}}{{hub if eq .ManagedClusterName "site-e" hub}}retail{{hub end hub}}"
                      level: "{{ "{{" }} level {{ "}}" }}"
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: vector
              namespace: grid-logging
            spec:
              selector:
                matchLabels: {app.kubernetes.io/name: grid-logging-vector}
              template:
                metadata:
                  labels: {app.kubernetes.io/name: grid-logging-vector}
                spec:
                  serviceAccountName: vector
                  # The gateway Route's name resolves only on the lab network.
                  hostAliases:
                  - ip: 192.168.1.11
                    hostnames: [logging-loki-openshift-logging.apps.dagobah.hexfusion.local]
                  tolerations:
                  - {operator: Exists}
                  containers:
                  - name: vector
                    image: docker.io/timberio/vector@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
                    args: [--config, /etc/vector/vector.yaml]
                    env:
                    - name: VECTOR_SELF_NODE_NAME
                      valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
                    - name: LOKI_TOKEN
                      valueFrom: {secretKeyRef: {name: loki-writer, key: token}}
                    resources:
                      limits:
                        memory: 256Mi
                      requests:
                        cpu: 20m
                        memory: 64Mi
                    securityContext:
                      # Reads every pod's log files from the host.
                      runAsUser: 0
                      readOnlyRootFilesystem: true
                      allowPrivilegeEscalation: false
                      capabilities: {drop: [ALL], add: [DAC_READ_SEARCH]}
                    volumeMounts:
                    - {name: config, mountPath: /etc/vector, readOnly: true}
                    - {name: ca, mountPath: /etc/loki-ca, readOnly: true}
                    - {name: data, mountPath: /var/lib/vector}
                    - {name: pods, mountPath: /var/log/pods, readOnly: true}
                  volumes:
                  - {name: config, configMap: {name: vector}}
                  - {name: ca, secret: {secretName: loki-ca}}
                  - {name: data, hostPath: {path: /var/lib/grid-logging-vector, type: DirectoryOrCreate}}
                  - {name: pods, hostPath: {path: /var/log/pods}}
