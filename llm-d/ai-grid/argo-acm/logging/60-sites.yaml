roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: logging-collector-logs-writer}
subjects:
- {kind: ServiceAccount, name: site-log-writer, namespace: openshift-logging}
---
# Hub templates read only from the Policy's own namespace, so these Policies live beside the token.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
