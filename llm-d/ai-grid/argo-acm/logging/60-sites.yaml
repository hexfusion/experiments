# Generated by make render from grid.yaml. Do not edit.
# The identity every site collector writes as: create on the application tenant only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: site-log-writer
  namespace: openshift-logging
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
# Kubernetes fills in the token; the Secret carries no data in Git.
apiVersion: v1
