# Loki gets its own MinIO user, limited to its bucket. The Job creates the user's secret once,
# then writes the LokiStack S3 secret from it on every sync. Nothing is printed.
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-credentials
  namespace: grid-observability-minio
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: loki-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: credentials
        image: registry.redhat.io/openshift4/ose-cli-rhel9@sha256:1036718dc066c7939b0e84707c835f2517ef38ccbe436b3b72928d0c0c15e04e
        command: [/bin/bash, -ec]
        args:
        - |
          ns=grid-observability-minio
          if ! oc -n "$ns" get secret minio-loki >/dev/null 2>&1; then
            pass=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
            oc -n "$ns" create secret generic minio-loki \
              --from-literal=user=loki --from-literal="password=$pass" >/dev/null \
              || oc -n "$ns" get secret minio-loki >/dev/null
            echo "created minio-loki"
          fi
          user=$(oc -n "$ns" get secret minio-loki -o jsonpath='{.data.user}' | base64 -d)
          pass=$(oc -n "$ns" get secret minio-loki -o jsonpath='{.data.password}' | base64 -d)
          oc -n openshift-logging create secret generic logging-loki-s3 \
            --from-literal=bucketnames=loki --from-literal=endpoint=http://minio.grid-observability-minio.svc:9000 \
            --from-literal=region=us-east-1 --from-literal=forcepathstyle=true \
            --from-literal="access_key_id=$user" --from-literal="access_key_secret=$pass" \
            --dry-run=client -o yaml | oc apply -f - >/dev/null
          echo "wrote openshift-logging/logging-loki-s3"
        env:
        - {name: HOME, value: /tmp}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
# The bucket, its hard quota, and the Loki user bound to a bucket-only policy. The quota is
# the backstop: a log storm fills the bucket and Loki drops writes, not the host.
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-bucket
  namespace: grid-observability-minio
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: bucket
        image: cgr.dev/chainguard/minio-client@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
        command: [/bin/sh, -ec]
        args:
        - |
          mc mb --ignore-existing local/loki
          mc quota set local/loki --size 8GiB
          mc admin user add local "$LOKI_USER" "$LOKI_PASS"
          mc admin policy create local loki-rw /policy/policy.json
          mc admin policy attach local loki-rw --user "$LOKI_USER" 2>/dev/null \
            || mc admin user info local "$LOKI_USER" | grep -q loki-rw
          echo "bucket loki ready"
        env:
        - name: MINIO_USER
          valueFrom: {secretKeyRef: {name: minio-root, key: user}}
        - name: MINIO_PASS
          valueFrom: {secretKeyRef: {name: minio-root, key: password}}
        - name: LOKI_USER
          valueFrom: {secretKeyRef: {name: minio-loki, key: user}}
        - name: LOKI_PASS
          valueFrom: {secretKeyRef: {name: minio-loki, key: password}}
        - {name: MC_HOST_local, value: "http://$(MINIO_USER):$(MINIO_PASS)@minio.grid-observability-minio.svc:9000"}
        - {name: MC_CONFIG_DIR, value: /tmp/.mc}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
        - {name: policy, mountPath: /policy}
      volumes:
      - name: tmp
        emptyDir: {}
      - name: policy
        configMap: {name: loki-bucket-policy}
