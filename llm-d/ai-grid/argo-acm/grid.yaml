# The whole grid in one file. `make render` turns it into the Argo CD apps, the ACM objects,
# and every site's manifests. Edit this file, never the generated output.

# The product chart and images every site runs.
artifact:
  chart: oci://quay.io/sbatsche/rhai-on-openshift-chart
  version: 3.6.0-aigrid.dev-3b2b1544-6d7abd9c
  images:
    operator:
      repository: quay.io/sbatsche/grid-operator
      digest: sha256:9206c844deb3c64077dbefbe2c269496650e6bf2d905c1bcfc7db7c4fc758c2c
    gateway:
      repository: quay.io/sbatsche/grid-gateway
      digest: sha256:f952c2c3c26ebfab2673830982745c56c7bf9f1addaa3dc3be5e5cec51e71cac
    enrollment:
      repository: quay.io/sbatsche/grid-enrollment
      digest: sha256:70f1b535ee634abf02f3927a38ffbe1d124ff71c0219155901e8ed36e55be5a3

# Where Argo CD reads the rendered output.
repo:
  url: https://github.com/hexfusion/experiments.git
  revision: main
  path: llm-d/ai-grid/argo-acm

grid:
  id: lab
  network: grid
  peerTrust: spiffe
  signals: poll
  # Class of each tenant's grid-internal Gateway, the auth-free path from a site's grid gateway
  # to its InferencePool (providers' internalPath).
  internalGatewayClass: openshift-ai-inference
  swim:
    service: {enabled: true, type: LoadBalancer, externalTrafficPolicy: Local}
  model: Qwen3-Coder-30B-A3B

# Static DNS. Every grid endpoint has a name in this zone, which sre-expert owns, and the
# names are the only way the rest of this file refers to an endpoint. make render derives
# grid.<zone> (front door), enroll.<zone>, gw.<site>.<zone>, and swim.<site>.<zone>, and
# puts the addresses below into loadBalancerIP fields. This is the one table of addresses.
dns:
  zone: acme.lab
  # The hub's OpenShift ingress VIP, where grid.<zone> and enroll.<zone> resolve.
  ingressVIP: 192.168.1.11
  # MetalLB addresses for gw.<site> and swim.<site>, by site. A site not listed takes its
  # address from its own load balancer: factory's k3s servicelb answers on its node address.
  # swim.hq is every site's SWIM seed, so it must not move. hq has no gw.hq: its gateway is
  # the consumer, reached through grid.<zone>, and a LoadBalancer would be advertised to
  # peers that cannot verify it.
  loadBalancers:
    hq: {swim: 192.168.1.204}
    # retail's pool is full, so signals shares the SWIM address: same pod, different port.
    retail: {gateway: 192.168.1.216, swim: 192.168.1.217, signals: 192.168.1.217}
  # Every cluster forwards the zone to the lab DNS server, through ACM Policies: the
  # OpenShift DNS operator on OpenShift sites, a coredns-custom ConfigMap on k3s. Set
  # enabled false to roll back: OpenShift sites return to no forwarders, which is their
  # state before the window, and k3s loses the ConfigMap the Policy created.
  forward:
    enabled: true
    upstream: 192.168.1.1
  # maas.<zone>: the MaaS gateway's LoadBalancer address, the client host in frontDoor maas.
  maasGateway: 192.168.1.201

# Where clients enter, and so who checks their keys and limits them. One switch; make render
# and Argo CD bring every other object in line, and prune the other mode's.
#   grid: clients call grid.<zone>. hq's grid gateway checks each API key against maas-api,
#         then routes.
#   maas: clients call maas.<zone>. The MaaS gateway checks keys, applies token limits, and
#         meters, then forwards to hq's grid gateway as one ExternalModel per model. The grid
#         gateway only routes, behind a NetworkPolicy that admits only the MaaS gateway: the
#         grid gateway cannot yet verify a MaaS service credential, a lab gap.
frontDoor:
  mode: maas
  maas:
    # maas-controller routes every ExternalModel to its own gateway, maas-default-gateway on
    # hq, whose AITenant is models-as-a-service.
    tenant: models-as-a-service
    namespace: models-as-a-service
    gateway: {name: maas-default-gateway, namespace: openshift-ingress, className: maas-gateway-class}
    # hq's grid gateway Service port in maas mode. RHOAI 3.5.1's maas-controller ignores the
    # ExternalModel port annotation and always dials 443.
    gridGatewayPort: 443
    # Who may call the grid's models, and their token budget. Demo-sized: Limitador counts
    # total tokens, so a burst of about ten chat requests in a minute gets 429. Only maas
    # mode limits; the grid gateway has no rate limit in either mode.
    # The owners of the demo's site-a grid-allotment subscription, whose keys the demo uses.
    subjects:
      users: [grid, grid-consumer, "system:serviceaccount:ai-tenant-site-a:grid-consumer", 47d70110-aecf-49fa-9282-9724794be29a]
    # Where the demo key lives on the client host. The path only; the key never enters Git.
    keyFile: ~/.config/grid-acme-maas-key
    tokenRateLimits: [{limit: 2000, window: 1m}]
    # A separate identity for routing benchmarks, so the demo's token limit is not what they
    # measure. Its higher priority makes its keys resolve to this subscription.
    benchmark:
      namespace: grid-load
      serviceAccount: grid-bench
      priority: 30
      tokenRateLimits: [{limit: 50000000, window: 1m}]

# The hub router's default certificate, from the lab CA, so Routes in the apps domain and in
# the zone verify against one CA. Additive: the Policy sets only the default
# IngressController's spec.defaultCertificate. Roll back by removing that field.
ingressCert:
  enabled: true
  issuer: lab-ca-issuer
  secretName: lab-ingress-cert
  dnsNames: ["*.apps.dagobah.hexfusion.local", "*.acme.lab"]

# The hub hosts enrollment and issues its own identity from the Grid CA. It is also a site.
hub:
  cluster: local-cluster
  site: hq
  # The enrollment DB PVC holds every site record. make render marks every rendered PVC
  # Prune=false,Delete=false; set chartAnnotations once the product chart has
  # db.builtin.pvcAnnotations, so the chart sets it instead.
  enrollmentDb:
    chartAnnotations: false
  # Lab: 4-hour site certificates, so each rotates about every 2.7 hours (at a third left).
  # Was 2700 (45 min): rotation is proven, and a 30-minute gateway roll capped every benchmark.
  certLifetimeSecs: 14400

# One entry per site, keyed by its grid site name, with the ManagedCluster it runs on. ACM
# needs no grid labels: the Placements select these clusters by name. The hub's entry runs
# with enrollment off; every other site gets an invite.
sites:
  hq:
    # Shown in sites/README.md.
    description: >-
      The hub. The OpenShift cluster that runs ACM and Argo CD, the grid's enrollment
      service and CA, and the consumer gateway: the front door at grid.acme.lab, or behind
      the MaaS gateway at maas.acme.lab. It also serves Qwen3-Coder-30B-A3B from two llm-d
      pools, hq-east and hq-west, and hosts the lab's logs and dashboards. swim.hq is
      every site's membership seed.
    cluster: local-cluster
    region: lab
    zone: hq
    # APIs the cluster serves, which the charts' capability checks read at render.
    apiVersions: [security.openshift.io/v1, route.openshift.io/v1]
    # Extra grid-operator values for this site.
    operator:
      # Operator-to-operator signal relay; the default 30s is too slow for routing.
      signals: {peerIntervalSeconds: 5}
      # Debug the EPP scrape path until provider signals have a status condition.
      log: {filter: "info,operator=debug"}
      metrics:
        tls:
          enabled: true
      # User workload monitoring scrapes the operator over TLS from the service CA.
      serviceMonitor:
        enabled: true
    providers:
      qwen3-hq-east:
        model: Qwen3-Coder-30B-A3B
        # Through the tenant's EPP, by an internal path that skips MaaS auth: the MaaS front door
        # has already checked the key and the limit.
        endpoint: https://grid-internal-openshift-ai-inference.ai-tenant-site-a.svc.cluster.local:443
        internalPath: {namespace: ai-tenant-site-a, pool: qwen3-inference-pool, port: 8000}
        routingClusterRef: hq-east
        # The operator renders an empty selector as every site; select this site only.
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-hq}}
        # The EPP serves metrics over TLS from the service CA; the operator scrapes with a
        # short-lived token for its metrics-scraper ServiceAccount.
        metricsConfig:
          metricsEndpoint: https://qwen3-epp-service.ai-tenant-site-a.svc:9090
          path: /metrics
          poolName: qwen3-inference-pool
          # The gateway on main ranks on inference_pool_average_queue_size, which the KServe EPP and the llm-d router v0.10 export.
          signalNames:
            queueDepth: inference_pool_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
          tls:
            caConfigMapRef: {name: openshift-service-ca.crt, namespace: grid, key: service-ca.crt}
          auth:
            type: serviceAccountToken
      qwen3-hq-west:
        model: Qwen3-Coder-30B-A3B
        # Through the tenant's EPP, by an internal path that skips MaaS auth: the MaaS front door
        # has already checked the key and the limit.
        endpoint: https://grid-internal-openshift-ai-inference.ai-tenant-site-b.svc.cluster.local:443
        internalPath: {namespace: ai-tenant-site-b, pool: qwen3-inference-pool, port: 8000}
        routingClusterRef: hq-west
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-hq}}
        # The EPP serves metrics over TLS from the service CA; the operator scrapes with a
        # short-lived token for its metrics-scraper ServiceAccount.
        metricsConfig:
          metricsEndpoint: https://qwen3-epp-service.ai-tenant-site-b.svc:9090
          path: /metrics
          poolName: qwen3-inference-pool
          signalNames:
            queueDepth: inference_pool_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
          tls:
            caConfigMapRef: {name: openshift-service-ca.crt, namespace: grid, key: service-ca.crt}
          auth:
            type: serviceAccountToken
    # praxis-gateway values. The hub gateway is the grid front door.
    gateway:
      # Two, so a rotation roll always leaves a ready gateway: at one replica the 18:40:52 roll
      # left zero ready endpoints despite surge-first, preStop, and a 5s readiness period.
      replicaCount: 2
      # Bounded so overload OOM-kills the gateway, not the model servers sharing its node.
      resources:
        requests: {cpu: 250m, memory: 128Mi}
        limits: {memory: 512Mi}
      service:
        type: ClusterIP
        port: 8080
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
      # The front door, grid.<zone>. The router's certificate covers it.
      route:
        enabled: true
        tls:
          termination: reencrypt
      networkPolicy:
        enabled: true
        from:
        - podSelector: {}
        # The default IngressController's routers, host network included.
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      # TLS /metrics for user-workload monitoring, signed by the service CA. This payload's
      # gateway carries the listener again, so the praxis_* and grid_route_* rules return.
      metricsListener:
        enabled: true
        existingSecret: grid-gateway-metrics-tls
        fromNamespaces: [openshift-user-workload-monitoring, openshift-monitoring]
        service:
          annotations:
            service.beta.openshift.io/serving-cert-secret-name: grid-gateway-metrics-tls
        serviceMonitor:
          enabled: true
          # This chart's listener takes no scrapeTimeout, so the scrape inherits
          # Prometheus's global 10s timeout and the interval cannot go under it: at the
          # demo's 5s the ServiceMonitor is rejected and gateway metrics go dark. The
          # operator keeps 5s, whose chart does take a timeout.
          interval: 10s
          caConfigMap: {name: openshift-service-ca.crt, key: service-ca.crt}
      gridServing:
        enabled: true
        network: grid
      gatewayConfig:
        role: consumer
        listenerTls:
          enabled: true
          existingSecret: grid-gateway-listener-tls
        auth:
          mode: api-key
          # maas-api-site-a is the MaaS infra Service's name, kept through the rename on purpose.
          validateUrl: https://maas-api-site-a.redhat-ai-gateway-infra.svc.cluster.local:8443/internal/v1/api-keys/validate
          allowPrivateEndpoint: true
          validateCA: {configMap: openshift-service-ca.crt, key: service-ca.crt}
        backends:
        - cluster: hq-east
          endpoints: [grid-internal-openshift-ai-inference.ai-tenant-site-a.svc.cluster.local.:443]
          transport:
            mode: tls
            ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
          trustPrivate: true
        - cluster: hq-west
          endpoints: [grid-internal-openshift-ai-inference.ai-tenant-site-b.svc.cluster.local.:443]
          transport:
            mode: tls
            ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
          trustPrivate: true

  factory:
    # Shown in sites/README.md.
    description: >-
      A provider site on k3s. It serves Qwen3-Coder-30B-A3B from one llm-d pool on two
      T4 GPUs. hq reaches its gateway at gw.factory.acme.lab
      over grid mTLS.
    cluster: site-d
    # Extra grid-operator values for this site.
    operator:
      # Operator-to-operator signal relay; the default 30s is too slow for routing.
      signals:
        peerIntervalSeconds: 5
        # k3s ServiceLB publishes a Local-policy address only once an endpoint is ready, and the
        # operator is not ready until the address exists. Cluster policy breaks the cycle.
        service: {externalTrafficPolicy: Cluster}
    region: lab
    zone: factory
    apiVersions: []
    providers:
      qwen3:
        model: Qwen3-Coder-30B-A3B
        endpoint: http://optimized-baseline-epp.llm-d.svc.cluster.local:80
        routingClusterRef: factory
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-factory}}
        # factory's EPP serves metrics as plain HTTP with auth off, so no credential is sent.
        metricsConfig:
          metricsEndpoint: http://optimized-baseline-epp.llm-d.svc:9090
          path: /metrics
          poolName: optimized-baseline
          signalNames:
            queueDepth: inference_pool_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
    gateway:
      service:
        type: LoadBalancer
        port: 8080
      # The hub's SPIFFE ID comes from hub.site.
      gatewayConfig:
        role: provider
        peerTrust:
          mode: spiffe
        backends:
        - cluster: local
          endpoints: [optimized-baseline-epp.llm-d.svc.cluster.local.:80]
          transport: {mode: plaintext}
          allowPlaintextTrust: true
          trustPrivate: true

  retail:
    # Shown in sites/README.md.
    description: >-
      A provider site on single-node OpenShift. It serves qwen2.5-7b-instruct, which no
      other site serves, so requests for that model always cross the grid. hq reaches its
      gateway at gw.retail.acme.lab over grid mTLS.
    cluster: site-e
    region: lab
    zone: retail
    apiVersions: [security.openshift.io/v1, route.openshift.io/v1]
    operator:
      # MetalLB lets two Services hold one address when both carry the same sharing key.
      swim: {service: {annotations: {metallb.io/allow-shared-ip: grid-operator}}}
      # Operator-to-operator signal relay; the default 30s is too slow for routing.
      signals:
        peerIntervalSeconds: 5
        service: {annotations: {metallb.io/allow-shared-ip: grid-operator}}
      metrics:
        tls:
          enabled: true
      serviceMonitor:
        enabled: true
    providers:
      qwen-retail:
        model: qwen2.5-7b-instruct
        # Through the tenant's EPP, by an internal path that skips MaaS auth: the MaaS front door
        # has already checked the key and the limit.
        endpoint: https://grid-internal-openshift-ai-inference.ai-tenant-retail.svc.cluster.local:443
        internalPath: {namespace: ai-tenant-retail, pool: qwen-retail-inference-pool, port: 8000}
        routingClusterRef: retail
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-retail}}
        metricsConfig:
          metricsEndpoint: https://qwen-retail-epp-service.ai-tenant-retail.svc:9090
          path: /metrics
          poolName: qwen-retail-inference-pool
          signalNames:
            queueDepth: inference_pool_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
          tls:
            caConfigMapRef: {name: openshift-service-ca.crt, namespace: grid, key: service-ca.crt}
          auth:
            type: serviceAccountToken
    # gw.retail.<zone>, which hq's front door reaches over grid mTLS.
    gateway:
      service:
        type: LoadBalancer
        port: 8080
      gatewayConfig:
        role: provider
        peerTrust:
          mode: spiffe
        backends:
        - cluster: local
          endpoints: [grid-internal-openshift-ai-inference.ai-tenant-retail.svc.cluster.local.:443]
          transport:
            mode: tls
            ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
          trustPrivate: true

# Optional ACM observability on the hub: Thanos and Grafana from MultiClusterObservability,
# an in-cluster MinIO as the object store. Sized for a lab host with little free disk.
observability:
  enabled: true
  storageClass: lvms-vg1
  instanceSize: minimal
  # Seconds between collections from each cluster; 60 keeps rate() over [5m] usable.
  interval: 60
  retention:
    local: 6h
    raw: 3d
  storage:
    receive: 5Gi
    compact: 5Gi
    store: 2Gi
    rule: 1Gi
    alertmanager: 1Gi
  minio:
    namespace: grid-observability-minio
    size: 20Gi
    bucket: thanos
    # Upstream MinIO no longer publishes images; Chainguard rebuilds them from source.
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    clientImage: cgr.dev/chainguard/minio-client@sha256:b20bdc339b3f2596c8f731793f861d2445fd13a9a3cfb517ff020969f4e4bf71
  # Runs the credential Job (oc and bash).
  cliImage: registry.redhat.io/openshift4/ose-cli-rhel9@sha256:1036718dc066c7939b0e84707c835f2517ef38ccbe436b3b72928d0c0c15e04e
  # The AI Grid performance dashboard in ACM's Grafana, from chart/files.
  dashboards: true
  # Merged into ACM's default allowlist. platform: the cluster Prometheus; userWorkload: UWM.
  allowlist:
    platform:
      matches:
      - __name__=~"DCGM_FI_DEV_(GPU_UTIL|FB_USED)"
    userWorkload:
      matches:
      - __name__=~"grid_.+"
      - __name__=~"praxis_.+"
      - __name__=~"vllm:(num_requests_.+|kv_cache_usage_perc|prefix_cache_.+|prompt_tokens_total|generation_tokens_total|num_preemptions_total|request_success_total|cache_config_info)"
      - __name__=~"vllm:(time_to_first_token|e2e_request_latency|request_queue_time|inter_token_latency|request_prefill_time|request_decode_time)_seconds_(bucket|sum|count)"
      - __name__=~"vllm:request_(prompt|generation)_tokens_(sum|count)"
      - __name__=~"llm_d_epp_.+|llm_d_inference_scheduler_.+|inference_pool_.+|inference_extension_.+"
      # MaaS auth-callout counters, scoped to the auth cluster so cardinality stays small.
      - __name__=~"envoy_cluster_upstream_rq_(timeout|total)",cluster_name=~".*auth.*"
      - __name__="up",namespace=~"grid|ai-tenant-.+|llm-d"

# The demo Grafana on hq, served at observe.<zone>: grafana-operator reading hq's Thanos
# Querier and LokiStack, with dashboards and recording rules from chart/files/demo. ACM's
# Grafana stays as it is. hq's gateway and operator are scraped every scrapeInterval, so a
# rateWindow of six scrapes shows a lost site within seconds.
demoGrafana:
  enabled: true
  namespace: grid-demo-grafana
  channel: v5
  scrapeInterval: 5s
  rateWindow: 30s

# Optional central logs on the hub: a LokiStack on the observability MinIO, OpenShift Logging
# for the grid's application namespaces, and a Vector DaemonSet on every other site.
logging:
  enabled: true
  channel: stable-6.6
  size: 1x.demo
  # Off the GPU nodes: 1x.demo has no requests, so the scheduler cannot account for it.
  nodeSelector:
    kubernetes.io/hostname: worker1.dagobah.hexfusion.local
  retentionDays: 3
  # Per tenant, in MB. A load-run storm is rejected at 1 MB/s instead of filling the host.
  ingestion:
    rateMB: 1
    burstMB: 2
    perStreamMB: 1
    perStreamBurstMB: 2
  bucket: loki
  # Hard MinIO quota on the logs bucket, the backstop behind the rate limit.
  bucketQuota: 8GiB
  clientShellImage: cgr.dev/chainguard/minio-client@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
  namespaces: [grid, grid-enrollment, ai-tenant-*, redhat-ai-gateway-infra, llm-d]
  labelKeys:
  - log_type
  - kubernetes.namespace_name
  - kubernetes.pod_name
  - kubernetes.container_name
  - openshift.labels.cluster
  - level
  # endor's collector spikes past 1Gi catching up on a backlog after an outage; steady is ~350Mi.
  collector:
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {memory: 2Gi}
    # Endor peaks while catching up on a log backlog and steadies near 350Mi. AtLeastOnce
    # buffers on disk, so a catch-up spills there instead of into memory.
    tuning: {deliveryMode: AtLeastOnce, compression: snappy}
  # The LokiStack gateway Route, which sites reach through dns.ingressVIP.
  gateway:
    host: logging-loki-openshift-logging.apps.dagobah.hexfusion.local
  siteCollector:
    # Files idle longer than this are not read; a restart skips the node's old backlog.
    ignoreOlderSecs: 3600
    # Disk buffer on the node under the collector's hostPath data_dir. Vector's minimum.
    bufferBytes: 268435488
    # The Loki sink's compression. gzip sends JSON; snappy (Vector's default) sends protobuf.
    compression: gzip
    # Offer only HTTP/1.1 to the LokiStack gateway Route.
    http1: true
    image: docker.io/timberio/vector@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
    # factory's collector idles near 112Mi and spiked past 256Mi.
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 512Mi}
