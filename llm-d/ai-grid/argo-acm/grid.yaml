# The whole grid in one file. `make render` turns it into the Argo CD apps, the ACM objects,
# and every site's manifests. Edit this file, never the generated output.

# The product chart and images every site runs.
artifact:
  chart: oci://quay.io/sbatsche/rhai-on-openshift-chart
  version: 3.6.0-aigrid.dev-f5a91f90
  images:
    operator:
      repository: quay.io/sbatsche/grid-operator
      digest: sha256:77cb71c30225aabf3c4893ab513fc0b230c18d2d16b9e3dad26338e190d537c2
    gateway:
      repository: quay.io/sbatsche/grid-gateway
      digest: sha256:bb4e1185c13f19e0800a5eb55d45eb52b5913084cb2b39047cb2f755a38d8bb8
    enrollment:
      repository: quay.io/sbatsche/grid-enrollment
      digest: sha256:c1093d4532d7943e8d842c125096b08b89b4c2313278033de3f8fb2d19d5fcc7

# Where Argo CD reads the rendered output.
repo:
  url: https://github.com/hexfusion/experiments.git
  revision: main
  path: llm-d/ai-grid/argo-acm

grid:
  id: lab
  network: grid
  peerTrust: spiffe
  signals: poll
  swim:
    service: {enabled: true, type: LoadBalancer, externalTrafficPolicy: Local}
  model: Qwen3-Coder-30B-A3B

# Static DNS. Every grid endpoint has a name in this zone, which sre-expert owns, and the
# names are the only way the rest of this file refers to an endpoint. make render derives
# grid.<zone> (front door), enroll.<zone>, gw.<site>.<zone>, and swim.<site>.<zone>, and
# puts the addresses below into loadBalancerIP fields. This is the one table of addresses.
dns:
  zone: acme.lab
  # The hub's OpenShift ingress VIP, where grid.<zone> and enroll.<zone> resolve.
  ingressVIP: 192.168.1.11
  # MetalLB addresses for gw.<site> and swim.<site>, by site. A site not listed takes its
  # address from its own load balancer: factory's k3s servicelb answers on its node address.
  # swim.hq is every site's SWIM seed, so it must not move. hq has no gw.hq: its gateway is
  # the consumer, reached through grid.<zone>, and a LoadBalancer would be advertised to
  # peers that cannot verify it.
  loadBalancers:
    hq: {swim: 192.168.1.204}
    retail: {gateway: 192.168.1.216, swim: 192.168.1.217}
  # Every cluster forwards the zone to the lab DNS server, through ACM Policies: the
  # OpenShift DNS operator on OpenShift sites, a coredns-custom ConfigMap on k3s. Set
  # enabled false to roll back: OpenShift sites return to no forwarders, which is their
  # state before the window, and k3s loses the ConfigMap the Policy created.
  forward:
    enabled: true
    upstream: 192.168.1.1
  # maas.<zone>: the MaaS gateway's LoadBalancer address, the client host in frontDoor maas.
  maasGateway: 192.168.1.201

# Where clients enter, and so who checks their keys and limits them. One switch; make render
# and Argo CD bring every other object in line, and prune the other mode's.
#   grid: clients call grid.<zone>. hq's grid gateway checks each API key against maas-api,
#         then routes.
#   maas: clients call maas.<zone>. The MaaS gateway checks keys, applies token limits, and
#         meters, then forwards to hq's grid gateway as one ExternalModel per model. The grid
#         gateway only routes, behind a NetworkPolicy that admits only the MaaS gateway: the
#         grid gateway cannot yet verify a MaaS service credential, a lab gap.
frontDoor:
  mode: maas
  maas:
    # maas-controller routes every ExternalModel to its own gateway, maas-default-gateway on
    # hq, whose AITenant is models-as-a-service.
    tenant: models-as-a-service
    namespace: models-as-a-service
    gateway: {name: maas-default-gateway, namespace: openshift-ingress, className: maas-gateway-class}
    # hq's grid gateway Service port in maas mode. RHOAI 3.5.1's maas-controller ignores the
    # ExternalModel port annotation and always dials 443.
    gridGatewayPort: 443
    # Who may call the grid's models, and their token budget. Demo-sized: Limitador counts
    # total tokens, so a burst of about ten chat requests in a minute gets 429. Only maas
    # mode limits; the grid gateway has no rate limit in either mode.
    # The owners of the demo's site-a grid-allotment subscription, whose keys the demo uses.
    subjects:
      users: [grid, grid-consumer, "system:serviceaccount:ai-tenant-site-a:grid-consumer", 47d70110-aecf-49fa-9282-9724794be29a]
    # Where the demo key lives on the client host. The path only; the key never enters Git.
    keyFile: ~/.config/grid-acme-maas-key
    tokenRateLimits: [{limit: 2000, window: 1m}]
    # A separate identity for routing benchmarks, so the demo's token limit is not what they
    # measure. Its higher priority makes its keys resolve to this subscription.
    benchmark:
      namespace: grid-load
      serviceAccount: grid-bench
      priority: 30
      tokenRateLimits: [{limit: 50000000, window: 1m}]

# The hub router's default certificate, from the lab CA, so Routes in the apps domain and in
# the zone verify against one CA. Additive: the Policy sets only the default
# IngressController's spec.defaultCertificate. Roll back by removing that field.
ingressCert:
  enabled: true
  issuer: lab-ca-issuer
  secretName: lab-ingress-cert
  dnsNames: ["*.apps.dagobah.hexfusion.local", "*.acme.lab"]

# The hub hosts enrollment and issues its own identity from the Grid CA. It is also a site.
hub:
  cluster: local-cluster
  site: hq
  # The enrollment DB PVC holds every site record. make render marks every rendered PVC
  # Prune=false,Delete=false; set chartAnnotations once the product chart has
  # db.builtin.pvcAnnotations, so the chart sets it instead.
  enrollmentDb:
    chartAnnotations: false
  # Lab: 45-minute site certificates, so each rotates every 30 minutes (at a third left).
  certLifetimeSecs: 2700

# One entry per site, keyed by its grid site name, with the ManagedCluster it runs on. ACM
# needs no grid labels: the Placements select these clusters by name. The hub's entry runs
# with enrollment off; every other site gets an invite.
sites:
  hq:
    cluster: local-cluster
    region: lab
    zone: hq
    # APIs the cluster serves, which the charts' capability checks read at render.
    apiVersions: [security.openshift.io/v1, route.openshift.io/v1]
    # Extra grid-operator values for this site.
    operator:
      metrics:
        tls:
          enabled: true
      # User workload monitoring scrapes the operator over TLS from the service CA.
      serviceMonitor:
        enabled: true
    providers:
      qwen3-hq-east:
        model: Qwen3-Coder-30B-A3B
        endpoint: http://qwen3-kserve-workload-svc.ai-tenant-site-a.svc.cluster.local:8000
        routingClusterRef: hq-east
        # The operator renders an empty selector as every site; select this site only.
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-hq}}
        # The EPP serves metrics over TLS from the service CA; the operator scrapes with a
        # short-lived token for its metrics-scraper ServiceAccount.
        metricsConfig:
          metricsEndpoint: https://qwen3-epp-service.ai-tenant-site-a.svc:9090
          path: /metrics
          poolName: qwen3-inference-pool
          signalNames:
            queueDepth: llm_d_epp_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
          tls:
            caConfigMapRef: {name: openshift-service-ca.crt, namespace: grid, key: service-ca.crt}
          auth:
            type: serviceAccountToken
      qwen3-hq-west:
        model: Qwen3-Coder-30B-A3B
        endpoint: http://qwen3-kserve-workload-svc.ai-tenant-site-b.svc.cluster.local:8000
        routingClusterRef: hq-west
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-hq}}
        # The EPP serves metrics over TLS from the service CA; the operator scrapes with a
        # short-lived token for its metrics-scraper ServiceAccount.
        metricsConfig:
          metricsEndpoint: https://qwen3-epp-service.ai-tenant-site-b.svc:9090
          path: /metrics
          poolName: qwen3-inference-pool
          signalNames:
            queueDepth: llm_d_epp_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
          tls:
            caConfigMapRef: {name: openshift-service-ca.crt, namespace: grid, key: service-ca.crt}
          auth:
            type: serviceAccountToken
    # praxis-gateway values. The hub gateway is the grid front door.
    gateway:
      # Bounded so overload OOM-kills the gateway, not the model servers sharing its node.
      resources:
        requests: {cpu: 250m, memory: 128Mi}
        limits: {memory: 512Mi}
      service:
        type: ClusterIP
        port: 8080
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: grid-gateway-listener-tls
      # The front door, grid.<zone>. The router's certificate covers it.
      route:
        enabled: true
        tls:
          termination: reencrypt
          # hq's service CA, which signs the gateway's listener certificate: a public
          # certificate, not a secret. It expires 2027-12-10; update it when the service CA
          # rotates, or the Route answers 503.
          destinationCACertificate: |
            -----BEGIN CERTIFICATE-----
            MIIDUTCCAjmgAwIBAgIIHQzSfUKDhK8wDQYJKoZIhvcNAQELBQAwNjE0MDIGA1UE
            Awwrb3BlbnNoaWZ0LXNlcnZpY2Utc2VydmluZy1zaWduZXJAMTc2MDE0NDkyODAe
            Fw0yNTEwMTEwMTA4NDdaFw0yNzEyMTAwMTA4NDhaMDYxNDAyBgNVBAMMK29wZW5z
            aGlmdC1zZXJ2aWNlLXNlcnZpbmctc2lnbmVyQDE3NjAxNDQ5MjgwggEiMA0GCSqG
            SIb3DQEBAQUAA4IBDwAwggEKAoIBAQCjFsSHyWewBkrLbLPimNDUoXF0j3gd0ryo
            CXTAJ4Wv3QpSWADhacICRNCcy0wRO8BgvpiqOG7zKGOB8OsaVWe1Qu7D/s20U5fN
            ItQ65aea8/45h3wgfwGTCZGk/Z/ngVa2Xoc5zrpEo6VStc6iq7svjvUd6jCN200w
            rOxr3tU1cCCnel4W+T9lTuXvzVipBeZHhSwi8/6YEFTrLAi4UiaLOlz+tcny/hmy
            gfoIqAsdyGxh6PVXRqm7FLaz6/AkqnwxeV+lQQd7IsMVhXmpe8v37n3M+XTZKV7g
            0u8vkcQrGlIu7gsNnwlE5Cv0b2E42ZcdRsrwWnPFbKgRMamMomHjAgMBAAGjYzBh
            MA4GA1UdDwEB/wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBQcXTIw
            0s9d8fJDGa9HWcmHECVVcjAfBgNVHSMEGDAWgBQcXTIw0s9d8fJDGa9HWcmHECVV
            cjANBgkqhkiG9w0BAQsFAAOCAQEAEYKwTQaIAXlf/oD+22ViouPMVSaJwmbyPi2h
            UMaewBiqeRtatV4zvAthInPbCHpmgX+InzW1QoCfEwN7GPaJvk4FxwzDRCiiQf3o
