  factory:
    cluster: site-d
    region: lab
    zone: factory
    apiVersions: []
    providers:
      qwen3:
        model: Qwen3-Coder-30B-A3B
        endpoint: http://optimized-baseline-epp.llm-d.svc.cluster.local:80
        routingClusterRef: factory
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-factory}}
        # factory's EPP serves metrics as plain HTTP with auth off, so no credential is sent.
        metricsConfig:
          metricsEndpoint: http://optimized-baseline-epp.llm-d.svc:9090
          path: /metrics
          poolName: optimized-baseline
          signalNames:
            queueDepth: llm_d_epp_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
    gateway:
      service:
        type: LoadBalancer
        port: 8080
      # The hub's SPIFFE ID comes from hub.site.
      gatewayConfig:
        role: provider
        peerTrust:
          mode: spiffe
        backends:
        - cluster: local
          endpoints: [optimized-baseline-epp.llm-d.svc.cluster.local.:80]
          transport: {mode: plaintext}
          allowPlaintextTrust: true
          trustPrivate: true

  retail:
    cluster: site-e
    region: lab
    zone: retail
    apiVersions: [security.openshift.io/v1, route.openshift.io/v1]
    operator:
      metrics:
        tls:
          enabled: true
      serviceMonitor:
        enabled: true
    providers:
      qwen-retail:
        model: qwen2.5-7b-instruct
        endpoint: http://qwen-retail-kserve-workload-svc.ai-tenant-retail.svc.cluster.local:8000
        routingClusterRef: retail
        siteSelector: {matchLabels: {app.kubernetes.io/instance: grid-retail}}
        metricsConfig:
          metricsEndpoint: https://qwen-retail-epp-service.ai-tenant-retail.svc:9090
          path: /metrics
          poolName: qwen-retail-inference-pool
          signalNames:
            queueDepth: llm_d_epp_average_queue_size
            kvCacheUtilization: llm_d_epp_average_kv_cache_utilization
          tls:
            caConfigMapRef: {name: openshift-service-ca.crt, namespace: grid, key: service-ca.crt}
          auth:
            type: serviceAccountToken
    # gw.retail.<zone>, which hq's front door reaches over grid mTLS.
    gateway:
      service:
        type: LoadBalancer
        port: 8080
      gatewayConfig:
        role: provider
        peerTrust:
          mode: spiffe
        backends:
        - cluster: local
          endpoints: [qwen-retail-kserve-workload-svc.ai-tenant-retail.svc.cluster.local.:8000]
          transport:
            mode: tls
            ca: {configMap: openshift-service-ca.crt, key: service-ca.crt}
          trustPrivate: true

# Optional ACM observability on the hub: Thanos and Grafana from MultiClusterObservability,
# an in-cluster MinIO as the object store. Sized for a lab host with little free disk.
observability:
  enabled: true
  storageClass: lvms-vg1
  instanceSize: minimal
  # Seconds between collections from each cluster; 60 keeps rate() over [5m] usable.
  interval: 60
  retention:
    local: 6h
    raw: 3d
  storage:
    receive: 5Gi
    compact: 5Gi
    store: 2Gi
    rule: 1Gi
    alertmanager: 1Gi
  minio:
    namespace: grid-observability-minio
    size: 20Gi
    bucket: thanos
    # Upstream MinIO no longer publishes images; Chainguard rebuilds them from source.
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    clientImage: cgr.dev/chainguard/minio-client@sha256:b20bdc339b3f2596c8f731793f861d2445fd13a9a3cfb517ff020969f4e4bf71
  # Runs the credential Job (oc and bash).
  cliImage: registry.redhat.io/openshift4/ose-cli-rhel9@sha256:1036718dc066c7939b0e84707c835f2517ef38ccbe436b3b72928d0c0c15e04e
  # The AI Grid performance dashboard in ACM's Grafana, from chart/files.
  dashboards: true
  # Merged into ACM's default allowlist. platform: the cluster Prometheus; userWorkload: UWM.
  allowlist:
    platform:
      matches:
      - __name__=~"DCGM_FI_DEV_(GPU_UTIL|FB_USED)"
    userWorkload:
      matches:
      - __name__=~"grid_.+"
      - __name__=~"praxis_.+"
      - __name__=~"vllm:(num_requests_.+|kv_cache_usage_perc|prefix_cache_.+|prompt_tokens_total|generation_tokens_total|num_preemptions_total|request_success_total|cache_config_info)"
      - __name__=~"vllm:(time_to_first_token|e2e_request_latency|request_queue_time|inter_token_latency|request_prefill_time|request_decode_time)_seconds_(bucket|sum|count)"
      - __name__=~"vllm:request_(prompt|generation)_tokens_(sum|count)"
      - __name__=~"llm_d_epp_.+|llm_d_inference_scheduler_.+|inference_pool_.+|inference_extension_.+"
      - __name__="up",namespace=~"grid|ai-tenant-.+|llm-d"

# The demo Grafana on hq, served at observe.<zone>: grafana-operator reading hq's Thanos
# Querier and LokiStack, with dashboards and recording rules from chart/files/demo. ACM's
# Grafana stays as it is. hq's gateway and operator are scraped every scrapeInterval, so a
# rateWindow of six scrapes shows a lost site within seconds.
demoGrafana:
  enabled: true
  namespace: grid-demo-grafana
  channel: v5
  scrapeInterval: 5s
  rateWindow: 30s

# Optional central logs on the hub: a LokiStack on the observability MinIO, OpenShift Logging
# for the grid's application namespaces, and a Vector DaemonSet on every other site.
logging:
  enabled: true
  channel: stable-6.6
  size: 1x.demo
  # Off the GPU nodes: 1x.demo has no requests, so the scheduler cannot account for it.
  nodeSelector:
    kubernetes.io/hostname: worker1.dagobah.hexfusion.local
  retentionDays: 3
  # Per tenant, in MB. A load-run storm is rejected at 1 MB/s instead of filling the host.
  ingestion:
    rateMB: 1
    burstMB: 2
    perStreamMB: 1
    perStreamBurstMB: 2
  bucket: loki
  # Hard MinIO quota on the logs bucket, the backstop behind the rate limit.
  bucketQuota: 8GiB
  clientShellImage: cgr.dev/chainguard/minio-client@sha256:b056b795d31828015aea061e3168267b0ba80590ba2d8f869e72ff77153a68e8
  namespaces: [grid, grid-enrollment, ai-tenant-*, redhat-ai-gateway-infra, llm-d]
  labelKeys:
  - log_type
  - kubernetes.namespace_name
  - kubernetes.pod_name
  - kubernetes.container_name
  - openshift.labels.cluster
  - level
  # endor's collector spikes past 1Gi catching up on a backlog after an outage; steady is ~350Mi.
  collector:
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {memory: 2Gi}
    # Endor peaks while catching up on a log backlog and steadies near 350Mi. AtLeastOnce
    # buffers on disk, so a catch-up spills there instead of into memory.
    tuning: {deliveryMode: AtLeastOnce, compression: snappy}
  # The LokiStack gateway Route, which sites reach through dns.ingressVIP.
  gateway:
    host: logging-loki-openshift-logging.apps.dagobah.hexfusion.local
  siteCollector:
    # Files idle longer than this are not read; a restart skips the node's old backlog.
    ignoreOlderSecs: 3600
    # Disk buffer on the node under the collector's hostPath data_dir. Vector's minimum.
    bufferBytes: 268435488
    image: docker.io/timberio/vector@sha256:6c93dfe2554cc7e38316d618961cd657d5271c7a7aa727e0007502b28cb82c2e
    # factory's collector idles near 112Mi and spiked past 256Mi.
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 512Mi}
