# The 3 service levels as InferenceObjectives on site-a's pool.
# Derived from plans.yaml (gold=100, silver=0, bronze=-100).
# A request selects one with header:  x-gateway-inference-objective: <name>
# Tenant/fairness with:               x-gateway-inference-fairness-id: <tenant>
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: gold
  namespace: ai-tenant-site-a
  labels: { grid.plan: gold }
spec:
  poolRef: { group: inference.networking.k8s.io, kind: InferencePool, name: qwen3-inference-pool }
  priority: 100          # highest, not sheddable, served first
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: silver
  namespace: ai-tenant-site-a
  labels: { grid.plan: silver }
spec:
  poolRef: { group: inference.networking.k8s.io, kind: InferencePool, name: qwen3-inference-pool }
  priority: 0            # default band, not sheddable, after gold
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: bronze
  namespace: ai-tenant-site-a
  labels: { grid.plan: bronze }
spec:
  poolRef: { group: inference.networking.k8s.io, kind: InferencePool, name: qwen3-inference-pool }
  priority: -100         # negative = sheddable, shed first
