# OSSM/istiod backendRef twin (v1alpha2). EPP watches the k8s.io/v1 pool from helm;
# the gateway route backends this x-k8s.io one. Both name=epp, selector app=sim.
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferencePool
metadata:
  name: epp
  namespace: extproc-bench
spec:
  targetPortNumber: 8000
  selector:
    app: sim
  extensionRef:
    group: ""
    kind: Service
    name: epp-epp
    portNumber: 9002
    failureMode: FailOpen
