# Backend pool. Sim has no real KV bound — isolates the proxy/ext_proc ceiling.
# Scale replicas up for max-concurrency runs so the backend is never the limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  namespace: extproc-bench
spec:
  replicas: 3
  selector:
    matchLabels: { app: sim }
  template:
    metadata:
      labels:
        app: sim
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.7.1   # pin to cluster version
        args: ["--model", "qwen-7b-awq", "--port", "8000"]
        ports: [{ containerPort: 8000, name: http }]
        resources:
          requests: { cpu: 50m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sim
  namespace: extproc-bench
spec:
  selector: { app: sim }
  ports: [{ port: 8000, targetPort: 8000 }]
