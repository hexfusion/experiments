# Attaches the InferencePool (helm release "epp") to the gateway → istiod wires ext_proc.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  namespace: extproc-bench
spec:
  parentRefs:
  - { name: inference-gateway }
  rules:
  - backendRefs:
    # OSSM/istiod resolves InferencePool only under the x-k8s.io group (not k8s.io).
    - { group: inference.networking.x-k8s.io, kind: InferencePool, name: epp, port: 8000 }
    matches:
    - path: { type: PathPrefix, value: / }
    timeouts: { request: 300s }
