apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg-inference
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: extproc-bench
spec:
  gatewayClassName: eg-inference
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - { kind: Secret, name: inference-gateway-tls }   # provision via cert-manager
