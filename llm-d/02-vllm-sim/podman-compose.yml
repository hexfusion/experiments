# 02-vllm-sim: same envoy + bbr-mock as 01-basic, but vllm-mock is replaced
# with the upstream llm-d-inference-sim, and epp-mock now imports
# github.com/llm-d/llm-d-kv-cache to do real prefix-cache-aware routing.
#
# Bring up:
#   podman compose up --build -d
# Smoke test:
#   ./test.sh
# Teardown:
#   podman compose down

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose: ["4317"]
    ports:
      - "16686:16686"
      - "4317:4317"

  envoy:
    image: envoyproxy/envoy:distroless-v1.35-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro,Z
    ports:
      - "8080:8080"
      - "9901:9901"
    depends_on:
      bbr-mock:
        condition: service_started
      epp-mock:
        condition: service_started
      vllm-sim-1:
        condition: service_started
      vllm-sim-2:
        condition: service_started
      vllm-sim-3:
        condition: service_started
      jaeger:
        condition: service_started

  bbr-mock:
    build:
      context: ..
      dockerfile: 02-vllm-sim/bbr-mock/Containerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
    expose: ["9001"]
    command: ["--listen=:9001"]
    depends_on:
      - jaeger

  # epp-mock runs an in-process llm-d-kv-cache Indexer with one ZMQ SUB
  # bound on :5557. Sim PUBs DIAL it; pod identity comes from the message
  # topic (kv@<POD_IP>@<model>). Strategy "prefix-aware" calls
  # indexer.ScoreTokens → picks the pod with the most cached prefix blocks;
  # falls back to round-robin on tie/miss.
  epp-mock:
    build:
      context: ..
      dockerfile: 02-vllm-sim/epp-mock/Containerfile
    environment:
      POD_ENDPOINTS: "vllm-sim-1:8000,vllm-sim-2:8000,vllm-sim-3:8000"
      ZMQ_BIND: "tcp://0.0.0.0:5557"
      ZMQ_TOPIC: "kv@"
      STRATEGY: "prefix-aware"
      BLOCK_SIZE: "16"
      PYTHONHASHSEED: "42"
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
    expose: ["9002", "5557"]
    command: ["--listen=:9002"]
    depends_on:
      - jaeger

  # llm-d-inference-sim: real upstream component. Dummy model name
  # ("qwen-7b-awq") falls into SimpleTokenizer (regex-based), so no
  # UDS tokenizer service required. --enable-kvcache + --zmq-endpoint
  # makes the sim DIAL EPP's bound SUB.
  #
  # POD_IP becomes the pod identifier in the published topic. We use the
  # service hostname so it matches our POD_ENDPOINTS lookup.
  # block-size=16 + hash-seed=42 MUST match the EPP-side TokenProcessor
  # or block hashes won't align.
  vllm-sim-1:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
    environment:
      POD_NAME: "vllm-sim-1"
      POD_IP: "vllm-sim-1"
    command: &sim_cmd
      - "--port=8000"
      - "--model=qwen-7b-awq"
      - "--mode=random"
      - "--max-num-seqs=4"
      - "--time-to-first-token=50ms"
      - "--inter-token-latency=10ms"
      - "--enable-kvcache"
      - "--kv-cache-size=1024"
      - "--block-size=16"
      - "--zmq-endpoint=tcp://epp-mock:5557"
      - "--hash-seed=42"
    expose: ["8000"]
    depends_on:
      - epp-mock

  vllm-sim-2:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
    environment:
      POD_NAME: "vllm-sim-2"
      POD_IP: "vllm-sim-2"
    command: *sim_cmd
    expose: ["8000"]
    depends_on:
      - epp-mock

  vllm-sim-3:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
    environment:
      POD_NAME: "vllm-sim-3"
      POD_IP: "vllm-sim-3"
    command: *sim_cmd
    expose: ["8000"]
    depends_on:
      - epp-mock
