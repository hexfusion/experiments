# Envoy 1.35 static config — wires bbr-mock + epp-mock + vllm-mock pool.
#
# Request flow:
#   1. Client POST /v1/completions on :8080
#   2. HCM matches route (prefix /v1/) → cluster: original_dst
#   3. Filter chain runs in order:
#       a. ext_proc → bbr-mock (BUFFERED body): reads JSON, sets x-model-name
#       b. ext_proc → epp-mock (HEADERS only): reads x-model-name + x-tenant-id,
#          sets x-gateway-destination-endpoint header with picked vllm-mock pod
#       c. router: dispatches via original_dst cluster
#   4. original_dst cluster reads x-gateway-destination-endpoint from the
#      request header and routes the request to that host:port directly.
#   5. vllm-mock-N receives the request, returns synthetic JSON.
#
# Admin UI on :9901 (config dump, stats, etc.) — useful for debugging.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: external
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                generate_request_id: true
                tracing:
                  # All three samplers must be set to 100 explicitly —
                  # if any default to 0, requests fall to `not_traceable`.
                  client_sampling:
                    value: 100
                  random_sampling:
                    value: 100
                  overall_sampling:
                    value: 100
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otlp_collector
                        timeout: 5s
                      service_name: "envoy"
                route_config:
                  name: local_route
                  # Echo the upstream host (the pod EPP picked) back to the
                  # client. Used by test.sh to verify which pod served each
                  # request without parsing the response body.
                  response_headers_to_add:
                    - header:
                        key: x-served-by
                        value: "%UPSTREAM_HOST%"
                  virtual_hosts:
                    - name: inference
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: original_dst
                            timeout: 60s
                http_filters:
                  # 1. BBR — extract `model` from JSON body, set x-model-name.
                  #    Requires BUFFERED request body so we get the whole JSON.
                  - name: envoy.filters.http.ext_proc.bbr
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: bbr_mock
                        timeout: 5s
                      failure_mode_allow: false
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                        response_body_mode: NONE

                  # 2. EPP — pick a pod, set x-gateway-destination-endpoint.
                  #    BUFFERED body mode so prefix-aware scoring can read the
                  #    prompt (the kv-cache indexer needs tokens, not just
                  #    headers). EPP returns the destination header in the
                  #    body response with clear_route_cache, so original_dst
                  #    re-resolves before upstream connect.
                  - name: envoy.filters.http.ext_proc.epp
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: epp_mock
                        timeout: 5s
                      failure_mode_allow: true   # if EPP down, fall through to default LB
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                        response_body_mode: NONE

                  # 3. Router — dispatches via original_dst cluster.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ext_proc target: BBR-mock
    - name: bbr_mock
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: bbr_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: bbr-mock, port_value: 9001 }

    # ext_proc target: EPP-mock
    - name: epp_mock
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: epp_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: epp-mock, port_value: 9002 }

    # Routing target — reads x-gateway-destination-endpoint from request
    # headers and connects to that host:port. This is how GIE-shaped EPP
    # routing works: EPP sets the header, Envoy obeys it.
    - name: original_dst
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      original_dst_lb_config:
        use_http_header: true
        http_header_name: x-gateway-destination-endpoint
      connect_timeout: 5s

    # OTLP collector for tracing — Jaeger all-in-one.
    - name: otlp_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: jaeger, port_value: 4317 }
