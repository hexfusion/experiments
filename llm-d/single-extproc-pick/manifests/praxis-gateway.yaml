# The single praxis gateway: one process running the whole chain (policy = user
# auth + per-user token budget, epp_router = local llm-d pick, then forward).
# Config comes from the praxis-config ConfigMap (praxis.yaml + policy.yaml),
# generated by kustomization.yaml from ../config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-gateway
  namespace: maas-scale
  labels: { app: praxis-gateway }
spec:
  # Scaled up for the benchmark; the whole point is that the per-user budget
  # stays correct across replicas because the counter is in Limitador.
  replicas: 1
  selector:
    matchLabels: { app: praxis-gateway }
  template:
    metadata:
      labels: { app: praxis-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: praxis
          # PENDING (M1): this image must be a praxis build that includes the
          # quota/limitador plugin. Until that plugin is built and linked, the
          # token-quota stanza in policy.yaml will not load.
          image: quay.io/sbatsche/praxis:maas-scale-dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /etc/praxis }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: praxis-config }
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-gateway
  namespace: maas-scale
spec:
  selector: { app: praxis-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
