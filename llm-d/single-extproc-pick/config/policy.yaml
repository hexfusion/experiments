# /policy: one policy engine authenticates the user AND enforces that user's
# token budget. The budget is a POLICY keyed on the resolved user identity, not
# a separate rate-limit filter. This is the piece the demo centers on: user-level
# tokens plumbed straight into /policy.
plugin_settings:
  routing_enabled: true
plugins:
  # Who the caller is. Resolves the MaaS user identity (sub) from the bearer
  # token and makes it available to every later hook.
  - name: user-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    on_error: fail
    config:
      header: Authorization
      role: user
      trusted_issuers:
        - issuer: "https://grid.internal/idp"
          audiences: ["ai-grid"]
          algorithms: ["HS256"]
          decoding_key:
            kind: secret
            secret: "ai-grid-demo-secret-change-me"
      claim_mapper: standard

  # The per-user token budget, enforced in-policy against Limitador. Pre-invoke
  # checks the resolved user's bucket and denies (429) when it is empty;
  # post-invoke debits the real usage.total_tokens from the response. The counter
  # lives in Limitador, so it stays correct across every ext_proc replica.
  #
  # PROVISIONAL: the quota/limitador plugin is the one piece of new code (M1),
  # spec at ~/personal/grid-token-quota-plugin-design.md. Hook names and the
  # exact config keys are pending that build and must be verified against the ppe
  # schema before this deploys.
  - name: token-quota
    kind: quota/limitador
    hooks: [request.pre_invoke, response.post_invoke]
    on_error: allow            # availability over strict metering if Limitador is down; `deny` to fail closed
    config:
      endpoint: http://limitador.maas-scale.svc.cluster.local:8080
      namespace: maas-tokens   # Limitador namespace; per-user max_value lives in its limits.yaml
      identity_claim: sub       # the budget keys on the SAME identity user-jwt resolved
      usage_json_path: usage.total_tokens

global:
  authentication: [user-jwt]
  authorization:
    # Authenticated to reach the model; the token-quota plugin adds the budget
    # gate as a pre-invoke reaction. Model-access authz (the per-user allowlist)
    # is generated by the MaaS operator from the subscription and slots in here.
    pre_invocation: ["require(authenticated)"]
  response:
    status: 401
    body: "{\"error\":\"authentication required\"}"
