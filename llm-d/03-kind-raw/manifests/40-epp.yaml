apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-config
  namespace: llm-d
data:
  config.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: precise-prefix-cache-scorer
      parameters:
        kvEventsConfig:
          # SUB binds here; sim PUBs DIAL it (--zmq-endpoint=tcp://epp:5557).
          zmqEndpoint: tcp://0.0.0.0:5557
        indexerConfig:
          tokenProcessorConfig:
            blockSize: 16     # must match sim's --block-size
            hashSeed: "42"    # must match sim's --hash-seed
          tokenizersPoolConfig:
            # Both sim and EPP tokenize via this model's HF tokenizer
            # (sim built-in HF mode; EPP via UDS sidecar). Block hashes
            # only line up when both sides agree.
            modelName: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    - type: decode-filter
    - type: max-score-picker
    - type: single-profile-handler
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
      - pluginRef: precise-prefix-cache-scorer
        weight: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp
  namespace: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epp
  template:
    metadata:
      labels:
        app: epp
    spec:
      serviceAccountName: epp
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-inference-scheduler:v0.8.0
          args:
            - --pool-name=vllm-sim-pool
            - --pool-namespace=llm-d
            - --config-file=/etc/epp/config.yaml
            - --secure-serving=true
            - --metrics-endpoint-auth=false
            - --health-checking=true
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: NAMESPACE,     valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            # Tracing: GIE EPP defaults to console exporter, switch to OTLP
            # gRPC pointed at our Jaeger Service. Sampler at 1.0 (default
            # is 0.1) so every request shows up in the demo.
            - { name: OTEL_SERVICE_NAME,         value: "epp" }
            - { name: OTEL_TRACES_EXPORTER,      value: "otlp" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger.llm-d.svc:4317" }
            - { name: OTEL_TRACES_SAMPLER,       value: "parentbased_traceidratio" }
            - { name: OTEL_TRACES_SAMPLER_ARG,   value: "1.0" }
          ports:
            - { name: extproc, containerPort: 9002 }
            - { name: zmq,     containerPort: 5557 }
            - { name: metrics, containerPort: 9090 }
            - { name: health,  containerPort: 9003 }
          volumeMounts:
            - { name: config,     mountPath: /etc/epp }
            - { name: uds-socket, mountPath: /tmp/tokenizer }
        # UDS tokenizer sidecar Python gRPC service that serves Render() /
        # RenderChat() over a Unix Domain Socket shared with the EPP via
        # emptyDir.
        - name: uds-tokenizer
          image: localhost/llm-d-uds-tokenizer:baked
          imagePullPolicy: Never
          env:
            - { name: LOG_LEVEL, value: INFO }
            - { name: PROBE_PORT, value: "8082" }
          ports:
            - { name: health, containerPort: 8082 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: uds-socket,  mountPath: /tmp/tokenizer }
            - { name: model-cache, mountPath: /models }
      volumes:
        - { name: config,      configMap: { name: epp-config } }
        - { name: uds-socket,  emptyDir: {} }
        - { name: model-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: epp
  namespace: llm-d
spec:
  selector:
    app: epp
  ports:
    - { name: extproc, port: 9002, targetPort: extproc }
    - { name: zmq,     port: 5557, targetPort: zmq }
    - { name: metrics, port: 9090, targetPort: metrics }
