apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  namespace: llm-d
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
          args:
            # Real HF model so both sim and EPP can use the same HF tokenizer.
            - --port=8000
            - --model=TinyLlama/TinyLlama-1.1B-Chat-v1.0
            - --mode=random
            - --max-num-seqs=4
            - --time-to-first-token=50ms
            - --inter-token-latency=10ms
            - --enable-kvcache
            - --kv-cache-size=1024
            - --block-size=16
            - --hash-seed=42
            # EPP Service name resolves via cluster DNS
            - --zmq-endpoint=tcp://epp:5557
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_IP,   valueFrom: { fieldRef: { fieldPath: status.podIP } } }
          ports:
            - { name: http, containerPort: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-sim
  namespace: llm-d
spec:
  clusterIP: None
  selector:
    app: vllm-sim
  ports:
    - { name: http, port: 8000, targetPort: http }
