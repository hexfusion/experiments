apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d
  namespace: llm-d
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d
  namespace: llm-d
spec:
  parentRefs:
    - name: llm-d
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-sim-pool
          port: 8000
