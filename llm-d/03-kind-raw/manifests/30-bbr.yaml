apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbr-mock
  namespace: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bbr-mock
  template:
    metadata:
      labels:
        app: bbr-mock
    spec:
      containers:
        - name: bbr-mock
          # Built locally + loaded into kind via setup.sh.
          image: localhost/llm-d-bbr-mock:dev
          imagePullPolicy: Never
          args: ["--listen=:9001"]
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "jaeger:4317" }
          ports:
            - { name: grpc, containerPort: 9001 }
---
apiVersion: v1
kind: Service
metadata:
  name: bbr-mock
  namespace: llm-d
spec:
  selector:
    app: bbr-mock
  ports:
    - { name: grpc, port: 9001, targetPort: grpc }
