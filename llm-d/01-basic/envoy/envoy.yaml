admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # Front-door listener — this is what clients hit.
    - name: external
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                # generate_request_id is required for tracing to attach a
                # trace id to each request.
                generate_request_id: true
                tracing:
                  # All three samplers must be set to 100 explicitly —
                  # if any default to 0, requests fall to `not_traceable`.
                  client_sampling:
                    value: 100
                  random_sampling:
                    value: 100
                  overall_sampling:
                    value: 100
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otlp_collector
                        timeout: 5s
                      service_name: "envoy"
                # /v1/* inference traffic is dispatched to original_dst,
                # which dials whatever endpoint EPP wrote into the
                # x-gateway-destination-endpoint header.
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: inference
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: original_dst
                            timeout: 60s
                # Filters run top-to-bottom. BBR sees the request first and may
                # mutate it (e.g. lift model name out of the body into a header);
                # EPP then sees the mutated request and picks an endpoint by
                # setting x-gateway-destination-endpoint, which the router
                # below honors via the original_dst cluster.
                http_filters:
                  # BBR — body-based routing. Reads the JSON body to extract
                  # the model name and surface it as a header for EPP.
                  - name: envoy.filters.http.ext_proc.bbr
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      # grpc_service.envoy_grpc.cluster_name is a string handle
                      # that resolves to a cluster defined below. Envoy opens a
                      # bidi stream to that cluster's endpoint on the
                      # envoy.service.ext_proc.v3.ExternalProcessor/Process RPC.
                      grpc_service:
                        envoy_grpc:
                          cluster_name: bbr_mock
                        timeout: 5s
                      # Fail closed: without BBR we can't extract the model,
                      # so routing would be wrong — better to reject.
                      failure_mode_allow: false
                      # Which phases get streamed to the processor. BBR needs
                      # the body (BUFFERED = wait for full body before sending)
                      # to parse JSON; it doesn't care about responses.
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: BUFFERED
                        response_body_mode: NONE

                  # EPP — endpoint picker. Chooses a model pod and writes
                  # x-gateway-destination-endpoint on the request.
                  - name: envoy.filters.http.ext_proc.epp
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: epp_mock
                        timeout: 5s
                      # Fail open: if EPP is down, skip endpoint selection and
                      # let the upstream cluster's default LB take over.
                      failure_mode_allow: true
                      # Headers only — EPP routes off the header BBR wrote,
                      # so no need to ship the body across this stream.
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SKIP
                        request_body_mode: NONE
                        response_body_mode: NONE

                  # Terminal filter — actually dispatches the request to the
                  # cluster named on the matched route.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ext_proc target: BBR-mock.
    # Referenced by the ext_proc.bbr filter via cluster_name above. The
    # http2_protocol_options block is mandatory — ext_proc is gRPC, which
    # is HTTP/2; without it Envoy defaults to HTTP/1.1 and the stream
    # never establishes.
    - name: bbr_mock
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: bbr_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    # STRICT_DNS resolves this hostname (docker-compose
                    # service name) and keeps the result fresh.
                    socket_address: { address: bbr-mock, port_value: 9001 }

    # ext_proc target: EPP-mock. Same shape as bbr_mock — different name,
    # different endpoint. Referenced by the ext_proc.epp filter.
    - name: epp_mock
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: epp_mock
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: epp-mock, port_value: 9002 }

    # Routing target — reads x-gateway-destination-endpoint from request
    # headers and connects to that host:port. This is how GIE-shaped EPP
    # routing works: EPP sets the header, Envoy obeys it.
    # CLUSTER_PROVIDED + use_http_header means "ignore any endpoint list,
    # the header tells us where to go."
    - name: original_dst
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      original_dst_lb_config:
        use_http_header: true
        http_header_name: x-gateway-destination-endpoint
      connect_timeout: 5s

    # OTLP collector for tracing — Jaeger all-in-one.
    - name: otlp_collector
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otlp_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: jaeger, port_value: 4317 }
