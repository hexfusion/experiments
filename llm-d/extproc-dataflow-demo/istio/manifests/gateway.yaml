# Gateway API + the istio GatewayClass (the same shape RHAII ships: GatewayClass=istio, Envoy proxy).
# Istio provisions a gateway Deployment; the EnvoyFilter then patches its filter chain.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: extproc-gw
  namespace: extproc-demo
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: to-echo
  namespace: extproc-demo
spec:
  parentRefs:
  - name: extproc-gw
  rules:
  - matches:
    - path: { type: PathPrefix, value: / }
    backendRefs:
    - name: echo
      port: 8080
