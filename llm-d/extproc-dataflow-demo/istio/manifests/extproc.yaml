# IPP-brackets-EPP ext_proc chain, expressed on Istio's gateway Envoy via EnvoyFilter.
#
# The whole point of the istio example: the SAME chain the raw-Envoy demo proves
# (ipp_pre -> epp -> ipp_post, all before the router) on the data plane Red Hat AI Inference ships
# (GatewayClass=istio, an Envoy proxy). agentgateway cannot express this today (one ext_proc, no
# post-pick stage); Istio/Envoy can, and it is pure configuration.
#
# Why EnvoyFilter: Istio does not yet expose ext_proc as a first-class Gateway-API policy, so we use
# EnvoyFilter, the supported escape hatch for injecting Envoy config. It is low-level and
# version-sensitive (Istio docs warn it can break across upgrades); pin the Istio version and
# re-validate on upgrade. Verified against Istio 1.28.1 (RHAII 3.4's version).
#
# Layout: 2 CLUSTER patches (the IPP and EPP ext_proc upstreams) + 3 HTTP_FILTER patches (the
# ext_proc filters, inserted in order before the router).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: extproc-chain
  namespace: extproc-demo
spec:
  # Target only the gateway Envoy Istio provisioned for the `extproc-gw` Gateway. Istio labels that
  # pod istio.io/gateway-name=<gateway>; context: GATEWAY (below) scopes the patches to it.
  workloadSelector:
    labels:
      istio.io/gateway-name: extproc-gw
  configPatches:

  # === ext_proc UPSTREAM CLUSTERS =============================================================
  # Defined inline (not via a ServiceEntry / Istio's auto cluster) on purpose: keeps the callout
  # plaintext HTTP/2 and sidesteps Istio mTLS to these services (the mock pods have no sidecar).
  # http2_protocol_options is REQUIRED -- ext_proc is gRPC.
  - applyTo: CLUSTER
    match: { context: GATEWAY }
    patch:
      operation: ADD
      value:
        name: ipp_extproc            # one IPP process; both ipp_pre and ipp_post point here
        type: STRICT_DNS
        connect_timeout: 1s
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config: { http2_protocol_options: {} }
        load_assignment:
          cluster_name: ipp_extproc
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: ipp.extproc-demo.svc.cluster.local, port_value: 18001 }
  - applyTo: CLUSTER
    match: { context: GATEWAY }
    patch:
      operation: ADD
      value:
        name: epp_extproc            # the EPP, a separate process
        type: STRICT_DNS
        connect_timeout: 1s
        lb_policy: ROUND_ROBIN
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config: { http2_protocol_options: {} }
        load_assignment:
          cluster_name: epp_extproc
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: epp.extproc-demo.svc.cluster.local, port_value: 18002 }

  # === ext_proc FILTERS: ipp_pre -> epp -> ipp_post, all before the router ====================
  # Ordering is anchored, not positional: ipp_pre is inserted before the router, then epp is inserted
  # AFTER ipp_pre, then ipp_post AFTER epp. Anchoring each filter to the previous one makes the order
  # [ipp_pre, epp, ipp_post, router] deterministic; stacking INSERT_BEFORE on one anchor leaves
  # relative order under-specified.
  # 2 services, 3 positions: ipp_pre and ipp_post both target cluster ipp_extproc (ONE IPP),
  # bracketing the single epp. This is a supported ext_proc composition model, not a workaround:
  # Envoy's ext_proc is designed to compose. A processor's dynamic_metadata is, per the proto,
  # "consumed by following filters", and forwarding_namespaces / receiving_namespaces pass state
  # filter -> server -> filter along the chain.

  # Position 1/3 = IPP before-advice (pre-pick): extract the model from the body. BUFFERED.
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter: { name: envoy.filters.http.router }
    patch:
      operation: INSERT_BEFORE
      value:
        name: ext_proc.ipp_pre
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          grpc_service: { envoy_grpc: { cluster_name: ipp_extproc } }
          processing_mode:
            request_header_mode: SEND
            response_header_mode: SKIP
            request_body_mode: BUFFERED    # reads the body to extract the model
            response_body_mode: NONE

  # Position 2/3 = EPP (the wrapped interceptor): picks the destination. Inserted AFTER ipp_pre.
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter: { name: ext_proc.ipp_pre }
    patch:
      operation: INSERT_AFTER
      value:
        name: ext_proc.epp
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          grpc_service: { envoy_grpc: { cluster_name: epp_extproc } }
          processing_mode:
            request_header_mode: SEND      # reads the model, sets the destination header
            response_header_mode: SKIP
            request_body_mode: NONE
            response_body_mode: NONE

  # Position 3/3 = IPP after-advice (post-pick): inject the credential (header-only). allow_mode_override
  # lets it flip to buffering the body ONLY when the chosen destination needs translation.
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter: { name: ext_proc.epp }
    patch:
      operation: INSERT_AFTER
      value:
        name: ext_proc.ipp_post
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          grpc_service: { envoy_grpc: { cluster_name: ipp_extproc } }
          allow_mode_override: true        # IPP post may flip to buffering to translate
          processing_mode:
            request_header_mode: SEND       # sees the EPP's pick header; injects the credential
            response_header_mode: SKIP
            request_body_mode: NONE         # header-only by default; mode_override buffers when translating
            response_body_mode: NONE
