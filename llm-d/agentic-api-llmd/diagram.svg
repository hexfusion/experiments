<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="1240" height="720" fill="#ffffff"/>
  <defs>
    <marker id="g"   markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/></marker>
    <marker id="blu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/></marker>
    <marker id="amb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker>
    <marker id="vio" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8B5CF6"/></marker>
  </defs>

  <!-- title (stands alone as a PNG) -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">agentic-api on llm-d — precise KV-cache-aware multi-turn routing</text>
  <text x="40" y="72" font-size="15" fill="#64748B">A stateful agentic front, routed by real KV-block residency, keeps every turn on the pod already holding its cache.</text>

  <!-- ============ CLIENT (neutral) ============ -->
  <rect x="40" y="205" width="120" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="100" y="248" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="100" y="270" font-size="12" fill="#64748B" text-anchor="middle">/v1/responses</text>
  <text x="100" y="286" font-size="12" fill="#64748B" text-anchor="middle">multi-turn</text>

  <!-- ============ agentic-api (orchestrator / indigo) ============ -->
  <rect x="205" y="115" width="255" height="290" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="222" y="142" font-size="17" font-weight="700" fill="#4338CA">agentic-api</text>
  <text x="222" y="161" font-size="12" fill="#6366F1">the stateful agentic layer · Rust (vllm-project)</text>
  <rect x="221" y="176" width="223" height="44" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="332" y="203" font-size="13" fill="#4338CA" text-anchor="middle">Responses API · owns the loop</text>
  <rect x="221" y="228" width="223" height="44" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="332" y="255" font-size="13" fill="#4338CA" text-anchor="middle">hydrate history · SQLite</text>
  <rect x="221" y="280" width="223" height="44" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="332" y="300" font-size="12.5" fill="#4338CA" text-anchor="middle">re-send full prompt each turn</text>
  <text x="332" y="316" font-size="11.5" fill="#6366F1" text-anchor="middle">previous_response_id</text>
  <rect x="221" y="332" width="223" height="44" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="332" y="359" font-size="12.5" fill="#4338CA" text-anchor="middle">OTLP traces + /metrics</text>

  <!-- ============ llm-d router (scheduler / blue) ============ -->
  <rect x="505" y="100" width="360" height="320" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="522" y="127" font-size="17" font-weight="700" fill="#1D4ED8">llm-d router</text>
  <text x="522" y="146" font-size="12" fill="#3B82F6">upstream — Envoy data plane + EPP</text>
  <rect x="521" y="160" width="328" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="685" y="185" font-size="13" fill="#1D4ED8" text-anchor="middle">Envoy proxy · :8081  (ext_proc → EPP)</text>
  <!-- EPP nested lane -->
  <rect x="521" y="210" width="328" height="196" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="536" y="232" font-size="13.5" font-weight="700" fill="#1D4ED8">EPP · endpoint picker</text>
  <text x="536" y="249" font-size="11.5" fill="#3B82F6">llm-d-epp:responses-6a50d62 (custom)</text>
  <rect x="536" y="258" width="298" height="38" rx="6" fill="#ffffff" stroke="#3B82F6" stroke-width="1"/>
  <text x="685" y="282" font-size="12.5" fill="#1D4ED8" text-anchor="middle">token-producer → /render (Responses)</text>
  <rect x="536" y="302" width="298" height="44" rx="6" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1"/>
  <text x="685" y="322" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">precise-prefix-cache-producer</text>
  <text x="685" y="338" font-size="11" fill="#DBEAFE" text-anchor="middle">real KV-block index (not approximate)</text>
  <rect x="536" y="352" width="298" height="38" rx="6" fill="#ffffff" stroke="#3B82F6" stroke-width="1"/>
  <text x="685" y="376" font-size="12.5" fill="#1D4ED8" text-anchor="middle">prefix-cache-scorer · weight 10 (dominant)</text>

  <!-- ============ vLLM x2 (engine / violet) ============ -->
  <rect x="910" y="115" width="290" height="290" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="927" y="142" font-size="17" font-weight="700" fill="#6D28D9">vLLM ×2</text>
  <text x="927" y="161" font-size="12" fill="#7C3AED">block-size 64 · prefix caching · /render</text>
  <rect x="926" y="176" width="258" height="104" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="942" y="198" font-size="13" font-weight="700" fill="#6D28D9">pod A · RTX A5000 (endor)</text>
  <text x="942" y="219" font-size="12" fill="#6D28D9">serves /v1/responses + /render</text>
  <text x="942" y="238" font-size="12" fill="#6D28D9">holds this conversation's KV cache</text>
  <text x="942" y="264" font-size="11.5" fill="#7C3AED">publishes KV block events → ZMQ :5556</text>
  <rect x="926" y="288" width="258" height="104" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="942" y="310" font-size="13" font-weight="700" fill="#6D28D9">pod B · Tesla T4 (worker5)</text>
  <text x="942" y="331" font-size="12" fill="#6D28D9">serves /v1/responses + /render</text>
  <text x="942" y="350" font-size="12" fill="#6D28D9">independent KV cache</text>
  <text x="942" y="376" font-size="11.5" fill="#7C3AED">publishes KV block events → ZMQ :5556</text>

  <!-- ============ Jaeger (data / external) ============ -->
  <rect x="205" y="470" width="255" height="70" rx="6" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="399" y="478" width="56" height="20" rx="6" fill="#E2E8F0"/><text x="427" y="492" font-size="10.5" fill="#475569" text-anchor="middle">external</text>
  <text x="332" y="502" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="middle">Jaeger</text>
  <text x="332" y="524" font-size="12" fill="#64748B" text-anchor="middle">OTLP :4317 · one trace across the hops</text>

  <!-- ============ REQUEST FLOW (solid gray) ============ -->
  <line x1="160" y1="253" x2="201" y2="253" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="460" y1="253" x2="501" y2="253" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="480" y="243" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">:8081</text>
  <line x1="865" y1="200" x2="906" y2="200" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="885" y="190" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="middle">forward</text>

  <!-- ============ MECHANISM: KV block events back to the precise producer (dashed blue) ============ -->
  <path d="M 926 355 C 890 360, 870 340, 838 330" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blu)"/>
  <text x="884" y="375" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="middle">KV block events</text>

  <!-- ============ MECHANISM: token-producer -> /render (dashed blue) ============ -->
  <path d="M 838 277 C 875 277, 890 250, 924 235" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#vio)"/>
  <text x="884" y="258" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle">/render</text>

  <!-- ============ OTLP (dashed amber) ============ -->
  <line x1="332" y1="405" x2="332" y2="466" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amb)"/>
  <path d="M 1020 405 C 1020 450, 470 505, 462 505" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amb)"/>
  <text x="720" y="470" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">OTLP + traceparent</text>

  <!-- ============ PAYOFF: cache climb ============ -->
  <rect x="520" y="470" width="680" height="140" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="540" y="495" font-size="14" font-weight="700" fill="#065F46">Cached tokens climb across turns — O(turns), not O(turns²)</text>
  <!-- mini bars -->
  <g font-size="11.5" fill="#065F46" text-anchor="middle">
    <rect x="560" y="585" width="46" height="4"  rx="2" fill="#A7F3D0"/><text x="583" y="600">t1 · 0%</text>
    <rect x="640" y="556" width="46" height="33" rx="2" fill="#34D399"/><text x="663" y="600">t2 · 72%</text>
    <rect x="720" y="549" width="46" height="40" rx="2" fill="#10B981"/><text x="743" y="600">t3 · 88%</text>
    <rect x="800" y="547" width="46" height="42" rx="2" fill="#059669"/><text x="823" y="600">t4 · 91%</text>
  </g>
  <text x="900" y="540" font-size="12.5" fill="#065F46">Each turn pins to the pod already</text>
  <text x="900" y="558" font-size="12.5" fill="#065F46">holding its KV cache — chosen from</text>
  <text x="900" y="576" font-size="12.5" fill="#065F46">real engine events, not content guesses.</text>

  <!-- ============ LEGEND ============ -->
  <g font-size="11.5">
    <line x1="40" y1="660" x2="70" y2="660" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#g)"/><text x="78" y="664" fill="#64748B">request path</text>
    <line x1="190" y1="660" x2="220" y2="660" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blu)"/><text x="228" y="664" fill="#64748B">KV events / render (precise)</text>
    <line x1="440" y1="660" x2="470" y2="660" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amb)"/><text x="478" y="664" fill="#64748B">tracing (OTLP)</text>
  </g>
  <text x="40" y="700" font-size="15" font-weight="700" fill="#0F172A">The agentic layer owns the conversation; llm-d owns the routing — together they make multi-turn cheap.</text>
</svg>
