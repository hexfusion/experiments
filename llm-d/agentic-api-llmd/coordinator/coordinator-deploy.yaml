# Tokenize-once Coordinator. Runs coordinator.py (stdlib only) from a ConfigMap
# on a UBI python image -> no build, no push. DB in /tmp (ephemeral, demo).
apiVersion: apps/v1
kind: Deployment
metadata: { name: coordinator, namespace: agentic-demo, labels: { app: coordinator } }
spec:
  replicas: 1
  selector: { matchLabels: { app: coordinator } }
  template:
    metadata: { labels: { app: coordinator } }
    spec:
      containers:
      - name: coordinator
        image: registry.access.redhat.com/ubi9/python-312:latest
        command: ["python3", "/src/coordinator.py"]
        env:
        - { name: MODEL,        value: "Qwen/Qwen2.5-1.5B-Instruct" }
        - { name: TOKENIZE_URL, value: "http://vllm-server:8000" }   # engine tokenizer
        - { name: ROUTER_URL,   value: "http://router-epp:8081" }    # Envoy -> EPP -> vLLM
        - { name: DB_PATH,      value: "/tmp/coordinator.db" }
        - { name: PORT,         value: "9100" }
        ports: [{ containerPort: 9100, name: http }]
        readinessProbe: { httpGet: { path: /health, port: 9100 }, initialDelaySeconds: 3, periodSeconds: 5 }
        volumeMounts: [{ name: src, mountPath: /src }]
      volumes:
      - { name: src, configMap: { name: coordinator-src } }
---
apiVersion: v1
kind: Service
metadata: { name: coordinator, namespace: agentic-demo, labels: { app: coordinator } }
spec:
  selector: { app: coordinator }
  ports: [{ port: 9100, targetPort: 9100, name: http }]
