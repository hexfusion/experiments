apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasource, namespace: two-route }
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # ClusterIP, not the Service name: cluster DNS is unreliable from a pod
        # here and every component that used an FQDN had to be moved off it.
        url: http://PROM_IP:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboards-provider, namespace: two-route }
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: two-route
        folder: ''
        type: file
        options: { path: /var/lib/grafana/dashboards }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: two-route }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasource,  mountPath: /etc/grafana/provisioning/datasources }
            - { name: provider,    mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards,  mountPath: /var/lib/grafana/dashboards }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 } }
      volumes:
        - { name: datasource, configMap: { name: grafana-datasource } }
        - { name: provider,   configMap: { name: grafana-dashboards-provider } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: two-route }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
