apiVersion: v1
kind: Namespace
metadata: { name: keycloak }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, namespace: keycloak, labels: { app: keycloak } }
spec:
  replicas: 1
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }   # dev only
            - { name: KC_HEALTH_ENABLED,           value: "true" }
            - { name: KC_HTTP_ENABLED,             value: "true" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: health, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits:   { cpu: "1",  memory: 2Gi }   # OOMs at 1Gi
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: keycloak }
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
