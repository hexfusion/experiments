# Per-pool file-discovery: a second hub EPP for model-b. Same spoke-gateway endpoints, but scrapes
# /metrics/model-b -> scores on model-b's per-cluster load (independent of model-a). clusters-b = its marker.
apiVersion: v1
kind: ConfigMap
metadata: { name: epp-fd-b-config, namespace: llm-d }
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - { type: file-discovery, name: file-discovery, parameters: { path: /etc/epp/endpoints.yaml, watchFile: true } }
      - type: queue-scorer
      - type: max-score-picker
      - type: single-profile-handler
      - type: metrics-data-source
      - type: core-metrics-extractor
        parameters:
          defaultEngine: cluster
          engineConfigs:
            - { name: cluster, queuedRequestsSpec: "inference_pool_average_queue_size", runningRequestsSpec: "inference_pool_average_running_requests", kvUsageSpec: "inference_pool_average_kv_cache_utilization" }
    dataLayer:
      discovery: { pluginRef: file-discovery }
      sources: [ { pluginRef: metrics-data-source, extractors: [ { pluginRef: core-metrics-extractor } ] } ]
    schedulingProfiles:
      - name: default
        plugins: [ { pluginRef: queue-scorer, weight: 1 }, { pluginRef: max-score-picker } ]
  endpoints.yaml: |
    endpoints:
      - { name: cluster-a, address: "10.89.0.212", port: "8080", labels: { cluster: a } }
      - { name: cluster-b, address: "10.89.0.222", port: "8080", labels: { cluster: b } }
      - { name: cluster-c, address: "10.89.0.232", port: "8080", labels: { cluster: c } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: epp-fd-b, namespace: llm-d, labels: { app: epp-fd-b } }
spec:
  replicas: 1
  selector: { matchLabels: { app: epp-fd-b } }
  template:
    metadata: { labels: { app: epp-fd-b } }
    spec:
      serviceAccountName: epp
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
          args:
            - --pool-name=clusters-b
            - --pool-namespace=llm-d
            - --config-file=/etc/epp/config.yaml
            - --model-server-metrics-path=/metrics/model-b
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --health-checking=true
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          ports: [ { name: extproc, containerPort: 9002 }, { name: metrics, containerPort: 9090 }, { name: health, containerPort: 9003 } ]
          volumeMounts: [ { name: config, mountPath: /etc/epp } ]
      volumes: [ { name: config, configMap: { name: epp-fd-b-config } } ]
---
apiVersion: v1
kind: Service
metadata: { name: epp-fd-b, namespace: llm-d, labels: { app: epp-fd-b } }
spec:
  selector: { app: epp-fd-b }
  ports:
    - { name: extproc, port: 9002, targetPort: extproc, appProtocol: kubernetes.io/h2c }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata: { name: clusters-b, namespace: llm-d }
spec:
  selector:
    matchLabels: { app: epp-fd-b-no-endpoints }
  targetPorts: [ { number: 8080 } ]
  endpointPickerRef: { group: "", kind: Service, name: epp-fd-b, port: { number: 9002 }, failureMode: FailOpen }
