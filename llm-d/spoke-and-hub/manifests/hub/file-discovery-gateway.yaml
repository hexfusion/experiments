apiVersion: v1
kind: Service
metadata: { name: epp-fd, namespace: llm-d, labels: { app: epp-fd } }
spec:
  selector: { app: epp-fd }
  ports:
    - { name: extproc, port: 9002, targetPort: extproc, appProtocol: kubernetes.io/h2c }
    - { name: metrics, port: 9090, targetPort: metrics }
---
# makes istio set up ext_proc(epp-fd) + ORIGINAL_DST. selector matches nothing real (forward is
# header-driven, so the pool needs no endpoints); endpointPickerRef -> the file-discovery EPP.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata: { name: clusters, namespace: llm-d }
spec:
  selector:
    matchLabels: { app: epp-fd-no-endpoints }
  targetPorts: [ { number: 8080 } ]
  endpointPickerRef: { group: "", kind: Service, name: epp-fd, port: { number: 9002 }, failureMode: FailOpen }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: hub-fd, namespace: llm-d }
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: hub-fd, namespace: llm-d }
spec:
  parentRefs: [ { name: hub-fd } ]
  rules:
    # demux x-model -> the per-model file-discovery EPP (each scores on its own pool's per-cluster load)
    - matches: [ { path: { type: PathPrefix, value: /v1/ }, headers: [ { name: x-model, value: model-b } ] } ]
      backendRefs:
        - { group: inference.networking.k8s.io, kind: InferencePool, name: clusters-b, port: 8080 }
    - matches: [ { path: { type: PathPrefix, value: /v1/ } } ]   # default -> model-a
      backendRefs:
        - { group: inference.networking.k8s.io, kind: InferencePool, name: clusters, port: 8080 }
