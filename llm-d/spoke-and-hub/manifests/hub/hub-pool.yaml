apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: hub-pool
  namespace: llm-d
spec:
  selector:
    matchLabels:
      app: hub-pool          # the cluster reverse-proxy pods (cluster-proxies.yaml)
  targetPorts:
    - number: 8000
  endpointPickerRef:
    group: ""
    kind: Service
    name: epp
    port:
      number: 9002
    failureMode: FailOpen
