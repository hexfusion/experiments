apiVersion: v1
kind: ConfigMap
metadata: { name: epp-fd-config, namespace: llm-d }
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: file-discovery
        name: file-discovery
        parameters: { path: /etc/epp/endpoints.yaml, watchFile: true }
      - type: queue-scorer
      - type: max-score-picker
      - type: single-profile-handler
      - type: metrics-data-source
      - type: core-metrics-extractor
        parameters:
          defaultEngine: cluster
          engineConfigs:
            - name: cluster
              queuedRequestsSpec: "inference_pool_average_queue_size"
              runningRequestsSpec: "inference_pool_average_running_requests"
              kvUsageSpec: "inference_pool_average_kv_cache_utilization"
    dataLayer:
      discovery: { pluginRef: file-discovery }
      sources:
        - pluginRef: metrics-data-source
          extractors: [ { pluginRef: core-metrics-extractor } ]
    schedulingProfiles:
      - name: default
        plugins:
          - { pluginRef: queue-scorer, weight: 1 }
          - { pluginRef: max-score-picker }
  # declared in the ConfigMap (the spoke gateways).
  endpoints.yaml: |
    endpoints:
      - { name: cluster-a, address: "10.89.0.212", port: "8080", labels: { cluster: a } }
      - { name: cluster-b, address: "10.89.0.222", port: "8080", labels: { cluster: b } }
      - { name: cluster-c, address: "10.89.0.232", port: "8080", labels: { cluster: c } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: epp-fd, namespace: llm-d, labels: { app: epp-fd } }
spec:
  replicas: 1
  selector: { matchLabels: { app: epp-fd } }
  template:
    metadata: { labels: { app: epp-fd } }
    spec:
      serviceAccountName: epp
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
          args:
            - --pool-name=clusters          # logical pool name; endpoints still come from the file
            - --pool-namespace=llm-d
            - --config-file=/etc/epp/config.yaml
            - --model-server-metrics-path=/metrics/model-a   # scrape pool's aggregate via the gateway route
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --health-checking=true
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          ports:
            - { name: extproc, containerPort: 9002 }
            - { name: metrics, containerPort: 9090 }
            - { name: health,  containerPort: 9003 }
          volumeMounts: [ { name: config, mountPath: /etc/epp } ]
      volumes: [ { name: config, configMap: { name: epp-fd-config } } ]
