apiVersion: v1
kind: Service
metadata: { name: hub-pool-rr, namespace: llm-d }
spec:
  selector: { app: hub-pool }      # the same cluster reverse-proxy pods
  sessionAffinity: None            # dumb: no stickiness
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: hub-rr, namespace: llm-d }
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: hub-rr, namespace: llm-d }
spec:
  parentRefs: [ { name: hub-rr } ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /v1/ } } ]
      backendRefs:
        - group: ""
          kind: Service
          name: hub-pool-rr        # plain Service -> kube-proxy round-robin over the proxies
          port: 8000
