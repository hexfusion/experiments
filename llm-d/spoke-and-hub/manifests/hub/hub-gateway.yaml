---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hub
  namespace: llm-d
spec:
  gatewayClassName: istio        # requires istio Gateway API + InferencePool/GIE support
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hub
  namespace: llm-d
spec:
  parentRefs:
    - name: hub
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1/ }
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: hub-pool          # EPP picks a cluster (reverse-proxy endpoint) from this pool
          port: 8000
