apiVersion: apps/v1
kind: Deployment
metadata: { name: inference-sim, namespace: llm-d, labels: { app: inference-sim } }
spec:
  replicas: 3                                   # real pod-pick needs >1 endpoint
  selector: { matchLabels: { app: inference-sim } }
  template:
    metadata: { labels: { app: inference-sim } }
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.0
          args:
            - "--model=meta/model-a"
            - "--served-model-name=model-a"
            - "--port=8000"
            - "--force-dummy-tokenizer"
            - "--max-num-seqs=16"
            - "--time-to-first-token=100ms"
            - "--inter-token-latency=12ms"
            - "--time-factor-under-load=2"
            - "--enable-kvcache"
            - "--kv-cache-size=512"
            - "--block-size=16"
          env:
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }   # required by --enable-kvcache
          ports: [ { containerPort: 8000, name: http } ]
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: inference-sim, namespace: llm-d }
spec:
  selector: { app: inference-sim }
  ports: [ { port: 8000, targetPort: 8000, name: http } ]
