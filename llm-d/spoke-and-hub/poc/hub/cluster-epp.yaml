# Hub cluster-EPP: file-discovery over spoke endpoints (not pod selection). Scores spokes, sets
# x-gateway-destination-endpoint; ORIGINAL_DST forwards, IPP injects the token post-pick.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: cluster-epp, namespace: aig-routing }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: cluster-epp }
rules:
  - { apiGroups: ["inference.networking.k8s.io"], resources: ["inferencepools","inferencepools/status"], verbs: ["get","list","watch","update","patch"] }
  - { apiGroups: [""], resources: ["pods","services","endpoints","configmaps"], verbs: ["get","list","watch"] }
  - { apiGroups: ["discovery.k8s.io"], resources: ["endpointslices"], verbs: ["get","list","watch"] }
  - { apiGroups: ["coordination.k8s.io"], resources: ["leases"], verbs: ["get","list","watch","create","update","patch","delete"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: cluster-epp }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-epp }
subjects: [ { kind: ServiceAccount, name: cluster-epp, namespace: aig-routing } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: cluster-epp-config, namespace: aig-routing }
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: file-discovery
        name: file-discovery
        parameters: { path: /etc/epp/endpoints.yaml, watchFile: true }
      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: session-affinity-filter
      - type: max-score-picker
      - type: weighted-random-picker
      - type: single-profile-handler
      - type: metrics-data-source
        parameters: { scheme: https, insecureSkipVerify: false, caCertPath: /etc/epp/spoke-ca.pem }   # scrape spoke gateways over TLS
      - type: core-metrics-extractor
        parameters:
          defaultEngine: cluster
          engineConfigs:
            - name: cluster                                                    # RHOAI spoke EPP omits running_requests
              queuedRequestsSpec: "inference_pool_average_queue_size"
              kvUsageSpec: "inference_pool_average_kv_cache_utilization"
    dataLayer:
      discovery: { pluginRef: file-discovery }
      sources:
        - pluginRef: metrics-data-source
          extractors: [ { pluginRef: core-metrics-extractor } ]
    schedulingProfiles:
      - name: clusters
        plugins:
          - { pluginRef: session-affinity-filter }
          - { pluginRef: queue-scorer, weight: 2 }
          - { pluginRef: kv-cache-utilization-scorer, weight: 2 }
          - { pluginRef: max-score-picker }
  # address = maas IP (forward target); metricsAddress = the spoke metrics-gateway Route (scrape target).
  # spoke-ca.pem key = each spoke's ingress CA concatenated (env-specific, added at deploy time).
  endpoints.yaml: |
    endpoints:
      - name: ifc1
        address: "3.143.47.169"
        port: "443"
        metricsAddress: "aig-metrics-gw-maas-project.apps.aigrid-ifc1.mavazque.sysdeseng.com"
        metricsPort: "443"
        labels:
          cluster: ifc1
          region: us-east-2
      - name: ifc2
        address: "44.226.90.1"
        port: "443"
        metricsAddress: "aig-metrics-gw-maas-project.apps.aigrid-ifc2.mavazque.sysdeseng.com"
        metricsPort: "443"
        labels:
          cluster: ifc2
          region: us-west-2
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cluster-epp, namespace: aig-routing, labels: { app: cluster-epp } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cluster-epp } }
  template:
    metadata: { labels: { app: cluster-epp } }
    spec:
      serviceAccountName: cluster-epp
      containers:
        - name: epp
          image: quay.io/sbatsche/llm-d-router-endpoint-picker:metricsaddr-catls-v1    # custom EPP: metricsAddress + caCertPath (llm-d-router #1857/#1858)
          args:
            - --pool-name=clusters
            - --pool-namespace=aig-routing
            - --config-file=/etc/epp/config.yaml
            - --model-server-metrics-path=/metrics    # scrape each spoke's exposed EPP aggregate
            - --secure-serving=false
            - --metrics-endpoint-auth=false
            - --health-checking=true
            - --refresh-metrics-interval=1s
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          ports:
            - { name: extproc, containerPort: 9002 }
            - { name: metrics, containerPort: 9090 }
            - { name: health,  containerPort: 9003 }
          volumeMounts: [ { name: config, mountPath: /etc/epp } ]
      volumes: [ { name: config, configMap: { name: cluster-epp-config } } ]
---
apiVersion: v1
kind: Service
metadata: { name: cluster-epp, namespace: aig-routing, labels: { app: cluster-epp } }
spec:
  selector: { app: cluster-epp }
  ports:
    - { name: extproc, port: 9002, targetPort: extproc, appProtocol: kubernetes.io/h2c }
    - { name: metrics, port: 9090, targetPort: metrics }
