# Per-spoke proxy: injects the SA token so the hub can scrape the auth-gated EPP :9090 without one.
# Apply per spoke (namespace maas-project). Hub reaches this Route via metricsAddress + caCertPath.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: aig-metrics-gw, namespace: maas-project, labels: { app.kubernetes.io/managed-by: aig-routing } }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: aig-metrics-gw, labels: { app.kubernetes.io/managed-by: aig-routing } }
rules: [ { nonResourceURLs: ["/metrics"], verbs: ["get"] } ]   # scrape any authenticated /metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: aig-metrics-gw, labels: { app.kubernetes.io/managed-by: aig-routing } }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aig-metrics-gw }
subjects: [ { kind: ServiceAccount, name: aig-metrics-gw, namespace: maas-project } ]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: aig-metrics-gw, namespace: maas-project, labels: { app.kubernetes.io/managed-by: aig-routing } }
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr info;
    events { worker_connections 1024; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        location = /healthz { return 200 "ok\n"; }
        location /metrics {
          # inject the rotating SA token toward the authenticated :9090
          access_by_lua_block {
            local f = io.open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r")
            if f then local t = f:read("*a"); f:close(); ngx.req.set_header("Authorization", "Bearer " .. t) end
          }
          proxy_pass http://qwen3-1-7b-epp-service.maas-project.svc.cluster.local:9090/metrics;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aig-metrics-gw, namespace: maas-project, labels: { app.kubernetes.io/managed-by: aig-routing } }
spec:
  replicas: 1
  selector: { matchLabels: { app: aig-metrics-gw } }
  template:
    metadata: { labels: { app: aig-metrics-gw } }
    spec:
      serviceAccountName: aig-metrics-gw
      containers:
        - name: gw
          image: openresty/openresty:alpine
          ports: [ { containerPort: 8080 } ]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3 }
          volumeMounts:
            - { name: conf, mountPath: /usr/local/openresty/nginx/conf/nginx.conf, subPath: nginx.conf }
      volumes: [ { name: conf, configMap: { name: aig-metrics-gw } } ]
---
apiVersion: v1
kind: Service
metadata: { name: aig-metrics-gw, namespace: maas-project, labels: { app.kubernetes.io/managed-by: aig-routing } }
spec:
  selector: { app: aig-metrics-gw }
  ports: [ { name: http, port: 8080, targetPort: 8080 } ]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: aig-metrics-gw, namespace: maas-project, labels: { app.kubernetes.io/managed-by: aig-routing } }
spec:
  to: { kind: Service, name: aig-metrics-gw }
  port: { targetPort: http }
  tls: { termination: edge }   # router terminates TLS (self-signed ingress cert -> hub verifies via caCertPath)
