kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aig-spoke-b
# Spoke = target cluster: gateway + GIE/pod-EPP + inference-sim pool.
nodes:
  - role: control-plane   # single node: rootless podman can't join workers; cp is schedulable in kind
networking:
  podSubnet: "10.30.0.0/16"
  serviceSubnet: "10.130.0.0/16"
