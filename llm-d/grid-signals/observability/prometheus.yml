# Scrape both layers, so ground truth and every peer's view of it are both
# recorded and can be put on one axis.
#
# The collector job keeps honor_timestamps on, which is the default and is the
# point: a relayed sample carries the time its own site measured it, so it lands
# on the time axis where it belongs rather than where it was read. The lag then
# shows up as the observed series holding a value the source has already moved
# past, which is what routing on it actually risks.

global:
  scrape_interval: 1s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Ground truth: what each pool says about itself, read directly.
  - job_name: pool
    metrics_path: /metrics
    static_configs:
      - targets: ["pool-east:8080"]
        labels: {site: "east"}
      - targets: ["pool-west:8080"]
        labels: {site: "west"}
      - targets: ["pool-central:8080"]
        labels: {site: "central"}
      - targets: ["pool-north:8080"]
        labels: {site: "north"}
      - targets: ["pool-south:8080"]
        labels: {site: "south"}

  # The relayed view: what each collector holds, its own site and its peers.
  # Samples arrive already labelled with grid_site and grid_provider, so a
  # series says both who it describes and, through observer, who saw it.
  - job_name: collector
    metrics_path: /metrics
    honor_timestamps: true
    static_configs:
      - targets: ["collector-east:9091"]
        labels: {observer: "east"}
      - targets: ["collector-west:9091"]
        labels: {observer: "west"}
      - targets: ["collector-central:9091"]
        labels: {observer: "central"}
      - targets: ["collector-north:9091"]
        labels: {observer: "north"}
      - targets: ["collector-south:9091"]
        labels: {observer: "south"}

  # The collector's own telemetry: poll outcomes, retries, reachability. This
  # is the operator's registry, not a copy the harness keeps, so what a
  # partition does to these counters here is what it does to them in a cluster.
  - job_name: collector_telemetry
    metrics_path: /telemetry
    static_configs:
      - targets: ["collector-east:9091"]
        labels: {observer: "east"}
      - targets: ["collector-west:9091"]
        labels: {observer: "west"}
      - targets: ["collector-central:9091"]
        labels: {observer: "central"}
      - targets: ["collector-north:9091"]
        labels: {observer: "north"}
      - targets: ["collector-south:9091"]
        labels: {observer: "south"}
