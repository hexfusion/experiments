apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: llm-d-praxis
  labels: { app: praxis }
spec:
  replicas: 1
  selector: { matchLabels: { app: praxis } }
  template:
    metadata:
      labels: { app: praxis }
    spec:
      serviceAccountName: praxis
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: praxis
          image: image-registry.openshift-image-registry.svc:5000/llm-d-praxis/praxis:v0.3.1
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/praxis/config.yaml"]
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ "ALL" ] }
            runAsNonRoot: true
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/praxis, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: praxis-config
            items:
              - { key: config.yaml, path: config.yaml }
---
apiVersion: v1
kind: Service
metadata: { name: praxis, namespace: llm-d-praxis, labels: { app: praxis } }
spec:
  selector: { app: praxis }
  ports:
    - { name: http, port: 8080, targetPort: http }
