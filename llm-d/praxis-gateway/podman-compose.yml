services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose: ["4317"]
    ports:
      - "16686:16686"
      - "4317:4317"

  praxis:
    build:
      context: ./praxis
      dockerfile: Containerfile
      args:
        PRAXIS_REF: v0.3.1
    volumes:
      - ./praxis/config.yaml:/etc/praxis/config.yaml:ro,Z
    command: ["--config", "/etc/praxis/config.yaml"]
    ports:
      - "8080:8080"
    depends_on:
      vllm-sim-1:
        condition: service_started
      vllm-sim-2:
        condition: service_started
      vllm-sim-3:
        condition: service_started
      jaeger:
        condition: service_started

  vllm-sim-1:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
    environment:
      POD_NAME: "vllm-sim-1"
      POD_IP: "vllm-sim-1"
    command: &sim_cmd
      - "--port=8000"
      - "--model=qwen-7b-awq"
      - "--mode=random"
      - "--max-num-seqs=4"
      - "--time-to-first-token=50ms"
      - "--inter-token-latency=10ms"
      - "--enable-kvcache"
      - "--kv-cache-size=1024"
      - "--block-size=16"
      - "--hash-seed=42"
    expose: ["8000"]

  vllm-sim-2:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
    environment:
      POD_NAME: "vllm-sim-2"
      POD_IP: "vllm-sim-2"
    command: *sim_cmd
    expose: ["8000"]

  vllm-sim-3:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
    environment:
      POD_NAME: "vllm-sim-3"
      POD_IP: "vllm-sim-3"
    command: *sim_cmd
    expose: ["8000"]
