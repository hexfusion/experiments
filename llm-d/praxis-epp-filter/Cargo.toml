[package]
name = "praxis-epp-filter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Praxis filter that gets routing decisions from llm-d EPP over plain HTTP"
publish = false

# Marks this crate for Praxis build-time filter discovery. A server that lists
# this crate as a dependency picks the filter up without code changes.
[package.metadata.praxis-filters]

[dependencies]
praxis-filter = { package = "praxis-proxy-filter", path = "../../../../praxis-proxy/praxis/filter" }
praxis-core = { package = "praxis-proxy-core", path = "../../../../praxis-proxy/praxis/core" }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
